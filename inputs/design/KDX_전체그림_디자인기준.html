<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해외 사례 9곳 전체 그림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* 배치: 맨 위 회사 선택 단추와 주장 여섯 장, 아래로 블록 일곱 개. 블록마다 주장, 그림, 해석, 접힌 출처 순서 */
  --bg:#FAF7F7; --panel:#FFFFFF; --ink:#1F1A1B; --muted:#6E6668; --line:#DCD6D7; --band:#F3EEEF;
  --accent:#A32020; --accent2:#DB536A; --soft:#F8DDE1; --on-accent:#FFFFFF; --grey:#C9C2C4;
  --body:"Nanum Gothic",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171314; --panel:#211C1D; --ink:#F2ECED; --muted:#A99FA2; --line:#3B3336; --band:#1D1819;
    --accent:#E57373; --accent2:#EE93A4; --soft:#3A2227; --on-accent:#1B1415; --grey:#5A5054; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171314; --panel:#211C1D; --ink:#F2ECED; --muted:#A99FA2; --line:#3B3336; --band:#1D1819;
  --accent:#E57373; --accent2:#EE93A4; --soft:#3A2227; --on-accent:#1B1415; --grey:#5A5054; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 72px;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;font-weight:800;margin:0;text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted)}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.focusbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.focusbar b{font-size:13px;color:var(--muted);margin-right:4px}
.pill{font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}

.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.glance a{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.glance a:hover{border-color:var(--accent)}
.glance .k{font-size:12.5px;font-weight:800;color:var(--accent)}
.glance .c{font-weight:700;line-height:1.45;text-wrap:pretty}

section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:64px}
.sh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.sh .n{font-size:13px;font-weight:800;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:1px 9px}
.sh h2{font-size:21px;margin:0;font-weight:800}
.claim{font-size:18px;font-weight:800;margin:0;text-wrap:balance}
.read{display:flex;gap:10px;align-items:flex-start;background:var(--band);border-radius:8px;padding:10px 14px}
.read .t{flex:none;font-size:12px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 6px;margin-top:3px}
.read p{margin:0}
details.srcs{font-size:13px;color:var(--muted)}
details.srcs summary{cursor:pointer;width:max-content}
details.srcs ul{margin:6px 0 0;padding-left:18px;display:grid;gap:2px}
.co{font:inherit;font-weight:800;background:none;border:0;padding:0;color:var(--ink);border-bottom:2px solid transparent;text-align:left}
.co:hover{border-bottom-color:var(--accent2)}
.f{transition:opacity .15s}
.dim{opacity:.22}
.hit{background:var(--soft)}
.sub{font-size:14px;font-weight:800;color:var(--muted);margin:6px 0 0}
.note{font-size:14px;color:var(--muted);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:5px;padding:0 6px;white-space:nowrap}
.tag.buy{background:var(--accent);color:var(--on-accent)}
.tag.own{background:var(--soft);color:var(--ink);border:1px solid var(--accent2)}
.tag.lend{border:1.5px dashed var(--muted);color:var(--ink)}
.tag.plan{border:1px solid var(--line);color:var(--muted)}

/* 순서 줄: 회사마다 단계 칩을 시간순으로 */
.tl{display:grid;gap:4px}
.tlrow{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;padding:8px;border-radius:8px;border-top:1px solid var(--line)}
.tlrow:first-child{border-top:0}
.tln small{display:block;color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;align-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--panel);font-size:14px}
.chip.tok{border-left:4px solid var(--accent)}
.chip .cd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 표 */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:12.5px;color:var(--muted);font-weight:700}
th small{display:block;font-weight:400}
td{font-size:14px}
td.empty{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--band) 7px 14px)}
td.grp{font-weight:800;white-space:nowrap}
td.num{white-space:nowrap}
td small{color:var(--muted)}
.hatch{display:inline-block;width:26px;height:13px;border-radius:3px;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--band) 5px 10px);border:1px solid var(--line);vertical-align:-2px}
.cnt{display:flex;align-items:center;gap:8px}
.cnt b{min-width:44px;font-variant-numeric:tabular-nums}
.cbar{height:8px;border-radius:4px;background:var(--accent2)}
.who{display:grid;gap:4px}
.who span{border-radius:6px;padding:1px 4px}
.who small{color:var(--muted);font-size:13px}

/* 한국 연결 */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.box h3{margin:0 0 2px;font-size:15px;font-weight:800}
.kr{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:6px 8px;border-radius:8px;background:var(--band);font-size:14px}

/* 단계 */
.waves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wave{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.wave .wh{background:var(--band);padding:10px 14px;border-bottom:1px solid var(--line)}
.wave .wk{font-size:13px;font-weight:800;color:var(--accent)}
.wave .wt{font-weight:800;line-height:1.4}
.wave ul{list-style:none;margin:0;padding:6px 8px;display:grid;gap:2px}
.wave li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:6px;border-radius:7px;font-size:14px}
.wave .d{font-size:12.5px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.wave .x{font-size:11.5px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:6px}

/* 거래 시설 */
.ats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.acard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.acard h3{margin:0;font-size:17px;font-weight:800}
.share{display:grid;gap:3px}
.share .big{font-size:22px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.share .trk{height:8px;border-radius:4px;background:var(--band);overflow:hidden}
.share .trk i{display:block;height:100%;background:var(--accent)}
.share small{color:var(--muted);font-size:12.5px}
.fld{display:grid;gap:1px;font-size:14px}
.fld b{font-size:12.5px;color:var(--muted)}
.fld.take b{color:var(--accent)}
.ev{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ev li{display:grid;grid-template-columns:98px 128px minmax(0,1fr);gap:10px;padding:6px 8px;border-radius:7px;font-size:14px;border-top:1px solid var(--line)}
.ev li:first-child{border-top:0}
.ev .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}

/* 요약 */
.ones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.one{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.one .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.one .ty{font-size:12.5px;font-weight:800;color:var(--accent);white-space:nowrap}
.one .id{color:var(--muted);font-size:14px}
.one .size{font-size:14px}
.one .see{font-weight:700}
.one .tok{font-size:12.5px;color:var(--muted);margin-top:auto}

@media (max-width:860px){
  .glance{grid-template-columns:1fr 1fr}
  .waves,.ats,.ones,.two{grid-template-columns:1fr}
  .tlrow{grid-template-columns:1fr}
  .ev li{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.f{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>해외 사례 9곳 전체 그림</h1>
    <p class="lead">대상: 가상자산 거래소 3곳(Binance, Kraken, Coinbase), 증권 중개 앱 1곳(Robinhood), 토큰화 전문 회사 2곳(Ondo, Dinari), 미국 야간 ATS(대체거래소) 3곳(Blue Ocean, Bruce, MOON)</p>
    <p class="lead">정리 순서: KDX의 자산, 고객, 시장 확장과 거래 시설 운영에 대응하는 질문 순. 회사 이름 선택 시 해당 회사만 강조 표시</p>
  </header>
  <div class="focusbar" id="focusbar" role="group" aria-label="회사 선택"></div>
  <nav class="glance" id="glance" aria-label="주장 한눈에 보기"></nav>
  <div id="blocks" style="display:flex;flex-direction:column;gap:18px"></div>
</div>
<script>
"use strict";
const NAMES={binance:"Binance",kraken:"Kraken",coinbase:"Coinbase",robinhood:"Robinhood",ondo:"Ondo",dinari:"Dinari","blue-ocean":"Blue Ocean",bruce:"Bruce",moon:"MOON"};
const TYPE={binance:"가상자산 거래소",kraken:"가상자산 거래소",coinbase:"가상자산 거래소",robinhood:"증권 중개 앱",ondo:"토큰화 전문 회사",dinari:"토큰화 전문 회사","blue-ocean":"야간 ATS",bruce:"야간 ATS",moon:"야간 ATS"};
const SIX=["binance","kraken","coinbase","robinhood","ondo","dinari"];
const ATS3=["blue-ocean","bruce","moon"];
const MT={"직접":"own","인수":"buy","제휴":"lend","위탁":"lend","계획":"plan"};

const GLANCE=[
  ["asset","자산 확장","주식 토큰은 6곳 중 5곳에서 본업 자산 뒤에 더한 여러 자산 중 하나이며, 파생 거래소는 3곳 모두 인수로 확보함"],
  ["cust","고객 확장","기관, 자문사, 증권사 고객은 인수와 제휴로 더한 사례가 많고, Coinbase는 기관 현물 거래대금이 개인의 약 4.7배임"],
  ["market","시장 확장","9곳 중 7곳이 한국과 연결되어 있고, 그중 5곳은 한국 증권사와 제휴하거나 투자를 받은 방식임"],
  ["role","발행과 판매의 역할 분담","주식 토큰은 발행, 판매, 원주 보관을 서로 다른 회사가 나눠 맡으며 시작했고, 발행은 판매 채널 보유 회사로 이동함"],
  ["ats","거래 시설의 주문 확보","주문 채널을 주주로 둔 Bruce는 점유율이 12.3%(2026 Q2)에서 29.8%(10월 최근 3주)로 상승, 백업 계약에 그친 MOON은 3.8%에서 2.0%로 하락함"],
  ["reg","인가 경로","증권 자격은 직접 등록, 파생 자격은 인수 사례가 많으며, 미국 거래 시설은 인가가 아닌 등록과 신고로 운영됨"]
];
const TITLE={
  asset:"자산 확장 순서와 방법",
  cust:"고객 확장 대상과 방법",
  market:"국가 확장 방법과 한국 연결",
  role:"주식 토큰의 발행, 판매, 보관 역할 분담",
  ats:"야간 거래 시설(ATS) 3곳의 주문 확보 방식",
  reg:"미국 등록 종류별 전체 수와 9곳 보유 현황",
  ones:"회사별 요약"
};

/* 1 자산: [시점, 내용, 방법, 주식 토큰 단계 여부] */
const ASSET={
  binance:[["2017-07","가상자산 거래소","직접"],["2021-04","주식 토큰 출시(2021-10 종료)","직접",1],["2026-02","Ondo 주식 토큰 상장","제휴",1],["2026-06","주식 토큰(bStocks) 발행","직접",1],["2026-09","주식 토큰의 선물 담보 활용","직접",1]],
  kraken:[["2011","가상자산 거래소","직접"],["2025-05","선물 중개사(NinjaTrader)","인수"],["2025-06","주식 토큰(xStocks) 판매","직접",1],["2025-10","파생 거래소(Small Exchange)","인수"],["2025-12","주식 토큰 발행사(Backed)","인수",1],["2026-05","선물 거래소와 청산소(Bitnomial)","인수"],["","비상장 기업 주식의 토큰 공모(xPO)","계획"]],
  coinbase:[["","가상자산 거래소","직접"],["2018-09","달러 스테이블코인(USDC)","제휴"],["2022","파생 거래소(FairX)","인수"],["2025-08","옵션 거래소(Deribit)","인수"],["2026","예측시장","직접"],["2026-02","앱 내 주식, ETF 거래","직접"],["2026-08","주식 토큰(자체 블록체인 Base)","직접",1],["2026-09","선물 청산소(Coinbase Clearing)","직접"]],
  robinhood:[["2013","미국 주식","직접"],["2019-01","가상자산","직접"],["2025-06","가상자산 거래소(Bitstamp)","인수"],["2025-06","EU 주식 토큰, 비상장 회사 토큰","직접",1],["2026-01","선물, 예측시장 거래소(MIAXdx 지분 90%)","인수"],["2026-07","자체 블록체인, 지갑용 주식 토큰","직접",1],["","선물 중개","직접"],["","EU 머니마켓펀드(J.P. Morgan)","제휴"]],
  ondo:[["2021~","단기 국채 토큰(OUSG), 담보부 노트(USDY)","직접"],["2025-09","주식 토큰(미국 밖)","직접",1],["2025-10","미국 증권사, ATS, 명의개서대리인(Oasis Pro)","인수"],["2026-07","미국용 보관형 주식 토큰","직접",1],["2026-09","BlackRock 전략 포트폴리오 3종","제휴"]],
  dinari:[["2023-08","미국 주식 토큰(dShares)","직접",1],["","국채 담보 달러 토큰(USD+)","직접"],["2025-06","미국 증권사(Dinari Securities) 등록","직접"],["2025-08","자체 거래망(Dinari Financial Network)","직접"],["2026-07","브로커리지, 수탁(tZERO)","제휴"],["","청산, 결제(Alpaca)","위탁"]]
};

/* 2 고객: [개인, 기관과 자문사, 다른 회사를 통한 공급] */
const CCOLS=["개인","기관, 자문사","다른 회사를 통한 공급"];
const CUST={
  binance:["거래소 이용자에 직접 판매, 40개 언어 지원",null,null],
  kraken:["미국 밖 선택 국가 개인에 주식 토큰 직접 판매","기관 대상 서비스(Prime): 펀드, 은행, 재무부서","해외주식 중개 인프라 회사(GTN) 제휴로 GTN의 기관 고객에 주식 토큰 제공 계획(2026-07)"],
  coinbase:["현물 거래대금 234억 달러(2026 Q3, 회사 발표)","현물 거래대금 1,111억 달러(2026 Q3, 회사 발표), 옵션(Deribit)은 기관에 먼저 제공",null],
  robinhood:["앱 고객 2,870만 명(2026 Q3, 회사 발표), 관리계좌(Strategies) 출시(2025-03)","투자자문사(RIA)용 수탁 플랫폼(TradePMR) 인수(2025-02)",null],
  ondo:["담보부 노트(USDY)와 주식 토큰을 미국 밖 개인에 직접 판매","단기 국채 토큰(OUSG)은 미국 적격투자자 대상, USDY와 주식 토큰은 미국 밖 기관 포함","거래소와 지갑에 공급(Binance 상장 2026-02)"],

  <p class="sub">한국과의 연결</p><div class="two">${kr}</div>
  <p class="sub">국가를 넓힌 순서와 방법</p>${mlegend()}
  ${tl(MARKET)}
  ${read("해외 진출은 현지 인가 직접 취득(Kraken의 EU 2건, Binance의 두바이와 아부다비)과 현지 회사 인수(Robinhood의 Bitstamp, WonderFi)로 나뉨. 한국 주식을 해외에 유통하려는 3곳(Ondo, Dinari, Kraken) 중 2곳이 카카오페이증권과 제휴함")}${srcs("market")}</section>`;
}
function roleBlock(){
  const cols=WAVES.map(w=>`<div class="wave"><div class="wh"><div class="wk">${w.k} ${w.p}</div><div class="wt">${esc(w.t)}</div></div><ul>${w.ev.map(e=>`<li class="f" data-co="${e[1]}"><span class="d">${e[0]}</span><span>${coBtn(e[1])}${e[3]?`<span class="x">${e[3]}</span>`:""}<br>${esc(e[2])}</span></li>`).join("")}</ul></div>`).join("");
  const sh=v=>v?`${v[0]}위 ${v[1]}%`:"순위표에 없음";
  const rows=ROLE.map(r=>`<tr class="f" data-co="${r[0]}"><td>${coBtn(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td class="num">${sh(r[4])} → <b>${sh(r[5])}</b></td></tr>`).join("");
  return `<section class="card" id="role">${head(4,"role")}
  <div class="waves">${cols}</div>
  <p class="sub">현재의 역할 분담과 점유율 변화</p>
  <div class="scroll"><table><thead><tr><th style="width:104px">회사</th><th>발행</th><th>판매</th><th>원주 보관</th><th>점유율<small>2026-01 초 → 2026-11-16, 유통 중인 토큰 가치 기준</small></th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">시장 규모: 2026-01 초 8.01억 달러(순위표 9곳 합계) → 2026-11-16 37.1억 달러(4.6배), rwa.xyz 집계</p>
  ${read("2단계에서는 전문 회사가 발행하고 거래소가 판매했으나(Backed와 Kraken, Ondo와 Binance), 3단계에서 Kraken, Binance, Robinhood, Coinbase가 직접 발행으로 전환함. 원주 보관에는 6곳 모두 Alpaca(미국 증권 중개사)가 포함됨. 2026-01 순위표에 없던 Binance가 2026-11 1위에 올랐고, 1위였던 Ondo는 51.59%에서 24.23%로 하락함")}${srcs("role")}</section>`;
}
function atsBlock(){
  const cards=ATS.map(a=>`<div class="acard f" data-co="${a.id}"><h3>${coBtn(a.id)}</h3>
    <div class="share"><span class="big">${a.q3.toFixed(1)}%</span><div class="trk"><i style="width:${a.q3}%"></i></div><small>야간 3곳 거래대금 점유율, 2026 Q3(Q2 ${a.q2.toFixed(1)}%). 거래대금 ${a.amt}${a.extra?`. ${a.extra}`:""}</small></div>
    <div class="fld"><b>운영과 주주</b><span>${esc(a.own)}</span></div>
    <div class="fld"><b>주문을 보내는 곳</b><span>${esc(a.flow)}</span></div>
    <div class="fld take"><b>KDX가 가져올 것</b><span>${esc(a.take)}</span></div>
    <div class="fld take"><b>KDX가 피할 것</b><span>${esc(a.avoid)}</span></div></div>`).join("");
  const ev=EVENTS.map(e=>`<li class="f" data-co="${e[1]||"kr"}"><span class="d">${e[0]}</span><span>${e[1]?coBtn(e[1]):"<b>한국 증권사</b>"}</span><span>${esc(e[2])}</span></li>`).join("");
  return `<section class="card" id="ats">${head(5,"ats")}
  <div class="ats">${cards}</div>
  <p class="sub">사고와 중단, 한국 연결 연표</p><ul class="ev">${ev}</ul>
  ${read("KDX는 주문을 모으는 거래 시설이라는 점에서 이 3곳과 사업 형태가 가까움. 선발 Blue Ocean은 2024-08 사고로 한국 주간거래가 약 15개월 중단됐고, 2026-09 종목 중단 뒤 한국 증권사 2곳(메리츠증권, 토스증권)이 Bruce 시세를 연결함")}${srcs("ats")}</section>`;
}
function regBlock(){
  const mx=Math.log10(3184);
  const who=a=>a.length?`<div class="who">${a.map(x=>`<span class="f" data-co="${x[0]}">${coBtn(x[0])} <small>${esc(x[1])}</small></span>`).join("")}</div>`:"";
  const rows=REG.map(r=>`<tr><td class="grp">${esc(r[0])}</td><td>${esc(r[1])}</td><td class="num">${r[2]?`<div class="cnt"><b>${r[2].toLocaleString("en-US")}곳</b><span class="cbar" style="width:${Math.round(Math.log10(r[2])/mx*90)}px"></span></div>${r[3]?`<small>${esc(r[3])}</small>`:""}`:""}</td><td>${who(r[4])}</td><td>${who(r[5])}</td></tr>`).join("");
  return `<section class="card" id="reg">${head(6,"reg")}
  <div class="scroll"><table><thead><tr><th></th><th>미국 등록 종류</th><th>전체 수</th><th>직접 등록한 회사</th><th>인수로 확보한 회사</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">미국 밖 투자설명서 승인: 리히텐슈타인 FMA(Kraken, Ondo, Robinhood), 아부다비 ADGM(Binance, Coinbase). Binance는 미국 등록 없이 아부다비 인가 3종(거래소, 청산과 수탁, 중개)을 취득함</p>
  ${read("브로커딜러는 3,184곳으로 많으나 증권거래소(29곳)와 청산기관(9곳)은 소수이며 9곳 중 보유한 곳이 없음. 미국 ATS는 브로커딜러 등록과 Form ATS-N 신고로 운영되고, 한국 ATS는 금융위 인가가 필요함(넥스트레이드 2025-02 본인가)")}${srcs("reg")}</section>`;
}
function onesBlock(){
  const cards=ONES.map(o=>`<div class="one f" data-co="${o[0]}"><div class="top">${coBtn(o[0])}</div><div class="id">${esc(o[1])}</div>${o[2]?`<div class="size">${esc(o[2])}</div>`:""}<div class="see">${esc(o[3])}</div>${o[4]?`<div class="tok">${esc(o[4])}(2026-11-16)</div>`:""}</div>`).join("");
  return `<section class="card" id="ones"><div class="sh"><span class="n">7</span><h2>${TITLE.ones}</h2></div><p class="claim">회사 성격, 본업 규모, 사례로 볼 점</p><div class="ones">${cards}</div>${srcs("ones")}</section>`;
}
function paint(){
  document.querySelectorAll("#focusbar .pill").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pick===focus)));
  document.querySelectorAll(".f").forEach(el=>{const on=!focus||el.dataset.co===focus;el.classList.toggle("dim",!on);el.classList.toggle("hit",!!focus&&on)});
}
function init(){
  const pill=id=>`<button type="button" class="pill" data-pick="${id}">${esc(NAMES[id])}</button>`;
  document.getElementById("focusbar").innerHTML=`<b>회사 선택</b><button type="button" class="pill" data-pick="">전체</button>`+SIX.map(pill).join("")+`<span class="sep" aria-hidden="true"></span>`+ATS3.map(pill).join("");
  document.getElementById("glance").innerHTML=GLANCE.map(g=>`<a href="#${g[0]}"><span class="k">${esc(g[1])}</span><span class="c">${esc(g[2])}</span></a>`).join("");
  document.getElementById("blocks").innerHTML=assetBlock()+custBlock()+marketBlock()+roleBlock()+atsBlock()+regBlock()+onesBlock();
  document.addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(!b)return;const id=b.dataset.pick;focus=(id===focus)?"":id;paint()});
  paint();
}
init();
</script>
</body>
</html>
