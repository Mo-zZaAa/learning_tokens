\",\"meta_data\":{\"title\":\"Bank of Russia clears crypto exchangers, Sberbank and VTB\",\"description\":\"\"},\"sub_vertical\":\"internal\",\"content_elements\":[{\"_id\":\"section-info-0\",\"type\":\"custom_embed\",\"subtype\":\"section-info\",\"embed\":{\"id\":\"\",\"config\":{\"text\":\"The Bank of Russia has added 17 firms to its crypto exchange register since 6 October, including Sberbank and VTB.\\nVTB plans to open crypto trading to retail investors in November; Sberbank is targeting 1 December.\\nRetail buyers will be limited to 300,000 roubles a year per intermediary, while qualified investors face no cap.\",\"title\":\"\"}}},{\"_id\":\"paragraph-1-0\",\"type\":\"text\",\"content\":\"Russia's central bank is rapidly widening the list of firms allowed to trade crypto, as the country's two biggest lenders prepare to sell Bitcoin and other coins to ordinary customers before the end of the year.\"},{\"_id\":\"paragraph-2-0\",\"type\":\"text\",\"content\":\"The Bank of Russia added a 17th company, Prosto LLC, to its register of crypto exchange providers on Thursday, according to \u003ca href=\\\"https://www.cbr.ru/rbr/rbr_fr/doc?id=51731\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ea notice on the regulator's website\u003c/a\u003e. The register had four members when it opened on 6 October. The separate register of digital depositories, which record who owns which coins, now has eight.\"},{\"_id\":\"paragraph-3-0\",\"type\":\"text\",\"content\":\"The registrations put into practice a law \\\"On Digital Currencies and Digital Rights\\\", which took effect on 1 September and brings crypto trading inside Russia's regulated financial system for the first time.\"},{\"_id\":\"heading-4\",\"type\":\"header\",\"level\":2,\"content\":\"Sberbank and VTB hold both licences\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-5-0\",\"type\":\"text\",\"content\":\"Sberbank and VTB, Russia's largest state-controlled banks, were among the first five digital depositories approved on 6 October, \u003ca href=\\\"https://www.cbr.ru/press/event?id=32894\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe central bank said\u003c/a\u003e. VTB was also listed as a crypto exchange provider that day. Sberbank joined the exchange register on 12 October, \u003ca href=\\\"https://interfax.com/newsroom/top-stories/119511/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eInterfax reported\u003c/a\u003e.\"},{\"_id\":\"paragraph-6-0\",\"type\":\"text\",\"content\":\"Holding both statuses lets a bank buy and sell crypto in its own name and keep the record of clients' holdings. Exchange providers can trade digital currencies for their own account outside organised venues, while depositories record and transfer the assets and give clients access to the addresses where they are held, according to the central bank.\"},{\"_id\":\"paragraph-7-0\",\"type\":\"text\",\"content\":\"VTB's broker carried out its first stablecoin deals for corporate clients on 6 October, settling them through accounts at its new digital depository, the bank said.\"},{\"_id\":\"paragraph-8-0\",\"type\":\"text\",\"content\":\"\\\"We expect to open access to digital currency trading for a broad range of investors through VTB My Investments and directly through the bank's exchange in November and December 2026 respectively,\\\" Vitaly Sergeichuk, VTB's deputy president and chairman of the management board, said, \u003ca href=\\\"https://www.interfax.ru/business/1120700\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eaccording to Interfax\u003c/a\u003e.\"},{\"_id\":\"paragraph-9-0\",\"type\":\"text\",\"content\":\"Sberbank plans to launch its first crypto products on 1 December through apps its customers already use, though the timing depends on the regulations being ready, Interfax reported. The bank is already testing Bitcoin, Ether and USDT trades in its app, \u003ca href=\\\"https://www.coindesk.com/business/2026/10/13/russia-s-largest-bank-sberbank-secures-approval-to-trade-crypto\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eCoinDesk reported\u003c/a\u003e.\"},{\"_id\":\"heading-10\",\"type\":\"header\",\"level\":2,\"content\":\"Limits for retail buyers\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-11-0\",\"type\":\"text\",\"content\":\"The new rules draw a sharp line between retail and professional investors.\"},{\"_id\":\"paragraph-12-0\",\"type\":\"text\",\"content\":\"Non-qualified investors will be able to buy only the most liquid cryptocurrencies, up to 300,000 roubles, or about $3,800, a year through any one intermediary, and only after passing a test, \u003ca href=\\\"https://www.cbr.ru/eng/press/event?id=32724\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe central bank said in July\u003c/a\u003e. Qualified investors must also pass the test but can buy and sell any cryptocurrency without a limit.\"},{\"_id\":\"now-read-13\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/regulation/russian-illegal-crypto-exchange-operators-face-7-years-hard-labour-new-laws/\",\"text\":\"\"}}},{\"_id\":\"paragraph-14-0\",\"type\":\"text\",\"content\":\"Using crypto to pay for goods and services inside Russia remains banned.\"},{\"_id\":\"paragraph-15-0\",\"type\":\"text\",\"content\":\"Exporters and importers, however, can use crypto for cross-border settlements without restrictions, either through intermediaries or directly from any type of wallet.\"},{\"_id\":\"paragraph-16-0\",\"type\":\"text\",\"content\":\"Sberbank moved first on that front. On 1 September it launched crypto payments for companies engaged in foreign trade, with wallet-to-wallet transfers taking a couple of minutes, no minimum payment and an average cost of 0.3%, first deputy chairman Alexander Vedyakhin said, \u003ca href=\\\"https://www.interfax.ru/business/1112364\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eaccording to Interfax\u003c/a\u003e.\"},{\"_id\":\"paragraph-17-0\",\"type\":\"text\",\"content\":\"The service followed a central bank pilot that had run under an experimental legal regime since September 2024, Vedyakhin said.\"},{\"_id\":\"heading-18\",\"type\":\"header\",\"level\":2,\"content\":\"Smaller players pile in\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-19-0\",\"type\":\"text\",\"content\":\"The two state banks are not alone. T-Technologies, the parent of T-Bank, has registered its units Atomyze as a depository and T-Invest Lab as an exchange provider.\"},{\"_id\":\"paragraph-20-0\",\"type\":\"text\",\"content\":\"A string of newly formed companies have since joined the exchange register, central bank records show. MTS Bank has said it plans to launch basic crypto services in the fourth quarter, Interfax reported.\"},{\"_id\":\"paragraph-21-0\",\"type\":\"text\",\"content\":\"Banks and other licensed institutions can join the registers through a simplified procedure that takes one working day, according to the central bank.\"},{\"_id\":\"now-read-23\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/markets/russian-crypto-regulation-set-for-july-rollout/\",\"text\":\"\"}}},{\"_id\":\"heading-23\",\"type\":\"header\",\"level\":2,\"content\":\"What's next\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-24-0\",\"type\":\"text\",\"content\":\"Firms already on the registers have until 1 September 2027 to bring their operations fully in line with the law, \u003ca href=\\\"https://www.cbr.ru/press/event?id=32894\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe central bank said\u003c/a\u003e.\"},{\"_id\":\"paragraph-25-0\",\"type\":\"text\",\"content\":\"From 1 July 2027, Russian residents will be allowed to trade crypto only through registered intermediaries, \u003ca href=\\\"https://www.cbr.ru/explan/cryptocurrency/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe regulator said\u003c/a\u003e, which would effectively end peer-to-peer trading settled through Russian bank accounts. Authorities plan to introduce penalties for unlicensed crypto intermediaries from the same date, mirroring those for illegal banking.\"},{\"_id\":\"paragraph-26-0\",\"type\":\"text\",\"content\":\"\u003cem\u003eKyle Pare is a reporter for DL News. Have a tip? Contact Kyle at \u003c/em\u003e\u003ca href=\\\"mailto:kyle@dlnews.com\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003e\u003cem\u003ekyle@dlnews.com\u003c/em\u003e\u003c/a\u003e\u003cem\u003e.\u003c/em\u003e\"}],\"guests\":[],\"subtype\":\"684aaabcc107f95de7aab4a4\",\"authors\":[\"6ad32f6fe8a2a0ba2951e576\"],\"main_asset\":\"6ad78ff13157f514e3cf2312\",\"main_asset_info\":{\"article_caption\":\"St. Basil's Cathedral, Moscow; Image: szeke / Flickr, CC BY-SA 2.0\",\"copyright\":\"CC BY-SA 2.0\",\"credit\":\"Image: szeke / Flickr\",\"headline\":\"St. Basil’s Cathedral, Moscow\",\"_id\":\"6ad78ff13157f514e3cf2312\",\"src_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/images/1792511985669-asset.webp\"},\"verticals\":[\"684aad1fc107f95de7aab4b0\"],\"tags\":[\"699f299bae4db303cff441ae\",\"68df7e78bf9470d72063153d\"],\"workflow\":\"published\",\"story_info\":{\"words_count\":681,\"assets_count\":0,\"embeds_count\":3},\"previous_urls\":[],\"slug\":\"bank-of-russia-clears-crypto-exchangers-sberbank-and-vtb\",\"created_at\":\"2026-10-20T16:06:02.174Z\",\"updated_at\":\"2026-10-22T23:20:00.064Z\",\"__v\":1,\"display_date\":\"2026-10-22T23:20:00.906Z\",\"first_publish_date\":\"2026-10-22T23:20:00.906Z\",\"primary_vertical\":\"684aad1fc107f95de7aab4b0\",\"publish_date\":\"2026-10-22T23:20:00.906Z\",\"url\":\"https://www.dlnews.com/articles/regulation/bank-of-russia-clears-crypto-exchangers-sberbank-and-vtb/\",\"subtypeObject\":{\"_id\":\"684aaabcc107f95de7aab4a4\",\"name\":\"News\",\"slug\":\"articles\"},\"mainAssetObject\":{\"_id\":\"6ad78ff13157f514e3cf2312\",\"meta_data\":{\"description\":\"St. Basil’s Cathedral, Moscow\"},\"is_active\":true,\"is_deleted\":false,\"type\":\"illustration\",\"keywords\":[\"Russia\",\"Moscow\"],\"subtypes\":[\"684aaabcc107f95de7aab4a4\"],\"main_asset_story_aggregate\":1,\"homepage_asset_story_aggregate\":0,\"social_media_asset_story_aggregate\":0,\"events_images_aggregate\":0,\"reports_images_aggregate\":0,\"users_images_aggregate\":0,\"created_at\":\"2026-10-20T15:59:45.503Z\",\"updated_at\":\"2026-10-20T15:59:45.503Z\",\"mime_type\":\"image\",\"headline\":\"St. Basil’s Cathedral, Moscow\",\"credit\":\"Image by szeke\",\"copyright\":\"Licensed under CC BY-SA 2.0\",\"image_caption\":\"St. Basil’s Cathedral, Moscow; Illustration: Image by szeke; Source: Licensed under CC BY-SA 2.0;\",\"article_caption\":\"St. Basil’s Cathedral, Moscow; Illustration: Image by szeke; Source: Licensed under CC BY-SA 2.0;\",\"thumbnail_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/thumbnails/1792511986391-asset.webp\",\"src_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/images/1792511985669-asset.webp\",\"__v\":0,\"last_used_at\":\"2026-10-22T23:20:00.064Z\",\"last_used_by\":\"6a349704180e41a1b12d2197\"},\"tagsObjects\":[{\"_id\":\"68df7e78bf9470d72063153d\",\"slug\":\"stablecoin\",\"name\":\"Stablecoin\"},{\"_id\":\"699f299bae4db303cff441ae\",\"name\":\"Russia\",\"slug\":\"russia\"}],\"authorsObjects\":[{\"_id\":\"6ad32f6fe8a2a0ba2951e576\",\"first_name\":\"Kyle\",\"last_name\":\"Pare\",\"name\":\"Kyle Pare\",\"slug\":\"kyle-pare\"}],\"primaryVerticalObject\":{\"_id\":\"684aad1fc107f95de7aab4b0\",\"name\":\"Regulation\",\"slug\":\"regulation\"},\"verticalsObjects\":[{\"_id\":\"684aad1fc107f95de7aab4b0\",\"name\":\"Regulation\",\"slug\":\"regulation\"}]},{\"_id\":\"6ada37b33157f514e3cf2328\",\"is_active\":true,\"is_deleted\":false,\"headline\":\"Securitize shares slide 38% since it put Apple and Nvidia stock on Solana\",\"subheadline\":\"\",\"description\":\"Securitize stock is down 38% since it launched tokenised Apple, Nvidia and Tesla shares on Solana. It still hasn't said how much trades.\",\"meta_data\":{\"title\":\"Securitize shares fall 38% since Solana stock-token launch | DL News\",\"description\":\"\"},\"sub_vertical\":\"internal\",\"content_elements\":[{\"_id\":\"section-info-0\",\"type\":\"custom_embed\",\"subtype\":\"section-info\",\"embed\":{\"id\":\"\",\"config\":{\"text\":\"Securitize shares have fallen 38% since the company launched tokenised US stocks on Solana on 8 October.\\nThe firm has not disclosed trading volumes or holder numbers for its 12 stock tokens.\\nA US venue that could list them, OKXICE, could not start trading before 3 November at the earliest.\",\"title\":\"\"}}},{\"_id\":\"paragraph-1-0\",\"type\":\"text\",\"content\":\"Shares in Securitize have fallen sharply in the two weeks since the tokenisation firm began offering blockchain versions of Apple, Nvidia and Tesla stock.\"},{\"_id\":\"paragraph-2-0\",\"type\":\"text\",\"content\":\"SECZ was trading at $7.81 at 1:13pm ET on Thursday, down 15% on the day, according to \u003ca href=\\\"https://finance.yahoo.com/quote/SECZ/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eYahoo Finance data\u003c/a\u003e. That is 38% below its $12.66 close on 8 October, the day Securitize announced Securitize Stocks, and 43% below its $13.82 close the next day.\"},{\"_id\":\"paragraph-3-0\",\"type\":\"text\",\"content\":\"The stock jumped 11% on launch day and a further 9% the next session. It then gave up those gains, including drops of 14% on 12 October and 13% on 16 October.\"},{\"_id\":\"paragraph-4-0\",\"type\":\"text\",\"content\":\"Citi downgraded the stock to neutral from buy on 13 October, citing questions over how much revenue Securitize can earn from tokenisation and the risk of lock-up expiries adding shares to the market, \u003ca href=\\\"https://www.coindesk.com/podcasts/public-keys-at-nyse/citi-reveals-top-crypto-stock-picks-ahead-of-q3-earnings\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCoinDesk reported\u003c/a\u003e.\"},{\"_id\":\"paragraph-5-0\",\"type\":\"text\",\"content\":\"The launch put 12 US stocks onchain, among them Apple, Microsoft, Nvidia, Alphabet, Tesla, Meta, Amazon, Netflix, Circle, Strategy and Palantir.\"},{\"_id\":\"paragraph-6-0\",\"type\":\"text\",\"content\":\"\\\"Eligible investors can hold tokenized positions backed 1:1 by actual shares, with shareholder rights intact,\\\" Securitize said on X.\"},{\"_id\":\"oembed-7\",\"type\":\"oembed_response\",\"subtype\":\"twitter\",\"raw_oembed\":{\"html\":\"\u003cblockquote class=\\\"twitter-tweet\\\"\u003e\u003cp lang=\\\"en\\\" dir=\\\"ltr\\\"\u003eWe launched Securitize Stocks to bring some of the most widely held U.S. equities onchain, starting with AAPL, NVDA, TSLA and more on \u003ca href=\\\"https://x.com/solana?ref_src=twsrc%5Etfw\\\"\u003e@solana\u003c/a\u003e.\u003cbr\u003e\u003cbr\u003eEligible investors can hold tokenized positions backed 1:1 by actual shares, with shareholder rights intact.\u003cbr\u003e\u003cbr\u003eTokenize the World. \u003ca href=\\\"https://t.co/Rar7hCQgcY\\\"\u003ehttps://t.co/Rar7hCQgcY\u003c/a\u003e \u003ca href=\\\"https://t.co/zsqReDhNWt\\\"\u003epic.twitter.com/zsqReDhNWt\u003c/a\u003e\u003c/p\u003e\u0026mdash; Securitize (@Securitize) \u003ca href=\\\"https://x.com/Securitize/status/2108256145970266404?ref_src=twsrc%5Etfw\\\"\u003eOctober 8, 2026\u003c/a\u003e\u003c/blockquote\u003e\\n\u003cscript async src=\\\"https://platform.x.com/widgets.js\\\" charset=\\\"utf-8\\\"\u003e\u003c/script\u003e\\n\\n\",\"url\":\"https://x.com/Securitize/status/2108256145970266404\"}},{\"_id\":\"heading-8\",\"type\":\"header\",\"level\":2,\"content\":\"No numbers yet\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-9-0\",\"type\":\"text\",\"content\":\"Securitize has not published trading volumes or holder counts for the tokens. \u003ca href=\\\"https://solanacompass.com/news/securitize-launches-securitize-stocks-on-solana-12-us-equities-as-11-backed-security-entitlements\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eSolana Compass\u003c/a\u003e, which tracks tokens on the network, said they did \\\"not yet appear\\\" in its data.\"},{\"_id\":\"paragraph-10-0\",\"type\":\"text\",\"content\":\"The release did not define which investors are eligible, beyond saying access is subject to KYC checks and \\\"jurisdictional eligibility\\\".\"},{\"_id\":\"paragraph-11-0\",\"type\":\"text\",\"content\":\"The tokens trade on Securitize's own broker-dealer platform on Solana, with Jump Trading as market maker and settlement in USDC. Trading runs in extended hours for now. Securitize says it plans to move to 24/7 trading.\"},{\"_id\":\"paragraph-12-0\",\"type\":\"text\",\"content\":\"Securitize did not immediately respond to a request for comment.\"},{\"_id\":\"heading-13\",\"type\":\"header\",\"level\":2,\"content\":\"Crowded field\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-14-0\",\"type\":\"text\",\"content\":\"Securitize is not first. Wallets holding the xStocks Apple token on Solana rose from about 15,400 in July to about 43,000 on 8 October, \u003ca href=\\\"https://solanacompass.com/news/securitize-launches-securitize-stocks-on-solana-12-us-equities-as-11-backed-security-entitlements\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eSolana Compass\u003c/a\u003e data shows.\"},{\"_id\":\"paragraph-15-0\",\"type\":\"text\",\"content\":\"Solana handled 34% of tokenised-stock trading over the past week, about $120 million a day, according to \u003ca href=\\\"https://stakecake.com/solana-onchain/tokenized-equities/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eStakecake\u003c/a\u003e.\"},{\"_id\":\"paragraph-16-0\",\"type\":\"text\",\"content\":\"Securitize argues its model differs. Each token is a security entitlement backed by a real share, with dividends and, where they apply, voting rights. Investors may be able to convert the tokens into registered shares if the issuing company adopts tokenisation.\"},{\"_id\":\"paragraph-17-0\",\"type\":\"text\",\"content\":\"That structure matters under the SEC's Innovation Exemption, issued on 17 September. It lets new venues trade tokenised stocks only if they carry the same rights as the underlying shares. Synthetic products are excluded.\"},{\"_id\":\"paragraph-18-0\",\"type\":\"text\",\"content\":\"Robinhood's stock tokens are debt securities and are not offered in the US. Its crypto chief, Johann Kerbrat, told \u003ca href=\\\"https://www.theblock.co/news/regulation/2026-10-02-secs-innovation-exemption-robinhood-417538\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eThe Block\u003c/a\u003e that the exemption's volume caps would bite.\"},{\"_id\":\"now-read-20\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/snapshot/blackrock-ceo-touts-tokenisation-as-antidote-to-ai-threats/\",\"text\":\"\"}}},{\"_id\":\"heading-20\",\"type\":\"header\",\"level\":2,\"content\":\"What's next\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-21-0\",\"type\":\"text\",\"content\":\"Securitize expects the tokens to trade on OKXICE, a venue jointly owned by NYSE parent ICE and OKX. It also expects them on the NYSE's planned 24/7 platform.\"},{\"_id\":\"paragraph-22-0\",\"type\":\"text\",\"content\":\"OKXICE first published its \u003ca href=\\\"https://www.okx.com/cdn/assets/files/2610/885D864537A8DF6D.pdf\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003epublic notice on 4 October\u003c/a\u003e and has updated it since, \u003ca href=\\\"https://www.okx.com/en-us/okxicetsv\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003emost recently on 19 October\u003c/a\u003e. Trading will run through permissioned Uniswap v4 pools on OKX's XLayer network, open only to verified wallets.\"},{\"_id\":\"paragraph-23-0\",\"type\":\"text\",\"content\":\"Under the SEC exemption, issuers get 30 days to object before a venue can trade their stock, \u003ca href=\\\"https://www.coindesk.com/markets/2026/10/05/okx-and-nyse-s-owner-file-for-round-the-clock-tokenized-trading-in-u-s-stocks\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCoinDesk reported\u003c/a\u003e. Counted from the 4 October notice, that means OKXICE could not start trading before 3 November. It has not given a launch date.\"},{\"_id\":\"paragraph-24-0\",\"type\":\"text\",\"content\":\"Its volume will be capped. For the most heavily traded stocks, each token's trading cannot exceed 0.25% of the underlying stock's average daily volume in the prior month, \u003ca href=\\\"https://www.okx.com/cdn/assets/files/2610/F085D8D65135AB9C.pdf\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eaccording to the notice\u003c/a\u003e.\"},{\"_id\":\"paragraph-25-0\",\"type\":\"text\",\"content\":\"Some issuers are pushing back. Microsoft and Alphabet, two of the companies in Securitize's line-up, are among the firms that have objected to having their shares tokenised under the SEC framework, \u003ca href=\\\"https://www.wsj.com/livecoverage/stock-market-today-dow-sp-500-nasdaq-10-20-2026/card/2RAS0YPXPxvECut6sUrP\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eThe Wall Street Journal reported\u003c/a\u003e on 20 October.\"},{\"_id\":\"paragraph-26-0\",\"type\":\"text\",\"content\":\"The NYSE has not given a launch date for its platform.\"},{\"_id\":\"paragraph-27-0\",\"type\":\"text\",\"content\":\"Securitize, which listed on the NYSE in July, reports third-quarter results in November.\"},{\"_id\":\"now-read-27\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/markets/nyse-to-launch-tokenised-securities-trading-platform/\",\"text\":\"\"}}},{\"_id\":\"paragraph-29-0\",\"type\":\"text\",\"content\":\"\u003cem\u003eKyle Pare is a reporter for DL News. Have a tip? Contact Kyle at \u003c/em\u003e\u003ca href=\\\"mailto:kyle@dlnews.com\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003e\u003cem\u003ekyle@dlnews.com\u003c/em\u003e\u003c/a\u003e\u003cem\u003e.\u003c/em\u003e\"}],\"guests\":[],\"subtype\":\"684aaabcc107f95de7aab4a4\",\"authors\":[\"6ad32f6fe8a2a0ba2951e576\"],\"main_asset\":\"699ffae6fc56c116b68a8c9f\",\"main_asset_info\":{\"article_caption\":\"Securitize shares have fallen since it launched tokenised US stocks on Solana. Illustration: Andrés Núñez\",\"copyright\":\"\",\"credit\":\"Andrés Núñez\",\"headline\":\"Tokenisation Private markets\",\"_id\":\"699ffae6fc56c116b68a8c9f\",\"src_url\":\"https://dl-migration-assets.s3.eu-central-1.amazonaws.com/images/1772092134172.webp\"},\"verticals\":[\"684aad1fc107f95de7aab4b1\"],\"primary_vertical\":\"684aad1fc107f95de7aab4b1\",\"tags\":[\"68df7e78bf9470d7206314f6\",\"68df7e78bf9470d720631645\"],\"workflow\":\"published\",\"story_info\":{\"words_count\":644,\"assets_count\":0,\"embeds_count\":3},\"previous_urls\":[],\"slug\":\"securitize-shares-fall-38percent-since-solana-stock-token-launch-or-dl-news\",\"created_at\":\"2026-10-22T16:20:03.120Z\",\"updated_at\":\"2026-10-22T18:18:21.930Z\",\"__v\":1,\"display_date\":\"2026-10-22T18:18:21.930Z\",\"first_publish_date\":\"2026-10-22T18:18:21.930Z\",\"publish_date\":\"2026-10-22T18:18:21.930Z\",\"url\":\"https://www.dlnews.com/articles/markets/securitize-shares-fall-38percent-since-solana-stock-token-launch-or-dl-news/\",\"subtypeObject\":{\"_id\":\"684aaabcc107f95de7aab4a4\",\"name\":\"News\",\"slug\":\"articles\"},\"mainAssetObject\":{\"_id\":\"699ffae6fc56c116b68a8c9f\",\"is_active\":true,\"is_deleted\":false,\"arc_asset_id\":\"FDTEOVBURFECHNB5W6NAHA7PSM\",\"src_url\":\"https://dl-migration-assets.s3.eu-central-1.amazonaws.com/images/1772092134172.webp\",\"headline\":\"Tokenisation Private markets\",\"credit\":\"Andrés Núñez\",\"type\":\"illustration\",\"mime_type\":\"image\",\"keywords\":[\"tokenisation\",\"private markets\"],\"subtypes\":[\"684aaabcc107f95de7aab4a4\"],\"main_asset_story_aggregate\":2,\"homepage_asset_story_aggregate\":0,\"social_media_asset_story_aggregate\":0,\"created_at\":\"2023-03-23T18:30:53.000Z\",\"updated_at\":\"2023-03-23T18:30:53.000Z\",\"__v\":0,\"article_caption\":\"\",\"image_caption\":\"\",\"arc_asset_url\":\"https://cloudfront-eu-central-1.images.arcpublishing.com/dlnews/FDTEOVBURFECHNB5W6NAHA7PSM.jpg\",\"events_images_aggregate\":0,\"reports_images_aggregate\":0,\"users_images_aggregate\":0,\"last_used_at\":\"2026-10-22T18:18:21.930Z\",\"last_used_by\":\"6a349704180e41a1b12d2197\"},\"tagsObjects\":[{\"_id\":\"68df7e78bf9470d7206314f6\",\"slug\":\"solana\",\"name\":\"Solana\"},{\"_id\":\"68df7e78bf9470d720631645\",\"slug\":\"tokenisation\",\"name\":\"Tokenisation\"}],\"authorsObjects\":[{\"_id\":\"6ad32f6fe8a2a0ba2951e576\",\"first_name\":\"Kyle\",\"last_name\":\"Pare\",\"name\":\"Kyle Pare\",\"slug\":\"kyle-pare\"}],\"primaryVerticalObject\":{\"_id\":\"684aad1fc107f95de7aab4b1\",\"name\":\"Markets\",\"slug\":\"markets\"},\"verticalsObjects\":[{\"_id\":\"684aad1fc107f95de7aab4b1\",\"name\":\"Markets\",\"slug\":\"markets\"}]},{\"_id\":\"69f4cdb7d8f2ce6530e3f161\",\"is_active\":true,\"is_deleted\":false,\"headline\":\"‘Every hit earns crypto’? App that gives users Bitcoin for getting stoned deemed ‘dangerous’ and ‘unethical’\",\"subheadline\":\"\",\"description\":\"\",\"meta_data\":{\"title\":\"Gudtrip app gives users Bitcoin and deemed unethical\",\"description\":\"\"},\"sub_vertical\":\"internal\",\"content_elements\":[{\"_id\":\"section-info-0\",\"type\":\"custom_embed\",\"subtype\":\"section-info\",\"embed\":{\"id\":\"\",\"config\":{\"text\":\"A cannabis vape pen company is giving out Bitcoin.\\n“Every hit earns crypto,” a tagline on the company’s website reads.\\nGudtrip says its product isn’t designed to encourage greater cannabis consumption.\",\"title\":\"\"}}},{\"_id\":\"paragraph-1-0\",\"type\":\"text\",\"content\":\"A California-based cannabis vape pen company that says it rewards customers with crypto for using its product is raising alarm among health experts and anti-drug campaigners.\"},{\"_id\":\"paragraph-2-0\",\"type\":\"text\",\"content\":\"Gudtrip advertises itself as building a user-powered network that combines cannabis, Bitcoin, and artificial intelligence.\"},{\"_id\":\"paragraph-3-0\",\"type\":\"text\",\"content\":\"“Every hit earns crypto,” a tagline on the company’s \u003ca href=\\\"https://gudtrip.com/#product\\\"\u003e\u003cu\u003ewebsite\u003c/u\u003e\u003c/a\u003e reads.\"},{\"_id\":\"paragraph-4-0\",\"type\":\"text\",\"content\":\"Customers who buy one of the company’s cannabis vape pens can connect it to an app, which rewards them with Bitcoin, and points for using the pen. “Checking-in” daily creates streaks which increase points earned by up to 200%.\"},{\"_id\":\"paragraph-5-0\",\"type\":\"text\",\"content\":\"Several researchers studying cannabis consumption who spoke to \u003cem\u003eDL News\u003c/em\u003e said encouraging daily use is potentially dangerous and habit-forming, raising ethical concerns.\"},{\"_id\":\"paragraph-6-0\",\"type\":\"text\",\"content\":\"“Gamifying cannabis use? It certainly sounds like habit-formation is the goal,” Joshua Gowin, an associate professor who studies the effects of frequent cannabis use at the University of Colorado Anschutz, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-7-0\",\"type\":\"text\",\"content\":\"“Linking a reward to a puff/smoking session reinforces the behaviour, increasing the chance of escalating use and even developing an addiction,” Janna Cousijn, head of the Neuroscience of Addiction Lab at the Erasmus University Rotterdam, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-8-0\",\"type\":\"text\",\"content\":\"“It is potentially a very dangerous and unethical device that could stimulate the development of addiction,” she said.\"},{\"_id\":\"paragraph-9-0\",\"type\":\"text\",\"content\":\"A Gudtrip spokesperson told \u003cem\u003eDL News \u003c/em\u003ethe company is “deeply mindful” of the risks associated with cannabis products and that its product isn’t designed to encourage greater consumption.\"},{\"_id\":\"heading-10\",\"type\":\"header\",\"level\":2,\"content\":\"Pushing the boundaries\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-11-0\",\"type\":\"text\",\"content\":\"In recent years, the crypto industry has become a hotbed for products that gamify finance, blur the lines between investing and gambling, and push the boundaries of what is allowed under current laws.\"},{\"_id\":\"paragraph-12-0\",\"type\":\"text\",\"content\":\"For example, blockchain-based prediction markets, platforms that let users bet on the outcomes of everything from sports and politics to whether the US government will \u003ca href=\\\"https://polymarket.com/predictions/aliens\\\"\u003e\u003cu\u003econfirm\u003c/u\u003e\u003c/a\u003e the existence of aliens, have \u003ca href=\\\"https://www.trmlabs.com/resources/blog/how-prediction-markets-scaled-to-usd-21b-in-monthly-volume-in-2026\\\"\u003e\u003cu\u003esurged\u003c/u\u003e\u003c/a\u003e into a $21 billion industry.\"},{\"_id\":\"now-read-13\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/defi/ethcc-exposes-ethereum-identity-crisis/\",\"text\":\"\"}}},{\"_id\":\"paragraph-14-0\",\"type\":\"text\",\"content\":\"Many US states, gaming regulators, and lawmakers \u003ca href=\\\"https://www.dlnews.com/articles/regulation/kalshi-launches-whistleblower-function-to-oust-insider-traders/\\\"\u003e\u003cu\u003eargue\u003c/u\u003e\u003c/a\u003e prediction markets are essentially gambling, a tightly regulated industry. Prediction market platforms contend that they are not, and are instead financial trading platforms.\"},{\"_id\":\"paragraph-15-0\",\"type\":\"text\",\"content\":\"Gudtrip, which also advertises that customers can invest their rewards using “open-source AI agent tools” in “blockchain-based strategies,” fits this crypto industry trend to a tee.\"},{\"_id\":\"paragraph-16-0\",\"type\":\"text\",\"content\":\"Gudtrip’s parent company, Puffpaw, is growing fast. After \u003ca href=\\\"https://www.blocmates.com/news-posts/berachain-based-vaping-project-puffpaw-raises-6-million\\\"\u003e\u003cu\u003ereceiving\u003c/u\u003e\u003c/a\u003e $6 million in venture funding in 2024, the company says it has \u003ca href=\\\"https://x.com/puffpaw/status/2015792215784890587\\\"\u003e\u003cu\u003esold\u003c/u\u003e\u003c/a\u003e over 140,000 products, although this figure includes its more widespread nicotine-based products.\"},{\"_id\":\"heading-17\",\"type\":\"header\",\"level\":2,\"content\":\"Ethical concerns\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-18-0\",\"type\":\"text\",\"content\":\"There’s a mountain of research that has tied heavy cannabis consumption, which includes using cannabis daily or almost every day, to a range of negative health effects.\"},{\"_id\":\"paragraph-19-0\",\"type\":\"text\",\"content\":\"They include increased risk of mental health disorders including anxiety, depression and psychosis, impairments in memory, attention and learning, respiratory problems, and even an elevated risk of heart attacks and strokes.\"},{\"_id\":\"quote-20\",\"type\":\"quote\",\"content_elements\":[{\"_id\":\"paragraph-0-0\",\"type\":\"text\",\"content\":\"\\\"This certainly raises ethical concerns\\\"\"}]},{\"_id\":\"paragraph-21-0\",\"type\":\"text\",\"content\":\"“From a public health perspective, I would be concerned about any product designed to incentivise frequent cannabis use,” Francesca Filbey, a researcher who studies the long-term effects of cannabis use at the University of Texas at Dallas, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-22-0\",\"type\":\"text\",\"content\":\"“This certainly raises ethical concerns,” she said.\"},{\"_id\":\"paragraph-23-0\",\"type\":\"text\",\"content\":\"To be sure, many of the health impacts of using cannabis are reduced for those who use the drug only occasionally.\"},{\"_id\":\"paragraph-24-0\",\"type\":\"text\",\"content\":\"Several drug risk assessment studies published in peer-reviewed medical journals have \u003ca href=\\\"https://www.thelancet.com/article/S0140-6736(10)61462-6/fulltext\\\"\u003e\u003cu\u003efound\u003c/u\u003e\u003c/a\u003e that cannabis use is less harmful than seven other popular drugs, including tobacco and alcohol.\"},{\"_id\":\"now-read-25\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/people-culture/wallets-tied-to-andean-medjedovic-use-tornado-cash/\",\"text\":\"\"}}},{\"_id\":\"paragraph-26-0\",\"type\":\"text\",\"content\":\"Yet the more cannabis people use, the greater their risk of suffering adverse consequences, Tom Freeman, director of the Addiction and Mental Health Group, who specialises in cannabis’ mental health impacts and the therapeutic potential, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-27-0\",\"type\":\"text\",\"content\":\"The best way to manage risk is through careful and informed choices based on THC content and following safer use guidelines, Freeman said.\"},{\"_id\":\"paragraph-28-0\",\"type\":\"text\",\"content\":\"“Providing incentives for people who consume more will impair their ability to make choices in the best interests of their health, escalating their use and risk of harms,” he said.\"},{\"_id\":\"heading-29\",\"type\":\"header\",\"level\":2,\"content\":\"Only points?\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-30-0\",\"type\":\"text\",\"content\":\"The Gudtrip spokesperson said the only financial reward in the product is Bitcoin, which is part of a “standard consumer loyalty programme,” and not scaled to, gated by, or otherwise associated with the level, frequency, or duration of cannabis consumption.\"},{\"_id\":\"paragraph-31-0\",\"type\":\"text\",\"content\":\"The points customers earn are “used solely for record-keeping in the app” and cannot be redeemed for cash, cryptocurrency, products, or anything else of monetary value, the spokesperson said.\"},{\"_id\":\"paragraph-32-0\",\"type\":\"text\",\"content\":\"“We believe that an adult in a legal market who has visibility into their own consumption is better positioned to avoid problematic use than one who does not,” the spokesperson said.\"},{\"_id\":\"paragraph-33-0\",\"type\":\"text\",\"content\":\"That’s at odds with information on the Gudtrip website, which tells potential customers that “every hit earns crypto,” and shows images of an app user earning a 200% “boost” after “checking-in” to the app consecutively for four days.\"},{\"_id\":\"image-34\",\"type\":\"image\",\"url\":\"https://dl-production-assets.s3.eu-central-1.amazonaws.com/images/1777651872139-asset.webp\",\"link\":\"\",\"alt_text\":\"every hit earns crypto\",\"headline\":\"every hit earns crypto\",\"credit\":\"Gudtrip\",\"copyright\":\"Gudtrip\",\"article_caption\":\"\\\"Every hit earns crypto.\\\" Source: Gudtrip \",\"alignment\":\"center\",\"keywords\":[]},{\"_id\":\"paragraph-35-0\",\"type\":\"text\",\"content\":\"“In the old consumer model, users bought products and brands kept the upside. In the Gudtrip model, users help build the network and deserve to share in the value they create,” marketing copy on the Gudtrip website reads.\"},{\"_id\":\"paragraph-36-0\",\"type\":\"text\",\"content\":\"Gudtrip did not immediately respond to a request for comment asking it to address the inconsistencies between the information provided to customers on its website and the comments given to \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-37-0\",\"type\":\"text\",\"content\":\"What’s more, Gudtrip’s customers may have other reasons to believe points are not just a record-keeping tool.\"},{\"_id\":\"paragraph-38-0\",\"type\":\"text\",\"content\":\"In the crypto industry, issuing so-called points is widely understood as laying the groundwork for issuing a valuable crypto token.\"},{\"_id\":\"paragraph-39-0\",\"type\":\"text\",\"content\":\"In recent years, dozens of crypto projects have \u003ca href=\\\"https://www.dlnews.com/articles/defi/why-defi-protocols-love-to-offer-points-before-airdrops/\\\"\u003e\u003cu\u003eissued\u003c/u\u003e\u003c/a\u003e points, and at a later date have converted them into valuable crypto tokens. Those who earn points are often so sure that they will eventually be worth money that they are \u003ca href=\\\"https://whales.market/en\\\"\u003e\u003cu\u003ewilling\u003c/u\u003e\u003c/a\u003e to buy and sell them on secondary markets.\"},{\"_id\":\"image-40\",\"type\":\"image\",\"url\":\"https://dl-production-assets.s3.eu-central-1.amazonaws.com/images/1777651999864-asset.webp\",\"link\":\"\",\"alt_text\":\"Put rewards to work\",\"headline\":\"Put rewards to work\",\"credit\":\"Gudtrip\",\"copyright\":\"Gudtrip\",\"article_caption\":\"\\\"Put rewards to work.\\\" Source: Gudtrip\",\"alignment\":\"center\",\"keywords\":[]},{\"_id\":\"paragraph-41-0\",\"type\":\"text\",\"content\":\"Puffpaw, Gudtrip’s parent company, has explicitly \u003ca href=\\\"https://x.com/Gudtrip/status/2041266151674773816\\\"\u003e\u003cu\u003etold\u003c/u\u003e\u003c/a\u003e customers that it plans to launch a token in the future.\"},{\"_id\":\"paragraph-42-0\",\"type\":\"text\",\"content\":\"The Gudtrip spokesperson said the company does not plan to issue a token in connection with its product.\"},{\"_id\":\"heading-43\",\"type\":\"header\",\"level\":2,\"content\":\"Legal status \",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-44-0\",\"type\":\"text\",\"content\":\"For other drugs and controlled substances in the US, industry players adhere to voluntary self-regulatory codes.\"},{\"_id\":\"paragraph-45-0\",\"type\":\"text\",\"content\":\"For example, in the alcohol industry, the Distilled Spirits Council’s Code of Responsible Practice explicitly requires that advertising and promotion “discourage excessive or abusive consumption,” not portray intoxication as acceptable, and avoid depicting drinking games or other activities that reward heavy drinking.\"},{\"_id\":\"paragraph-46-0\",\"type\":\"text\",\"content\":\"Cannabis, however, remains illegal at the federal level, making it more difficult to unite the industry and enforce best practices.\"},{\"_id\":\"quote-47\",\"type\":\"quote\",\"content_elements\":[{\"_id\":\"paragraph-0-0\",\"type\":\"text\",\"content\":\"\\\"California's financial and health authorities need to act against this insanity\\\"\"}]},{\"_id\":\"paragraph-48-0\",\"type\":\"text\",\"content\":\"The National Cannabis Industry Association, the largest US nonprofit trade organisation representing cannabis businesses, did not respond to a request for comment.\"},{\"_id\":\"paragraph-49-0\",\"type\":\"text\",\"content\":\"Instead, states that have legalised cannabis come up with their own rules independently.\"},{\"_id\":\"paragraph-50-0\",\"type\":\"text\",\"content\":\"Currently, Gudtrip vape pens are only available in California, one of 25 US states to fully legalise cannabis for recreational use. California, unlike many other states, doesn't explicitly prohibit advertising or other forms of promotion that encourages excessive use of the drug.\"},{\"_id\":\"paragraph-51-0\",\"type\":\"text\",\"content\":\"Some states, such as Massachusetts, previously banned customer loyalty programmes for cannabis products to avoid encouraging overconsumption. These prohibitions were \u003ca href=\\\"https://www.westernmassnews.com/2026/04/20/mass-cannabis-control-commission-expands-marijuana-laws/\\\"\u003e\u003cu\u003elifted\u003c/u\u003e\u003c/a\u003e on April 20.\"},{\"_id\":\"paragraph-52-0\",\"type\":\"text\",\"content\":\"“Paying people to use this stuff — literally paying them — is unacceptable,” Kevin Sabet, CEO of Smart Approaches to Marijuana, a non-profit that opposes the legalisation and commercialisation of cannabis, told \u003cem\u003eDL News\u003c/em\u003e. “California's financial and health authorities need to act against this insanity.”\"},{\"_id\":\"now-read-52\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/people-culture/fed-nominee-kevin-warsh-invested-in-20-crypto-firms/\",\"text\":\"\"}}},{\"_id\":\"paragraph-54-0\",\"type\":\"text\",\"content\":\"“The Department of Cannabis Control does not promote increased consumption of cannabis and encourages those who use cannabis to do so responsibly,” Jordan Traverso, deputy director of public affairs at the organisation, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-55-0\",\"type\":\"text\",\"content\":\"The Department of Cannabis Control, or DCC, licenses and regulates commercial cannabis activity in California.\"},{\"_id\":\"paragraph-56-0\",\"type\":\"text\",\"content\":\"“We were not previously familiar with the Gudtrip product but have reached out to the manufacturer to learn more about its features,” Traverso said.\"},{\"_id\":\"paragraph-57-0\",\"type\":\"text\",\"content\":\"\u003cem\u003eTim Craig is DL News’ Edinburgh-based DeFi Correspondent. Reach out with tips at \u003c/em\u003e\u003ca href=\\\"mailto:tim@dlnews.com\\\" target=\\\"_blank\\\" rel=\\\" nofollow nofollow nofollow nofollow nofollow nofollow nofollow nofollow\\\"\u003e\u003cem\u003etim@dlnews.com\u003c/em\u003e\u003c/a\u003e\u003cem\u003e.\u003c/em\u003e\"}],\"guests\":[],\"subtype\":\"684aaabcc107f95de7aab4a4\",\"authors\":[\"68df93f9bfd0cfb96db872ff\"],\"verticals\":[\"684aad1fc107f95de7aab4b2\"],\"primary_vertical\":\"684aad1fc107f95de7aab4b2\",\"tags\":[\"68df7e77bf9470d72063096e\"],\"workflow\":\"published\",\"story_info\":{\"words_count\":1285,\"assets_count\":2,\"embeds_count\":4},\"previous_urls\":[],\"slug\":\"gudtrip-app-gives-users-bitcoin-and-deemed-unethical\",\"created_at\":\"2026-05-01T15:58:47.851Z\",\"updated_at\":\"2026-05-04T11:30:08.827Z\",\"__v\":1,\"display_date\":\"2026-05-04T11:30:08.827Z\",\"first_publish_date\":\"2026-05-04T11:30:08.827Z\",\"main_asset\":\"69f4b684c2fc868b3be73bc0\",\"main_asset_info\":{\"article_caption\":\"Gudtrip says its product isn’t designed to encourage greater cannabis consumption. Illustration: DL News; Source: Shutterstock, Gudtrip\",\"copyright\":\"Shutterstock, Gudtrip\",\"credit\":\"DL News\",\"headline\":\"‘Every hit earns crypto’ App that gives users reward streaks for getting stoned deemed ‘dangerous’ and ‘unethical’\",\"_id\":\"69f4b684c2fc868b3be73bc0\",\"src_url\":\"https://dl-production-assets.s3.eu-central-1.amazonaws.com/images/1777645189269-asset.webp\"},\"publish_date\":\"2026-05-04T11:30:08.827Z\",\"url\":\"https://www.dlnews.com/articles/web3/gudtrip-app-gives-users-bitcoin-and-deemed-unethical/\",\"subtypeObject\":{\"_id\":\"684aaabcc107f95de7aab4a4\",\"name\":\"News\",\"slug\":\"articles\"},\"mainAssetObject\":{\"_id\":\"69f4b684c2fc868b3be73bc0\",\"meta_data\":{\"description\":\"‘Every hit earns crypto’ App that gives users reward streaks for getting stoned deemed ‘dangerous’ and ‘unethical’\"},\"is_active\":true,\"is_deleted\":false,\"type\":\"illustration\",\"keywords\":[\"Gudtrip\",\"cannabis\"],\"subtypes\":[\"684aaabcc107f95de7aab4a4\"],\"main_asset_story_aggregate\":1,\"homepage_asset_story_aggregate\":0,\"social_media_asset_story_aggregate\":0,\"created_at\":\"2026-05-01T14:19:48.911Z\",\"updated_at\":\"2026-05-01T14:19:48.911Z\",\"mime_type\":\"image\",\"headline\":\"‘Every hit earns crypto’ App that gives users reward streaks for getting stoned deemed ‘dangerous’ and ‘unethical’\",\"credit\":\"DL News\",\"copyright\":\"Shutterstock, Gudtrip\",\"image_caption\":\"‘Every hit earns crypto’ App that gives users reward streaks for getting stoned deemed ‘dangerous’ and ‘unethical’; Illustration: DL News; Source: Shutterstock, Gudtrip;\",\"article_caption\":\"‘Every hit earns crypto’ App that gives users reward streaks for getting stoned deemed ‘dangerous’ and ‘unethical’; Illustration: DL News; Source: Shutterstock, Gudtrip\",\"thumbnail_url\":\"https://dl-production-assets.s3.eu-central-1.amazonaws.com/thumbnails/1777645189910-asset.webp\",\"src_url\":\"https://dl-production-assets.s3.eu-central-1.amazonaws.com/images/1777645189269-asset.webp\",\"__v\":0,\"last_used_at\":\"2026-05-04T11:30:08.827Z\",\"last_used_by\":\"68df93f9bfd0cfb96db8730d\",\"events_images_aggregate\":0,\"reports_images_aggregate\":0,\"users_images_aggregate\":0},\"tagsObjects\":[{\"_id\":\"68df7e77bf9470d72063096e\",\"slug\":\"bitcoin\",\"name\":\"Bitcoin\"}],\"authorsObjects\":[{\"_id\":\"68df93f9bfd0cfb96db872ff\",\"slug\":\"timcraig\",\"first_name\":\"Tim\",\"last_name\":\"Craig\",\"name\":\"Tim Craig\"}],\"primaryVerticalObject\":{\"_id\":\"684aad1fc107f95de7aab4b2\",\"name\":\"Web3\",\"slug\":\"web3\"},\"verticalsObjects\":[{\"_id\":\"684aad1fc107f95de7aab4b2\",\"name\":\"Web3\",\"slug\":\"web3\"}]}]}]\n"])</script><script>self.__next_f.push([1,"22:I[77010,[\"/_next/static/chunks/0u-b4u8q5vc-m.js\",\"/_next/static/chunks/05.~jf.6nrh~l.js\",\"/_next/static/chunks/0_9~iynkc3eth.js\",\"/_next/static/chunks/0xmf_5ugcr8h2.js\",\"/_next/static/chunks/0fydwmmfsa2we.js\",\"/_next/static/chunks/0-~jxj2ny3yps.js\",\"/_next/static/chunks/0wkic17w16wj_.js\",\"/_next/static/chunks/04l.wvef7dhgj.js\",\"/_next/static/chunks/17wu1e7pwnndh.js\",\"/_next/static/chunks/0anbb.76jkzub.js\",\"/_next/static/chunks/0r0mnysstgvxs.js\",\"/_next/static/chunks/08umjite9tkua.js\",\"/_next/static/chunks/0r-jktjb3vqk6.js\",\"/_next/static/chunks/07i.qknrjxgf~.js\"],\"HeaderContent\"]\n"])</script><script>self.__next_f.push([1,"3:[[[\"$\",\"$L22\",null,{\"announcementBarProps\":{\"hide\":true},\"storiesListProps\":{\"data\":[{\"_id\":\"6ae235d1ebb4c5532f036648\",\"is_active\":true,\"is_deleted\":false,\"headline\":\"Strategy’s MSCI risk: What to watch before November 11\",\"subheadline\":\"\",\"description\":\"MSCI will name affected companies on November 11. Here’s what investors should watch as Strategy faces possible index exclusion.\",\"meta_data\":{\"title\":\"Strategy MSCI index exclusion risk\",\"description\":\"\"},\"sub_vertical\":\"internal\",\"content_elements\":[{\"_id\":\"section-info-0\",\"type\":\"custom_embed\",\"subtype\":\"section-info\",\"embed\":{\"id\":\"\",\"config\":{\"text\":\"MSCI will announce affected companies on November 11; Strategy’s removal remains unconfirmed.\\nIndex changes take effect after the November 30 close.\\nStrategy shareholders separately approved daily-dividend amendments on October 28.\",\"title\":\"\"}}},{\"_id\":\"paragraph-1-0\",\"type\":\"text\",\"content\":\"Strategy investors face a November 11 decision on whether the Bitcoin treasury company will remain in MSCI’s global equity indexes. Any resulting removals would take effect after the November 30 close.\"},{\"_id\":\"paragraph-2-0\",\"type\":\"text\",\"content\":\"MSCI \u003ca href=\\\"https://app2.msci.com/webapp/index_ann/DocGet?format=html\u0026lang=en\u0026pub_key=aq0wbkjxPgo=\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eadopted its new eligibility rules\u003c/a\u003e on October 15. Strategy’s removal has not been confirmed; the issue for shareholders is how exclusion could affect demand for its shares and future financing.\"},{\"_id\":\"paragraph-3-0\",\"type\":\"text\",\"content\":\"Separately, Strategy said on October 28 that \u003ca href=\\\"https://www.strategy.com/press/strategy-announces-approval-of-the-daily-dividends-amendment_10-28-2026\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eshareholders had approved amendments permitting daily dividends\u003c/a\u003e on four preferred-stock series, based on preliminary voting results. Subject to the amended terms being filed and becoming effective, the new schedule would begin November 1 for STRC and January 1, 2027, for STRF, STRK and STRD. The vote changes preferred-dividend arrangements; it does not settle the MSCI index decision.\"},{\"_id\":\"oembed-4\",\"type\":\"oembed_response\",\"subtype\":\"twitter\",\"raw_oembed\":{\"html\":\"\u003cblockquote class=\\\"twitter-tweet\\\"\u003e\u003cp lang=\\\"en\\\" dir=\\\"ltr\\\"\u003e\u003ca href=\\\"https://x.com/search?q=%24MSTR\u0026amp;src=ctag\u0026amp;ref_src=twsrc%5Etfw\\\"\u003e$MSTR\u003c/a\u003e shareholders have approved the Daily Dividends amendment. Preliminary results show 99.3% of votes cast were in favor. The amendment enables \u003ca href=\\\"https://x.com/search?q=%24STRF\u0026amp;src=ctag\u0026amp;ref_src=twsrc%5Etfw\\\"\u003e$STRF\u003c/a\u003e, \u003ca href=\\\"https://x.com/search?q=%24STRC\u0026amp;src=ctag\u0026amp;ref_src=twsrc%5Etfw\\\"\u003e$STRC\u003c/a\u003e, \u003ca href=\\\"https://x.com/search?q=%24STRK\u0026amp;src=ctag\u0026amp;ref_src=twsrc%5Etfw\\\"\u003e$STRK\u003c/a\u003e and \u003ca href=\\\"https://x.com/search?q=%24STRD\u0026amp;src=ctag\u0026amp;ref_src=twsrc%5Etfw\\\"\u003e$STRD\u003c/a\u003e to accrue dividends every calendar day. Thank you to all who voted.\u003ca href=\\\"https://t.co/vRSC6hwlro\\\"\u003ehttps://t.co/vRSC6hwlro\u003c/a\u003e\u003c/p\u003e\u0026mdash; Strategy (@Strategy) \u003ca href=\\\"https://x.com/Strategy/status/2115451848261869619?ref_src=twsrc%5Etfw\\\"\u003eOctober 28, 2026\u003c/a\u003e\u003c/blockquote\u003e\\n\u003cscript async src=\\\"https://platform.x.com/widgets.js\\\" charset=\\\"utf-8\\\"\u003e\u003c/script\u003e\\n\\n\",\"url\":\"https://x.com/Strategy/status/2115451848261869619\"}},{\"_id\":\"heading-5\",\"type\":\"header\",\"level\":2,\"content\":\"How the new MSCI rules work\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-6-0\",\"type\":\"text\",\"content\":\"MSCI first \u003ca href=\\\"https://app2.msci.com/webapp/index_ann/DocGet?format=html\u0026lang=en\u0026pub_key=aq0wbkjxPgo=\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eassesses whether a company has substantial operating assets\u003c/a\u003e. Companies that fail this screen face five financial-ratio tests, with ineligibility triggered by flags on at least four.\"},{\"_id\":\"paragraph-7-0\",\"type\":\"text\",\"content\":\"Existing index constituents face removal only if they fail the screen in both of their two most recent annual filing periods. MSCI may also consider the latest interim filing.\"},{\"_id\":\"paragraph-8-0\",\"type\":\"text\",\"content\":\"MSCI had previously identified Strategy, Metaplanet and Upexi as potential exclusions under its methodology for non-operating companies, according to \u003ca href=\\\"https://www.tradingview.com/news/cointelegraph:2d34f0716094b:0-msci-adopts-index-exclusion-rules-that-could-oust-strategy/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ereporting by TradingView\u003c/a\u003e.\"},{\"_id\":\"paragraph-9-0\",\"type\":\"text\",\"content\":\"Sharplink, Ton Strategy Company, Solana Company and DeFi Development Corp. were also placed on a watchlist for possible exclusion.\"},{\"_id\":\"heading-10\",\"type\":\"header\",\"level\":2,\"content\":\"Why exclusion could matter for Strategy\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-11-0\",\"type\":\"text\",\"content\":\"This potential exclusion could have huge financial implications for Bitcoin and companies like Strategy. JPMorgan estimated in 2025 that exclusion from MSCI indexes could trigger up to $2.8 billion in sales of Strategy shares, Bloomberg reported. These estimates concern investors selling Strategy shares. Index exclusion would not itself require Strategy to sell Bitcoin. According to Bloomberg, potential selling could rise to $8.8 billion in total if other index providers followed.\"},{\"_id\":\"paragraph-12-0\",\"type\":\"text\",\"content\":\"Index membership is a source of demand for publicly traded stocks. Passive funds that replicate a benchmark index buy shares of companies in that index, and must sell companies removed from that index. Exclusion would require funds tracking the affected MSCI Global Investable Market Indexes to rebalance their holdings.\"},{\"_id\":\"paragraph-13-0\",\"type\":\"text\",\"content\":\"Index inclusion is important for a company like Strategy because it provides consistent buying, including through weekly 401(k) contributions and mutual funds, Brian Dobson, managing director for disruptive technology research at Clear Street, told \u003ca href=\\\"https://www.bloomberg.com/news/articles/2026-10-15/msci-decision-moves-michael-saylor-s-strategy-toward-index-exit\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eBloomberg\u003c/a\u003e.\"},{\"_id\":\"paragraph-14-0\",\"type\":\"text\",\"content\":\"Removal from an index can cause short-term selling pressure as investors tracking that index sell their holdings, he said.\"},{\"_id\":\"now-read-15\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/markets/microstrategy-rejection-sp500-sets-higher-bar-for-crypto-firms/\",\"text\":\"From September 2025: DL News examines Strategy’s S\u0026P 500 rejection and the implications for Bitcoin treasury companies.\"}}},{\"_id\":\"paragraph-16-0\",\"type\":\"text\",\"content\":\"The fallout is not limited to Strategy. A similar Tokyo-based company called Metaplanet could also be affected.\"},{\"_id\":\"heading-17\",\"type\":\"header\",\"level\":2,\"content\":\"Financing Bitcoin purchases\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-18-0\",\"type\":\"text\",\"content\":\"Furthermore, exclusion could have broader implications for the company's ability to raise capital.\"},{\"_id\":\"paragraph-19-0\",\"type\":\"text\",\"content\":\"Strategy typically raises funds for Bitcoin purchases through common stock, preferred shares, debt and other financial instruments. Its preferred securities include STRC and STRK.\"},{\"_id\":\"paragraph-20-0\",\"type\":\"text\",\"content\":\"Passive investing has become an important cornerstone of demand for Bitcoin treasury company shares, according to a post by \u003ca href=\\\"https://x.com/zerobasezk/status/2110996734596030516\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eZEROBASE on X\u003c/a\u003e. Exclusion from MSCI's indexes could have downstream ramifications on companies like Strategy if other indexes similarly exclude these Bitcoin treasury companies.\"},{\"_id\":\"paragraph-21-0\",\"type\":\"text\",\"content\":\"Strategy has already faced declining demand for some of its securities, Bloomberg reported. It suffered a similar setback last year when Strategy \u003ca href=\\\"https://www.dlnews.com/articles/markets/microstrategy-rejection-sp500-sets-higher-bar-for-crypto-firms/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ewas not selected for inclusion in the S\u0026P 500 index\u003c/a\u003e.\"},{\"_id\":\"paragraph-22-0\",\"type\":\"text\",\"content\":\"Saylor initially drove the company's growth by selling common stock at prices above the value of its cryptocurrency holdings. That premium later shrank amid concerns about dilution, prompting a shift toward preferred shares.\"},{\"_id\":\"paragraph-23-0\",\"type\":\"text\",\"content\":\"Demand for those securities also weakened, according to Bloomberg.\"},{\"_id\":\"now-read-25\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/markets/strategy-strc-powers-michael-saylor-beat-blackrock-bitcoin/\",\"text\":\"From March 2026: An explainer on Strategy’s STRC preferred shares and their role in financing Bitcoin purchases.\"}}},{\"_id\":\"paragraph-25-0\",\"type\":\"text\",\"content\":\"It would be more difficult for Strategy to sell equity and maintain the mechanism it uses to buy more Bitcoin, Alexander Blume, CEO of Bitcoin-focused asset manager Two Prime, told Bloomberg.\"},{\"_id\":\"paragraph-26-0\",\"type\":\"text\",\"content\":\"Blume said digital asset treasury firms were not really regarded as real businesses, and that he was unsurprised some major index providers did not want their clients exposed to such volatility.\"},{\"_id\":\"heading-27\",\"type\":\"header\",\"level\":2,\"content\":\"What next?\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-28-0\",\"type\":\"text\",\"content\":\"MSCI is expected to announce the companies affected by its new classification rules on November 11, with implementation scheduled for November 30, 2026.\"},{\"_id\":\"paragraph-29-0\",\"type\":\"text\",\"content\":\"Strategy's removal is not yet confirmed, and the financial impact would depend on the final classification and the actions of index-tracking investors.\"},{\"_id\":\"paragraph-30-0\",\"type\":\"text\",\"content\":\"Saylor has played down the potential exclusion.\"},{\"_id\":\"paragraph-31-0\",\"type\":\"text\",\"content\":\"\u003ca href=\\\"https://www.youtube.com/watch?v=GpYuwAfZZq8\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eIn an interview with Bloomberg TV in October\u003c/a\u003e, he said MSCI controlled a \\\"de minimis\\\" amount of capital and was \\\"imposing prejudicial values on digital assets.\\\"\"},{\"_id\":\"paragraph-32-0\",\"type\":\"text\",\"content\":\"He also described the potential decision as a \\\"value judgment\\\" that sets a bad precedent, according to Bloomberg.\"},{\"_id\":\"paragraph-33-0\",\"type\":\"text\",\"content\":\"The November announcement will provide greater clarity on whether Strategy and other Bitcoin treasury companies face exclusion from widely followed equity benchmarks—and what that could mean for their ability to continue accumulating Bitcoin.\"},{\"_id\":\"paragraph-34-0\",\"type\":\"text\",\"content\":\"\u003cem\u003eHave a tip? Contact Kyle Pare at \u003c/em\u003e\u003ca href=\\\"mailto:kyle@dlnews.com\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003e\u003cem\u003ekyle@dlnews.com\u003c/em\u003e\u003c/a\u003e\u003cem\u003e.\u003c/em\u003e\"}],\"guests\":[],\"subtype\":\"684aaabcc107f95de7aab4a4\",\"authors\":[\"6ad32f6fe8a2a0ba2951e576\"],\"main_asset\":\"6ae234f0ebb4c5532f036646\",\"main_asset_info\":{\"_id\":\"6ae234f0ebb4c5532f036646\",\"headline\":\"Michael Saylor’s Strategy awaits MSCI’s November 11 review\",\"credit\":\"Gage Skidmore / Flickr; photo illustration by DL News\",\"copyright\":\"CC BY-SA 2.0 — https://creativecommons.org/licenses/by-sa/2.0/\",\"article_caption\":\"Michael Saylor; Image: Gage Skidmore / Flickr, CC BY-SA 2.0 (cropped and modified by DL News). License: https://creativecommons.org/licenses/by-sa/2.0/\",\"src_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/images/1793209584569-asset.webp\",\"link\":\"https://commons.wikimedia.org/wiki/File:Michael_Saylor_(54559703185).jpg\"},\"verticals\":[\"684aad1fc107f95de7aab4b1\"],\"primary_vertical\":\"684aad1fc107f95de7aab4b1\",\"tags\":[\"695647265cebf0613761b4ea\",\"68df7e77bf9470d72063096e\",\"68df7e78bf9470d720630fbe\"],\"workflow\":\"published\",\"story_info\":{\"words_count\":774,\"assets_count\":0,\"embeds_count\":3},\"previous_urls\":[],\"slug\":\"strategy-msci-index-exclusion-risk\",\"created_at\":\"2026-10-28T17:50:09.106Z\",\"updated_at\":\"2026-10-28T22:30:00.072Z\",\"__v\":1,\"display_date\":\"2026-10-28T22:30:00.000Z\",\"first_publish_date\":\"2026-10-28T22:30:00.000Z\",\"publish_date\":\"2026-10-28T22:30:00.000Z\",\"url\":\"https://www.dlnews.com/articles/markets/strategy-msci-index-exclusion-risk/\",\"authorsObjects\":[{\"_id\":\"6ad32f6fe8a2a0ba2951e576\",\"first_name\":\"Kyle\",\"last_name\":\"Pare\",\"name\":\"Kyle Pare\",\"slug\":\"kyle-pare\"}],\"verticalsObjects\":[{\"_id\":\"684aad1fc107f95de7aab4b1\",\"name\":\"Markets\",\"slug\":\"markets\"}],\"mainAssetObject\":{\"_id\":\"6ae234f0ebb4c5532f036646\",\"meta_data\":{\"description\":\"Michael Saylor’s Strategy faces potential exclusion from MSCI indexes under new rules taking effect in November 2026\"},\"is_active\":true,\"is_deleted\":false,\"type\":\"illustration\",\"keywords\":[\"Michael Saylor\",\"Strategy\",\"MSCI\",\"Bitcoin\",\"MSTR\",\"Index Funds\",\"Passive Investing\",\"Bitcoin Treasury\",\"Metaplanet\"],\"subtypes\":[\"684aaabcc107f95de7aab4a4\"],\"main_asset_story_aggregate\":1,\"homepage_asset_story_aggregate\":0,\"social_media_asset_story_aggregate\":0,\"events_images_aggregate\":0,\"reports_images_aggregate\":0,\"users_images_aggregate\":0,\"created_at\":\"2026-10-28T17:46:24.313Z\",\"updated_at\":\"2026-10-28T17:46:24.313Z\",\"mime_type\":\"image\",\"headline\":\"Michael Saylor’s Strategy faces potential exclusion from MSCI indexes under new rules taking effect in November 2026\",\"credit\":\"Photo illustration by DL News; original photo by Gage Skidmore\",\"copyright\":\" CC BY-SA 2.0 (modified)\",\"image_caption\":\"Michael Saylor’s Strategy faces potential exclusion from MSCI indexes under new rules taking effect in November 2026; Illustration: Photo illustration by DL News; original photo by Gage Skidmore; Source:  CC BY-SA 2.0 (modified);\",\"article_caption\":\"\",\"thumbnail_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/thumbnails/1793209585384-asset.webp\",\"src_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/images/1793209584569-asset.webp\",\"__v\":0,\"last_used_at\":\"2026-10-28T22:30:00.072Z\",\"last_used_by\":\"6ad32f6fe8a2a0ba2951e576\"},\"primaryVerticalObject\":{\"_id\":\"684aad1fc107f95de7aab4b1\",\"name\":\"Markets\",\"slug\":\"markets\"},\"tagsObjects\":[{\"_id\":\"695647265cebf0613761b4ea\",\"slug\":\"digital-asset-treasury\",\"name\":\"Digital Asset Treasury\"},{\"_id\":\"68df7e77bf9470d72063096e\",\"slug\":\"bitcoin\",\"name\":\"Bitcoin\"},{\"_id\":\"68df7e78bf9470d720630fbe\",\"slug\":\"microstrategy\",\"name\":\"Strategy (MicroStrategy)\"}],\"subtypeObject\":{\"_id\":\"684aaabcc107f95de7aab4a4\",\"name\":\"News\",\"slug\":\"articles\"}},{\"_id\":\"6ae21b9bebb4c5532f036642\",\"is_active\":true,\"is_deleted\":false,\"headline\":\"Aviva’s £50m tokenized fund: What changes for investors\",\"subheadline\":\"\",\"description\":\"Aviva Investors adds a tokenized share class to its £22 billion Sterling Liquidity Fund on the XRP Ledger, backed by a £50 million commitment.\",\"meta_data\":{\"title\":\"Aviva tokenized liquidity fund explained\",\"description\":\"\"},\"sub_vertical\":\"internal\",\"content_elements\":[{\"_id\":\"section-info-0\",\"type\":\"custom_embed\",\"subtype\":\"section-info\",\"embed\":{\"id\":\"\",\"config\":{\"text\":\"Aviva invested £50 million in a tokenized share class of its sterling liquidity fund.\\nBNY and Ripple announced broader digital asset custody capabilities on October 27.\\nEligible investors retain the underlying fund’s investment objectives, risks, and regulatory protections.\",\"title\":\"\"}}},{\"_id\":\"paragraph-1-0\",\"type\":\"text\",\"content\":\"Aviva’s £50 million investment in tokenized fund shares illustrates what changes when a conventional investment adds blockchain-based ownership records.\"},{\"_id\":\"paragraph-2-0\",\"type\":\"text\",\"content\":\"\u003ca href=\\\"https://www.avivainvestors.com/en-gb/about/company-news/2026/10/aviva-investors-launches-tokenised-share-class-for-sterling-liquidity-fund/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eAnnounced on October 26\u003c/a\u003e, the new share class gives eligible investors access to Aviva Investors’ Sterling Liquidity Fund through digital tokens on the XRP Ledger. The £22 billion figure describes the entire underlying fund; Aviva invested £50 million in the new share class.\"},{\"_id\":\"oembed-3\",\"type\":\"oembed_response\",\"subtype\":\"twitter\",\"raw_oembed\":{\"html\":\"\u003cblockquote class=\\\"twitter-tweet\\\"\u003e\u003cp lang=\\\"en\\\" dir=\\\"ltr\\\"\u003eBig news as Aviva Investors announces the launch of a tokenized share class of the Aviva Investors Sterling (GBP) Liquidity Fund on the XRP Ledger.\u003cbr\u003e\u003cbr\u003eThe Sterling (GBP) Liquidity Fund is Aviva Investors’ largest fund at around £22 billion in assets under management, and this move…\u003c/p\u003e\u0026mdash; Ripple (@Ripple) \u003ca href=\\\"https://x.com/Ripple/status/2114654501013541032?ref_src=twsrc%5Etfw\\\"\u003eOctober 26, 2026\u003c/a\u003e\u003c/blockquote\u003e\\n\u003cscript async src=\\\"https://platform.x.com/widgets.js\\\" charset=\\\"utf-8\\\"\u003e\u003c/script\u003e\\n\\n\",\"url\":\"https://x.com/Ripple/status/2114654501013541032\"}},{\"_id\":\"paragraph-4-0\",\"type\":\"text\",\"content\":\"The launch sits alongside a broader expansion of institutional blockchain services. On October 27, BNY — which holds the Aviva fund’s underlying assets — and Ripple \u003ca href=\\\"https://ripple.com/ripple-press/ripple-expands-collaboration-with-bny-across-custody-and-tokenized-trade-finance/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eannounced\u003c/a\u003e that BNY’s digital asset custody platform supports XRP and RLUSD. BNY also outlined plans to expand support for tokenized investment products on the XRP Ledger, subject to final BNY and regulatory approvals. The announcement did not identify any new functionality for Aviva’s fund.\"},{\"_id\":\"heading-5\",\"type\":\"header\",\"level\":2,\"content\":\"What changes for investors\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-6-0\",\"type\":\"text\",\"content\":\"The migration does not affect the fund's investment objective, as the fund continues to invest in UK sterling short-term, investment-grade debt securities. The securities remain part of the regulated fund portfolio and are held by BNY Mellon. With the new structure, certain investors now have the option to hold units in the fund in digital wallets on the XRP Ledger network.\"},{\"_id\":\"paragraph-7-0\",\"type\":\"text\",\"content\":\"Aviva calls the product a “digital twin.” Tokens created under these arrangements represent an interest in the underlying fund. \u003ca href=\\\"https://www.avivainvestors.com/en-gb/about/company-news/2026/10/aviva-investors-launches-tokenised-share-class-for-sterling-liquidity-fund/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eAccording to Aviva\u003c/a\u003e, tokenized fund shares have the same investment objectives, risks, and other features and protections as shares of the underlying fund.\"},{\"_id\":\"paragraph-8-0\",\"type\":\"text\",\"content\":\"Combined investment across Aviva’s sterling and US dollar tokenized share classes exceeds £86 million, according to the company.\"},{\"_id\":\"paragraph-9-0\",\"type\":\"text\",\"content\":\"Aviva has been exploring tokenization since 2024 and has accelerated its efforts as interest in tokenized products has taken off among institutional investors. Senior investment director Alastair Sewell told \u003ca href=\\\"https://www.fnlondon.com/articles/aviva-investors-steps-up-digital-assets-push-by-tokenising-largest-fund-f2d6dfee\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eFinancial News\u003c/a\u003e that Aviva Investors intends to tokenize additional funds in the future but will prioritize money-market funds in the near term.\"},{\"_id\":\"now-read-11\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/markets/ethereum-used-by-bnp-paribas-to-tokenise-money-fund/\",\"text\":\"\"}}},{\"_id\":\"heading-11\",\"type\":\"header\",\"level\":2,\"content\":\"How the tokenized shares work\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-12-0\",\"type\":\"text\",\"content\":\"The practical benefits of tokenization are operational in nature, \u003ca href=\\\"https://www.avivainvestors.com/en-us/views/aiq-investment-thinking/2026/02/tokenisation/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eaccording to Aviva\u003c/a\u003e. Potential benefits of tokenization include streamlined fund ownership, improved transparency, tamper-resistant recordkeeping and settlement functions and other opportunities to connect traditional investment products with new digital markets. In particular, money market funds (MMFs) are poised to benefit greatly from tokenization, \u003ca href=\\\"https://www.avivainvestors.com/en-us/views/aiq-investment-thinking/2026/10/the-transformation-of-money-market-funds/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eaccording to Aviva\u003c/a\u003e.\"},{\"_id\":\"paragraph-13-0\",\"type\":\"text\",\"content\":\"Several companies are involved in this program. BNY Mellon acts as the fund's custodian and holds the underlying assets. Komainu provides regulated custodial services for digital tokens. Licuido provides a tokenization platform. Ripple is a technology partner. The XRP Ledger blockchain is where tokenized fund shares are issued and managed.\"},{\"_id\":\"paragraph-14-0\",\"type\":\"text\",\"content\":\"The fund is not available to all cryptocurrency wallet users. The fund is available to eligible investors and is subject to the same regulations as other Irish money market funds (MMF).\"},{\"_id\":\"now-read-17\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/markets/securitize-shares-fall-38percent-since-solana-stock-token-launch-or-dl-news/\",\"text\":\"\"}}},{\"_id\":\"paragraph-16-0\",\"type\":\"text\",\"content\":\"Aviva is not the first major asset manager to provide tokenized money market funds, according to a July article in \u003ca href=\\\"https://alphapoint.com/blog/tokenized-money-market-funds\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eAlphapoint \u003c/a\u003enaming other market participants, including BlackRock, Franklin Templeton, and JPMorgan. Aviva claims that its entry into the market bolsters its presence in the European tokenized-fund market and with its recent investments, it is now one of the largest tokenized MMF providers in Europe.\"},{\"_id\":\"paragraph-17-0\",\"type\":\"text\",\"content\":\"\u003cem\u003eHave a tip? Contact Kyle Pare at \u003c/em\u003e\u003ca href=\\\"mailto:kyle@dlnews.com\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003e\u003cem\u003ekyle@dlnews.com\u003c/em\u003e\u003c/a\u003e\u003cem\u003e.\u003c/em\u003e\"}],\"guests\":[],\"subtype\":\"684aaabcc107f95de7aab4a4\",\"authors\":[\"6ad32f6fe8a2a0ba2951e576\"],\"verticals\":[\"684aad1fc107f95de7aab4b1\"],\"primary_vertical\":\"684aad1fc107f95de7aab4b1\",\"tags\":[\"68df7e78bf9470d720631645\",\"68df7e78bf9470d72063138a\",\"68df7e78bf9470d7206313b4\"],\"workflow\":\"published\",\"story_info\":{\"words_count\":517,\"assets_count\":0,\"embeds_count\":3},\"previous_urls\":[],\"slug\":\"aviva-tokenized-liquidity-fund-explained\",\"created_at\":\"2026-10-28T15:58:19.391Z\",\"updated_at\":\"2026-10-28T20:48:13.625Z\",\"__v\":1,\"display_date\":\"2026-10-28T20:48:13.625Z\",\"first_publish_date\":\"2026-10-28T20:48:13.625Z\",\"main_asset\":\"6ae232b2ebb4c5532f036644\",\"main_asset_info\":{\"_id\":\"6ae232b2ebb4c5532f036644\",\"headline\":\"London’s financial district\",\"credit\":\"Herry Lawford / Flickr; photo illustration by DL News\",\"copyright\":\"CC BY 2.0 — https://creativecommons.org/licenses/by/2.0/\",\"article_caption\":\"London’s financial district; Image: Herry Lawford / Flickr, CC BY 2.0 (cropped and modified by DL News). License: https://creativecommons.org/licenses/by/2.0/\",\"src_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/images/1793209010605-asset.webp\",\"link\":\"https://commons.wikimedia.org/wiki/File:Aviva,_London.jpg\"},\"publish_date\":\"2026-10-28T20:48:13.625Z\",\"url\":\"https://www.dlnews.com/articles/markets/aviva-tokenized-liquidity-fund-explained/\",\"authorsObjects\":[{\"_id\":\"6ad32f6fe8a2a0ba2951e576\",\"first_name\":\"Kyle\",\"last_name\":\"Pare\",\"name\":\"Kyle Pare\",\"slug\":\"kyle-pare\"}],\"verticalsObjects\":[{\"_id\":\"684aad1fc107f95de7aab4b1\",\"name\":\"Markets\",\"slug\":\"markets\"}],\"mainAssetObject\":{\"_id\":\"6ae232b2ebb4c5532f036644\",\"meta_data\":{\"description\":\"London’s financial district\"},\"is_active\":true,\"is_deleted\":false,\"type\":\"illustration\",\"keywords\":[\"Aviva\",\"London\"],\"subtypes\":[\"684aaabcc107f95de7aab4a4\"],\"main_asset_story_aggregate\":1,\"homepage_asset_story_aggregate\":0,\"social_media_asset_story_aggregate\":0,\"events_images_aggregate\":0,\"reports_images_aggregate\":0,\"users_images_aggregate\":0,\"created_at\":\"2026-10-28T17:36:50.145Z\",\"updated_at\":\"2026-10-28T17:36:50.145Z\",\"mime_type\":\"image\",\"headline\":\"London’s financial district\",\"credit\":\"Photo illustration by DL News; original photo by Herry Lawford / CC BY 2.0 (modified).\",\"copyright\":\"CC BY 2.0 (modified)\",\"image_caption\":\"London’s financial district; Illustration: Photo illustration by DL News; original photo by Herry Lawford / CC BY 2.0 (modified).; Source: CC BY 2.0 (modified);\",\"article_caption\":\"\",\"thumbnail_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/thumbnails/1793209011354-asset.webp\",\"src_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/images/1793209010605-asset.webp\",\"__v\":0,\"last_used_at\":\"2026-10-28T20:48:13.625Z\",\"last_used_by\":\"6ad32f6fe8a2a0ba2951e576\"},\"primaryVerticalObject\":{\"_id\":\"684aad1fc107f95de7aab4b1\",\"name\":\"Markets\",\"slug\":\"markets\"},\"tagsObjects\":[{\"_id\":\"68df7e78bf9470d720631645\",\"slug\":\"tokenisation\",\"name\":\"Tokenisation\"},{\"_id\":\"68df7e78bf9470d72063138a\",\"slug\":\"ripple\",\"name\":\"Ripple (XRP)\"},{\"_id\":\"68df7e78bf9470d7206313b4\",\"slug\":\"rwa\",\"name\":\"Real World Assets (RWA)\"}],\"subtypeObject\":{\"_id\":\"684aaabcc107f95de7aab4a4\",\"name\":\"News\",\"slug\":\"articles\"}},{\"_id\":\"6ad7916a3157f514e3cf2314\",\"is_active\":true,\"is_deleted\":false,\"headline\":\"Bank of Russia clears 17 crypto exchangers as Sberbank and VTB ready retail trading\",\"subheadline\":\"\",\"description\":\"Russia's central bank has cleared 17 crypto exchangers, including Sberbank and VTB, as both banks ready retail crypto trading by 1 December.\",\"meta_data\":{\"title\":\"Bank of Russia clears crypto exchangers, Sberbank and VTB\",\"description\":\"\"},\"sub_vertical\":\"internal\",\"content_elements\":[{\"_id\":\"section-info-0\",\"type\":\"custom_embed\",\"subtype\":\"section-info\",\"embed\":{\"id\":\"\",\"config\":{\"text\":\"The Bank of Russia has added 17 firms to its crypto exchange register since 6 October, including Sberbank and VTB.\\nVTB plans to open crypto trading to retail investors in November; Sberbank is targeting 1 December.\\nRetail buyers will be limited to 300,000 roubles a year per intermediary, while qualified investors face no cap.\",\"title\":\"\"}}},{\"_id\":\"paragraph-1-0\",\"type\":\"text\",\"content\":\"Russia's central bank is rapidly widening the list of firms allowed to trade crypto, as the country's two biggest lenders prepare to sell Bitcoin and other coins to ordinary customers before the end of the year.\"},{\"_id\":\"paragraph-2-0\",\"type\":\"text\",\"content\":\"The Bank of Russia added a 17th company, Prosto LLC, to its register of crypto exchange providers on Thursday, according to \u003ca href=\\\"https://www.cbr.ru/rbr/rbr_fr/doc?id=51731\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ea notice on the regulator's website\u003c/a\u003e. The register had four members when it opened on 6 October. The separate register of digital depositories, which record who owns which coins, now has eight.\"},{\"_id\":\"paragraph-3-0\",\"type\":\"text\",\"content\":\"The registrations put into practice a law \\\"On Digital Currencies and Digital Rights\\\", which took effect on 1 September and brings crypto trading inside Russia's regulated financial system for the first time.\"},{\"_id\":\"heading-4\",\"type\":\"header\",\"level\":2,\"content\":\"Sberbank and VTB hold both licences\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-5-0\",\"type\":\"text\",\"content\":\"Sberbank and VTB, Russia's largest state-controlled banks, were among the first five digital depositories approved on 6 October, \u003ca href=\\\"https://www.cbr.ru/press/event?id=32894\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe central bank said\u003c/a\u003e. VTB was also listed as a crypto exchange provider that day. Sberbank joined the exchange register on 12 October, \u003ca href=\\\"https://interfax.com/newsroom/top-stories/119511/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eInterfax reported\u003c/a\u003e.\"},{\"_id\":\"paragraph-6-0\",\"type\":\"text\",\"content\":\"Holding both statuses lets a bank buy and sell crypto in its own name and keep the record of clients' holdings. Exchange providers can trade digital currencies for their own account outside organised venues, while depositories record and transfer the assets and give clients access to the addresses where they are held, according to the central bank.\"},{\"_id\":\"paragraph-7-0\",\"type\":\"text\",\"content\":\"VTB's broker carried out its first stablecoin deals for corporate clients on 6 October, settling them through accounts at its new digital depository, the bank said.\"},{\"_id\":\"paragraph-8-0\",\"type\":\"text\",\"content\":\"\\\"We expect to open access to digital currency trading for a broad range of investors through VTB My Investments and directly through the bank's exchange in November and December 2026 respectively,\\\" Vitaly Sergeichuk, VTB's deputy president and chairman of the management board, said, \u003ca href=\\\"https://www.interfax.ru/business/1120700\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eaccording to Interfax\u003c/a\u003e.\"},{\"_id\":\"paragraph-9-0\",\"type\":\"text\",\"content\":\"Sberbank plans to launch its first crypto products on 1 December through apps its customers already use, though the timing depends on the regulations being ready, Interfax reported. The bank is already testing Bitcoin, Ether and USDT trades in its app, \u003ca href=\\\"https://www.coindesk.com/business/2026/10/13/russia-s-largest-bank-sberbank-secures-approval-to-trade-crypto\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eCoinDesk reported\u003c/a\u003e.\"},{\"_id\":\"heading-10\",\"type\":\"header\",\"level\":2,\"content\":\"Limits for retail buyers\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-11-0\",\"type\":\"text\",\"content\":\"The new rules draw a sharp line between retail and professional investors.\"},{\"_id\":\"paragraph-12-0\",\"type\":\"text\",\"content\":\"Non-qualified investors will be able to buy only the most liquid cryptocurrencies, up to 300,000 roubles, or about $3,800, a year through any one intermediary, and only after passing a test, \u003ca href=\\\"https://www.cbr.ru/eng/press/event?id=32724\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe central bank said in July\u003c/a\u003e. Qualified investors must also pass the test but can buy and sell any cryptocurrency without a limit.\"},{\"_id\":\"now-read-13\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/regulation/russian-illegal-crypto-exchange-operators-face-7-years-hard-labour-new-laws/\",\"text\":\"\"}}},{\"_id\":\"paragraph-14-0\",\"type\":\"text\",\"content\":\"Using crypto to pay for goods and services inside Russia remains banned.\"},{\"_id\":\"paragraph-15-0\",\"type\":\"text\",\"content\":\"Exporters and importers, however, can use crypto for cross-border settlements without restrictions, either through intermediaries or directly from any type of wallet.\"},{\"_id\":\"paragraph-16-0\",\"type\":\"text
