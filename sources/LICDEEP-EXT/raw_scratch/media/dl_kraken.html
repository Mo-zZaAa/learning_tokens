\",\"content\":\"Sberbank moved first on that front. On 1 September it launched crypto payments for companies engaged in foreign trade, with wallet-to-wallet transfers taking a couple of minutes, no minimum payment and an average cost of 0.3%, first deputy chairman Alexander Vedyakhin said, \u003ca href=\\\"https://www.interfax.ru/business/1112364\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eaccording to Interfax\u003c/a\u003e.\"},{\"_id\":\"paragraph-17-0\",\"type\":\"text\",\"content\":\"The service followed a central bank pilot that had run under an experimental legal regime since September 2024, Vedyakhin said.\"},{\"_id\":\"heading-18\",\"type\":\"header\",\"level\":2,\"content\":\"Smaller players pile in\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-19-0\",\"type\":\"text\",\"content\":\"The two state banks are not alone. T-Technologies, the parent of T-Bank, has registered its units Atomyze as a depository and T-Invest Lab as an exchange provider.\"},{\"_id\":\"paragraph-20-0\",\"type\":\"text\",\"content\":\"A string of newly formed companies have since joined the exchange register, central bank records show. MTS Bank has said it plans to launch basic crypto services in the fourth quarter, Interfax reported.\"},{\"_id\":\"paragraph-21-0\",\"type\":\"text\",\"content\":\"Banks and other licensed institutions can join the registers through a simplified procedure that takes one working day, according to the central bank.\"},{\"_id\":\"now-read-23\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/markets/russian-crypto-regulation-set-for-july-rollout/\",\"text\":\"\"}}},{\"_id\":\"heading-23\",\"type\":\"header\",\"level\":2,\"content\":\"What's next\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-24-0\",\"type\":\"text\",\"content\":\"Firms already on the registers have until 1 September 2027 to bring their operations fully in line with the law, \u003ca href=\\\"https://www.cbr.ru/press/event?id=32894\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe central bank said\u003c/a\u003e.\"},{\"_id\":\"paragraph-25-0\",\"type\":\"text\",\"content\":\"From 1 July 2027, Russian residents will be allowed to trade crypto only through registered intermediaries, \u003ca href=\\\"https://www.cbr.ru/explan/cryptocurrency/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe regulator said\u003c/a\u003e, which would effectively end peer-to-peer trading settled through Russian bank accounts. Authorities plan to introduce penalties for unlicensed crypto intermediaries from the same date, mirroring those for illegal banking.\"},{\"_id\":\"paragraph-26-0\",\"type\":\"text\",\"content\":\"\u003cem\u003eKyle Pare is a reporter for DL News. Have a tip? Contact Kyle at \u003c/em\u003e\u003ca href=\\\"mailto:kyle@dlnews.com\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003e\u003cem\u003ekyle@dlnews.com\u003c/em\u003e\u003c/a\u003e\u003cem\u003e.\u003c/em\u003e\"}],\"guests\":[],\"subtype\":\"684aaabcc107f95de7aab4a4\",\"authors\":[\"6ad32f6fe8a2a0ba2951e576\"],\"main_asset\":\"6ad78ff13157f514e3cf2312\",\"main_asset_info\":{\"article_caption\":\"St. Basil's Cathedral, Moscow; Image: szeke / Flickr, CC BY-SA 2.0\",\"copyright\":\"CC BY-SA 2.0\",\"credit\":\"Image: szeke / Flickr\",\"headline\":\"St. Basil’s Cathedral, Moscow\",\"_id\":\"6ad78ff13157f514e3cf2312\",\"src_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/images/1792511985669-asset.webp\"},\"verticals\":[\"684aad1fc107f95de7aab4b0\"],\"tags\":[\"699f299bae4db303cff441ae\",\"68df7e78bf9470d72063153d\"],\"workflow\":\"published\",\"story_info\":{\"words_count\":681,\"assets_count\":0,\"embeds_count\":3},\"previous_urls\":[],\"slug\":\"bank-of-russia-clears-crypto-exchangers-sberbank-and-vtb\",\"created_at\":\"2026-10-20T16:06:02.174Z\",\"updated_at\":\"2026-10-22T23:20:00.064Z\",\"__v\":1,\"displ as cleared 17 crypto exchangers, including Sberbank and VTB, as both banks ready retail crypto trading by 1 December.\",\"meta_data\":{\"title\":\"Bank of Russia clears crypto exchangers, Sberbank and VTB\",\"description\":\"\"},\"sub_vertical\":\"internal\",\"content_elements\":[{\"_id\":\"section-info-0\",\"type\":\"custom_embed\",\"subtype\":\"section-info\",\"embed\":{\"id\":\"\",\"config\":{\"text\":\"The Bank of Russia has added 17 firms to its crypto exchange register since 6 October, including Sberbank and VTB.\\nVTB plans to open crypto trading to retail investors in November; Sberbank is targeting 1 December.\\nRetail buyers will be limited to 300,000 roubles a year per intermediary, while qualified investors face no cap.\",\"title\":\"\"}}},{\"_id\":\"paragraph-1-0\",\"type\":\"text\",\"content\":\"Russia's central bank is rapidly widening the list of firms allowed to trade crypto, as the country's two biggest lenders prepare to sell Bitcoin and other coins to ordinary customers before the end of the year.\"},{\"_id\":\"paragraph-2-0\",\"type\":\"text\",\"content\":\"The Bank of Russia added a 17th company, Prosto LLC, to its register of crypto exchange providers on Thursday, according to \u003ca href=\\\"https://www.cbr.ru/rbr/rbr_fr/doc?id=51731\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ea notice on the regulator's website\u003c/a\u003e. The register had four members when it opened on 6 October. The separate register of digital depositories, which record who owns which coins, now has eight.\"},{\"_id\":\"paragraph-3-0\",\"type\":\"text\",\"content\":\"The registrations put into practice a law \\\"On Digital Currencies and Digital Rights\\\", which took effect on 1 September and brings crypto trading inside Russia's regulated financial system for the first time.\"},{\"_id\":\"heading-4\",\"type\":\"header\",\"level\":2,\"content\":\"Sberbank and VTB hold both licences\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-5-0\",\"type\":\"text\",\"content\":\"Sberbank and VTB, Russia's largest state-controlled banks, were among the first five digital depositories approved on 6 October, \u003ca href=\\\"https://www.cbr.ru/press/event?id=32894\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe central bank said\u003c/a\u003e. VTB was also listed as a crypto exchange provider that day. Sberbank joined the exchange register on 12 October, \u003ca href=\\\"https://interfax.com/newsroom/top-stories/119511/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eInterfax reported\u003c/a\u003e.\"},{\"_id\":\"paragraph-6-0\",\"type\":\"text\",\"content\":\"Holding both statuses lets a bank buy and sell crypto in its own name and keep the record of clients' holdings. Exchange providers can trade digital currencies for their own account outside organised venues, while depositories record and transfer the assets and give clients access to the addresses where they are held, according to the central bank.\"},{\"_id\":\"paragraph-7-0\",\"type\":\"text\",\"content\":\"VTB's broker carried out its first stablecoin deals for corporate clients on 6 October, settling them through accounts at its new digital depository, the bank said.\"},{\"_id\":\"paragraph-8-0\",\"type\":\"text\",\"content\":\"\\\"We expect to open access to digital currency trading for a broad range of investors through VTB My Investments and directly through the bank's exchange in November and December 2026 respectively,\\\" Vitaly Sergeichuk, VTB's deputy president and chairman of the management board, said, \u003ca href=\\\"https://www.interfax.ru/business/1120700\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eaccording to Interfax\u003c/a\u003e.\"},{\"_id\":\"paragraph-9-0\",\"type\":\"text\",\"content\":\"Sberbank plans to launch its first crypto products on 1 December through apps its customers already use, though the timing depends on the regulations being ready, Interfax reported. The bank is already testing Bitcoin, Ether and USDT trades in its app, \u003ca href=\\\"https://www.coindesk.com/business/2026/10/13/russia-s-largest-bank-sberbank-secures-approval-to-trade-crypto\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eCoinDesk reported\u003c/a\u003e.\"},{\"_id\":\"heading-10\",\"type\":\"header\",\"level\":2,\"content\":\"Limits for retail buyers\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-11-0\",\"type\":\"text\",\"content\":\"The new rules draw a sharp line between retail and professional investors.\"},{\"_id\":\"paragraph-12-0\",\"type\":\"text\",\"content\":\"Non-qualified investors will be able to buy only the most liquid cryptocurrencies, up to 300,000 roubles, or about $3,800, a year through any one intermediary, and only after passing a test, \u003ca href=\\\"https://www.cbr.ru/eng/press/event?id=32724\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe central bank said in July\u003c/a\u003e. Qualified investors must also pass the test but can buy and sell any cryptocurrency without a limit.\"},{\"_id\":\"now-read-13\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/regulation/russian-illegal-crypto-exchange-operators-face-7-years-hard-labour-new-laws/\",\"text\":\"\"}}},{\"_id\":\"paragraph-14-0\",\"type\":\"text\",\"content\":\"Using crypto to pay for goods and services inside Russia remains banned.\"},{\"_id\":\"paragraph-15-0\",\"type\":\"text\",\"content\":\"Exporters and importers, however, can use crypto for cross-border settlements without restrictions, either through intermediaries or directly from any type of wallet.\"},{\"_id\":\"paragraph-16-0\",\"type\":\"text\",\"content\":\"Sberbank moved first on that front. On 1 September it launched crypto payments for companies engaged in foreign trade, with wallet-to-wallet transfers taking a couple of minutes, no minimum payment and an average cost of 0.3%, first deputy chairman Alexander Vedyakhin said, \u003ca href=\\\"https://www.interfax.ru/business/1112364\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eaccording to Interfax\u003c/a\u003e.\"},{\"_id\":\"paragraph-17-0\",\"type\":\"text\",\"content\":\"The service followed a central bank pilot that had run under an experimental legal regime since September 2024, Vedyakhin said.\"},{\"_id\":\"heading-18\",\"type\":\"header\",\"level\":2,\"content\":\"Smaller players pile in\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-19-0\",\"type\":\"text\",\"content\":\"The two state banks are not alone. T-Technologies, the parent of T-Bank, has registered its units Atomyze as a depository and T-Invest Lab as an exchange provider.\"},{\"_id\":\"paragraph-20-0\",\"type\":\"text\",\"content\":\"A string of newly formed companies have since joined the exchange register, central bank records show. MTS Bank has said it plans to launch basic crypto services in the fourth quarter, Interfax reported.\"},{\"_id\":\"paragraph-21-0\",\"type\":\"text\",\"content\":\"Banks and other licensed institutions can join the registers through a simplified procedure that takes one working day, according to the central bank.\"},{\"_id\":\"now-read-23\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/markets/russian-crypto-regulation-set-for-july-rollout/\",\"text\":\"\"}}},{\"_id\":\"heading-23\",\"type\":\"header\",\"level\":2,\"content\":\"What's next\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-24-0\",\"type\":\"text\",\"content\":\"Firms already on the registers have until 1 September 2027 to bring their operations fully in line with the law, \u003ca href=\\\"https://www.cbr.ru/press/event?id=32894\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe central bank said\u003c/a\u003e.\"},{\"_id\":\"paragraph-25-0\",\"type\":\"text\",\"content\":\"From 1 July 2027, Russian residents will be allowed to trade crypto only through registered intermediaries, \u003ca href=\\\"https://www.cbr.ru/explan/cryptocurrency/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ethe regulator said\u003c/a\u003e, which would effectively end peer-to-peer trading settled through Russian bank accounts. Authorities plan to introduce penalties for unlicensed crypto intermediaries from the same date, mirroring those for illegal banking.\"},{\"_id\":\"paragraph-26-0\",\"type\":\"text\",\"content\":\"\u003cem\u003eKyle Pare is a reporter for DL News. Have a tip? Contact Kyle at \u003c/em\u003e\u003ca href=\\\"mailto:kyle@dlnews.com\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003e\u003cem\u003ekyle@dlnews.com\u003c/em\u003e\u003c/a\u003e\u003cem\u003e.\u003c/em\u003e\"}],\"guests\":[],\"subtype\":\"684aaabcc107f95de7aab4a4\",\"authors\":[\"6ad32f6fe8a2a0ba2951e576\"],\"main_asset\":\"6ad78ff13157f514e3cf2312\",\"main_asset_info\":{\"article_caption\":\"St. Basil's Cathedral, Moscow; Image: szeke / Flickr, CC BY-SA 2.0\",\"copyright\":\"CC BY-SA 2.0\",\"credit\":\"Image: szeke / Flickr\",\"headline\":\"St. Basil’s Cathedral, Moscow\",\"_id\":\"6ad78ff13157f514e3cf2312\",\"src_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/images/1792511985669-asset.webp\"},\"verticals\":[\"684aad1fc107f95de7aab4b0\"],\"tags\":[\"699f299bae4db303cff441ae\",\"68df7e78bf9470d72063153d\"],\"workflow\":\"published\",\"story_info\":{\"words_count\":681,\"assets_count\":0,\"embeds_count\":3},\"previous_urls\":[],\"slug\":\"bank-of-russia-clears-crypto-exchangers-sberbank-and-vtb\",\"created_at\":\"2026-10-20T16:06:02.174Z\",\"updated_at\":\"2026-10-22T23:20:00.064Z\",\"__v\":1,\"display_date\":\"2026-10-22T23:20:00.906Z\",\"first_publish_date\":\"2026-10-22T23:20:00.906Z\",\"primary_vertical\":\"684aad1fc107f95de7aab4b0\",\"publish_date\":\"2026-10-22T23:20:00.906Z\",\"url\":\"https://www.dlnews.com/articles/regulation/bank-of-russia-clears-crypto-exchangers-sberbank-and-vtb/\",\"subtypeObject\":{\"_id\":\"684aaabcc107f95de7aab4a4\",\"name\":\"News\",\"slug\":\"articles\"},\"mainAssetObject\":{\"_id\":\"6ad78ff13157f514e3cf2312\",\"meta_data\":{\"description\":\"St. Basil’s Cathedral, Moscow\"},\"is_active\":true,\"is_deleted\":false,\"type\":\"illustration\",\"keywords\":[\"Russia\",\"Moscow\"],\"subtypes\":[\"684aaabcc107f95de7aab4a4\"],\"main_asset_story_aggregate\":1,\"homepage_asset_story_aggregate\":0,\"social_media_asset_story_aggregate\":0,\"events_images_aggregate\":0,\"reports_images_aggregate\":0,\"users_images_aggregate\":0,\"created_at\":\"2026-10-20T15:59:45.503Z\",\"updated_at\":\"2026-10-20T15:59:45.503Z\",\"mime_type\":\"image\",\"headline\":\"St. Basil’s Cathedral, Moscow\",\"credit\":\"Image by szeke\",\"copyright\":\"Licensed under CC BY-SA 2.0\",\"image_caption\":\"St. Basil’s Cathedral, Moscow; Illustration: Image by szeke; Source: Licensed under CC BY-SA 2.0;\",\"article_caption\":\"St. Basil’s Cathedral, Moscow; Illustration: Image by szeke; Source: Licensed under CC BY-SA 2.0;\",\"thumbnail_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/thumbnails/1792511986391-asset.webp\",\"src_url\":\"https://dl-assets-backup.s3.eu-central-1.amazonaws.com/images/1792511985669-asset.webp\",\"__v\":0,\"last_used_at\":\"2026-10-22T23:20:00.064Z\",\"last_used_by\":\"6a349704180e41a1b12d2197\"},\"tagsObjects\":[{\"_id\":\"68df7e78bf9470d72063153d\",\"slug\":\"stablecoin\",\"name\":\"Stablecoin\"},{\"_id\":\"699f299bae4db303cff441ae\",\"name\":\"Russia\",\"slug\":\"russia\"}],\"authorsObjects\":[{\"_id\":\"6ad32f6fe8a2a0ba2951e576\",\"first_name\":\"Kyle\",\"last_name\":\"Pare\",\"name\":\"Kyle Pare\",\"slug\":\"kyle-pare\"}],\"primaryVerticalObject\":{\"_id\":\"684aad1fc107f95de7aab4b0\",\"name\":\"Regulation\",\"slug\":\"regulation\"},\"verticalsObjects\":[{\"_id\":\"684aad1fc107f95de7aab4b0\",\"name\":\"Regulation\",\"slug\":\"regulation\"}]},{\"_id\":\"6ada37b33157f514e3cf2328\",\"is_active\":true,\"is_deleted\":false,\"headline\":\"Securitize shares slide 38% since it put Apple and Nvidia stock on Solana\",\"subheadline\":\"\",\"description\":\"Securitize stock is down 38% since it launched tokenised Apple, Nvidia and Tesla shares on Solana. It still hasn't said how much trades.\",\"meta_data\":{\"title\":\"Securitize shares fall 38% since Solana stock-token launch | DL News\",\"description\":\"\"},\"sub_vertical\":\"internal\",\"content_elements\":[{\"_id\":\"section-info-0\",\"type\":\"custom_embed\",\"subtype\":\"section-info\",\"embed\":{\"id\":\"\",\"config\":{\"text\":\"Securitize shares have fallen 38% since the company launched tokenised US stocks on Solana on 8 October.\\nThe firm has not disclosed trading volumes or holder numbers for its 12 stock tokens.\\nA US venue that could list them, OKXICE, could not start trading before 3 November at the earliest.\",\"title\":\"\"}}},{\"_id\":\"paragraph-1-0\",\"type\":\"text\",\"content\":\"Shares in Securitize have fallen sharply in the two weeks since the tokenisation firm began offering blockchain versions of Apple, Nvidia and Tesla stock.\"},{\"_id\":\"paragraph-2-0\",\"type\":\"text\",\"content\":\"SECZ was trading at $7.81 at 1:13pm ET on Thursday, down 15% on the day, according to \u003ca href=\\\"https://finance.yahoo.com/quote/SECZ/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eYahoo Finance data\u003c/a\u003e. That is 38% below its $12.66 close on 8 October, the day Securitize announced Securitize Stocks, and 43% below its $13.82 close the next day.\"},{\"_id\":\"paragraph-3-0\",\"type\":\"text\",\"content\":\"The stock jumped 11% on launch day and a further 9% the next session. It then gave up those gains, including drops of 14% on 12 October and 13% on 16 October.\"},{\"_id\":\"paragraph-4-0\",\"type\":\"text\",\"content\":\"Citi downgraded the stock to neutral from buy on 13 October, citing questions over how much revenue Securitize can earn from tokenisation and the risk of lock-up expiries adding shares to the market, \u003ca href=\\\"https://www.coindesk.com/podcasts/public-keys-at-nyse/citi-reveals-top-crypto-stock-picks-ahead-of-q3-earnings\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCoinDesk reported\u003c/a\u003e.\"},{\"_id\":\"paragraph-5-0\",\"type\":\"text\",\"content\":\"The launch put 12 US stocks onchain, among them Apple, Microsoft, Nvidia, Alphabet, Tesla, Meta, Amazon, Netflix, Circle, Strategy and Palantir.\"},{\"_id\":\"paragraph-6-0\",\"type\":\"text\",\"content\":\"\\\"Eligible investors can hold tokenized positions backed 1:1 by actual shares, with shareholder rights intact,\\\" Securitize said on X.\"},{\"_id\":\"oembed-7\",\"type\":\"oembed_response\",\"subtype\":\"twitter\",\"raw_oembed\":{\"html\":\"\u003cblockquote class=\\\"twitter-tweet\\\"\u003e\u003cp lang=\\\"en\\\" dir=\\\"ltr\\\"\u003eWe launched Securitize Stocks to bring some of the most widely held U.S. equities onchain, starting with AAPL, NVDA, TSLA and more on \u003ca href=\\\"https://x.com/solana?ref_src=twsrc%5Etfw\\\"\u003e@solana\u003c/a\u003e.\u003cbr\u003e\u003cbr\u003eEligible investors can hold tokenized positions backed 1:1 by actual shares, with shareholder rights intact.\u003cbr\u003e\u003cbr\u003eTokenize the World. \u003ca href=\\\"https://t.co/Rar7hCQgcY\\\"\u003ehttps://t.co/Rar7hCQgcY\u003c/a\u003e \u003ca href=\\\"https://t.co/zsqReDhNWt\\\"\u003epic.twitter.com/zsqReDhNWt\u003c/a\u003e\u003c/p\u003e\u0026mdash; Securitize (@Securitize) \u003ca href=\\\"https://x.com/Securitize/status/2108256145970266404?ref_src=twsrc%5Etfw\\\"\u003eOctober 8, 2026\u003c/a\u003e\u003c/blockquote\u003e\\n\u003cscript async src=\\\"https://platform.x.com/widgets.js\\\" charset=\\\"utf-8\\\"\u003e\u003c/script\u003e\\n\\n\",\"url\":\"https://x.com/Securitize/status/2108256145970266404\"}},{\"_id\":\"heading-8\",\"type\":\"header\",\"level\":2,\"content\":\"No numbers yet\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-9-0\",\"type\":\"text\",\"content\":\"Securitize has not published trading volumes or holder counts for the tokens. \u003ca href=\\\"https://solanacompass.com/news/securitize-launches-securitize-stocks-on-solana-12-us-equities-as-11-backed-security-entitlements\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eSolana Compass\u003c/a\u003e, which tracks tokens on the network, said they did \\\"not yet appear\\\" in its data.\"},{\"_id\":\"paragraph-10-0\",\"type\":\"text\",\"content\":\"The release did not define which investors are eligible, beyond saying access is subject to KYC checks and \\\"jurisdictional eligibility\\\".\"},{\"_id\":\"paragraph-11-0\",\"type\":\"text\",\"content\":\"The tokens trade on Securitize's own broker-dealer platform on Solana, with Jump Trading as market maker and settlement in USDC. Trading runs in extended hours for now. Securitize says it plans to move to 24/7 trading.\"},{\"_id\":\"paragraph-12-0\",\"type\":\"text\",\"content\":\"Securitize did not immediately respond to a request for comment.\"},{\"_id\":\"heading-13\",\"type\":\"header\",\"level\":2,\"content\":\"Crowded field\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-14-0\",\"type\":\"text\",\"content\":\"Securitize is not first. Wallets holding the xStocks Apple token on Solana rose from about 15,400 in July to about 43,000 on 8 October, \u003ca href=\\\"https://solanacompass.com/news/securitize-launches-securitize-stocks-on-solana-12-us-equities-as-11-backed-security-entitlements\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eSolana Compass\u003c/a\u003e data shows.\"},{\"_id\":\"paragraph-15-0\",\"type\":\"text\",\"content\":\"Solana handled 34% of tokenised-stock trading over the past week, about $120 million a day, according to \u003ca href=\\\"https://stakecake.com/solana-onchain/tokenized-equities/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eStakecake\u003c/a\u003e.\"},{\"_id\":\"paragraph-16-0\",\"type\":\"text\",\"content\":\"Securitize argues its model differs. Each token is a security entitlement backed by a real share, with dividends and, where they apply, voting rights. Investors may be able to convert the tokens into registered shares if the issuing company adopts tokenisation.\"},{\"_id\":\"paragraph-17-0\",\"type\":\"text\",\"content\":\"That structure matters under the SEC's Innovation Exemption, issued on 17 September. It lets new venues trade tokenised stocks only if they carry the same rights as the underlying shares. Synthetic products are excluded.\"},{\"_id\":\"paragraph-18-0\",\"type\":\"text\",\"content\":\"Robinhood's stock tokens are debt securities and are not offered in the US. Its crypto chief, Johann Kerbrat, told \u003ca href=\\\"https://www.theblock.co/news/regulation/2026-10-02-secs-innovation-exemption-robinhood-417538\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eThe Block\u003c/a\u003e that the exemption's volume caps would bite.\"},{\"_id\":\"now-read-20\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/snapshot/blackrock-ceo-touts-tokenisation-as-antidote-to-ai-threats/\",\"text\":\"\"}}},{\"_id\":\"heading-20\",\"type\":\"header\",\"level\":2,\"content\":\"What's next\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-21-0\",\"type\":\"text\",\"content\":\"Securitize expects the tokens to trade on OKXICE, a venue jointly owned by NYSE parent ICE and OKX. It also expects them on the NYSE's planned 24/7 platform.\"},{\"_id\":\"paragraph-22-0\",\"type\":\"text\",\"content\":\"OKXICE first published its \u003ca href=\\\"https://www.okx.com/cdn/assets/files/2610/885D864537A8DF6D.pdf\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003epublic notice on 4 October\u003c/a\u003e and has updated it since, \u003ca href=\\\"https://www.okx.com/en-us/okxicetsv\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003emost recently on 19 October\u003c/a\u003e. Trading will run through permissioned Uniswap v4 pools on OKX's XLayer network, open only to verified wallets.\"},{\"_id\":\"paragraph-23-0\",\"type\":\"text\",\"content\":\"Under the SEC exemption, issuers get 30 days to object before a venue can trade their stock, \u003ca href=\\\"https://www.coindesk.com/markets/2026/10/05/okx-and-nyse-s-owner-file-for-round-the-clock-tokenized-trading-in-u-s-stocks\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCoinDesk reported\u003c/a\u003e. Counted from the 4 October notice, that means OKXICE could not start trading before 3 November. It has not given a launch date.\"},{\"_id\":\"paragraph-24-0\",\"type\":\"text\",\"content\":\"Its volume will be capped. For the most heavily traded stocks, each token's trading cannot exceed 0.25% of the underlying stock's average daily volume in the prior month, \u003ca href=\\\"https://www.okx.com/cdn/assets/files/2610/F085D8D65135AB9C.pdf\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eaccording to the notice\u003c/a\u003e.\"},{\"_id\":\"paragraph-25-0\",\"type\":\"text\",\"content\":\"Some issuers are pushing back. Microsoft and Alphabet, two of the companies in Securitize's line-up, are among the firms that have objected to having their shares tokenised under the SEC framework, \u003ca href=\\\"https://www.wsj.com/livecoverage/stock-market-today-dow-sp-500-nasdaq-10-20-2026/card/2RAS0YPXPxvECut6sUrP\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eThe Wall Street Journal reported\u003c/a\u003e on 20 October.\"},{\"_id\":\"paragraph-26-0\",\"type\":\"text\",\"content\":\"The NYSE has not given a launch date for its platform.\"},{\"_id\":\"paragraph-27-0\",\"type\":\"text\",\"content\":\"Securitize, which listed on the NYSE in July, reports third-quarter results in November.\"},{\"_id\":\"now-read-27\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/markets/nyse-to-launch-tokenised-securities-trading-platform/\",\"text\":\"\"}}},{\"_id\":\"paragraph-29-0\",\"type\":\"text\",\"content\":\"\u003cem\u003eKyle Pare is a reporter for DL News. Have a tip? Contact Kyle at \u003c/em\u003e\u003ca href=\\\"mailto:kyle@dlnews.com\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003e\u003cem\u003ekyle@dlnews.com\u003c/em\u003e\u003c/a\u003e\u003cem\u003e.\u003c/em\u003e\"}],\"guests\":[],\"subtype\":\"684aaabcc107f95de7aab4a4\",\"authors\":[\"6ad32f6fe8a2a0ba2951e576\"],\"main_asset\":\"699ffae6fc56c116b68a8c9f\",\"main_asset_info\":{\"article_caption\":\"Securitize shares have fallen since it launched tokenised US stocks on Solana. Illustration: Andrés Núñez\",\"copyright\":\"\",\"credit\":\"Andrés Núñez\",\"headline\":\"Tokenisation Private markets\",\"_id\":\"699ffae6fc56c116b68a8c9f\",\"src_url\":\"https://dl-migration-assets.s3.eu-central-1.amazonaws.com/images/1772092134172.webp\"},\"verticals\":[\"684aad1fc107f95de7aab4b1\"],\"primary_vertical\":\"684aad1fc107f95de7aab4b1\",\"tags\":[\"68df7e78bf9470d7206314f6\",\"68df7e78bf9470d720631645\"],\"workflow\":\"published\",\"story_info\":{\"words_count\":644,\"assets_count\":0,\"embeds_count\":3},\"previous_urls\":[],\"slug\":\"securitize-shares-fall-38percent-since-solana-stock-token-launch-or-dl-news\",\"created_at\":\"2026-10-22T16:20:03.120Z\",\"updated_at\":\"2026-10-22T18:18:21.930Z\",\"__v\":1,\"display_date\":\"2026-10-22T18:18:21.930Z\",\"first_publish_date\":\"2026-10-22T18:18:21.930Z\",\"publish_date\":\"2026-10-22T18:18:21.930Z\",\"url\":\"https://www.dlnews.com/articles/markets/securitize-shares-fall-38percent-since-solana-stock-token-launch-or-dl-news/\",\"subtypeObject\":{\"_id\":\"684aaabcc107f95de7aab4a4\",\"name\":\"News\",\"slug\":\"articles\"},\"mainAssetObject\":{\"_id\":\"699ffae6fc56c116b68a8c9f\",\"is_active\":true,\"is_deleted\":false,\"arc_asset_id\":\"FDTEOVBURFECHNB5W6NAHA7PSM\",\"src_url\":\"https://dl-migration-assets.s3.eu-central-1.amazonaws.com/images/1772092134172.webp\",\"headline\":\"Tokenisation Private markets\",\"credit\":\"Andrés Núñez\",\"type\":\"illustration\",\"mime_type\":\"image\",\"keywords\":[\"tokenisation\",\"private markets\"],\"subtypes\":[\"684aaabcc107f95de7aab4a4\"],\"main_asset_story_aggregate\":2,\"homepage_asset_story_aggregate\":0,\"social_media_asset_story_aggregate\":0,\"created_at\":\"2023-03-23T18:30:53.000Z\",\"updated_at\":\"2023-03-23T18:30:53.000Z\",\"__v\":0,\"article_caption\":\"\",\"image_caption\":\"\",\"arc_asset_url\":\"https://cloudfront-eu-central-1.images.arcpublishing.com/dlnews/FDTEOVBURFECHNB5W6NAHA7PSM.jpg\",\"events_images_aggregate\":0,\"reports_images_aggregate\":0,\"users_images_aggregate\":0,\"last_used_at\":\"2026-10-22T18:18:21.930Z\",\"last_used_by\":\"6a349704180e41a1b12d2197\"},\"tagsObjects\":[{\"_id\":\"68df7e78bf9470d7206314f6\",\"slug\":\"solana\",\"name\":\"Solana\"},{\"_id\":\"68df7e78bf9470d720631645\",\"slug\":\"tokenisation\",\"name\":\"Tokenisation\"}],\"authorsObjects\":[{\"_id\":\"6ad32f6fe8a2a0ba2951e576\",\"first_name\":\"Kyle\",\"last_name\":\"Pare\",\"name\":\"Kyle Pare\",\"slug\":\"kyle-pare\"}],\"primaryVerticalObject\":{\"_id\":\"684aad1fc107f95de7aab4b1\",\"name\":\"Markets\",\"slug\":\"markets\"},\"verticalsObjects\":[{\"_id\":\"684aad1fc107f95de7aab4b1\",\"name\":\"Markets\",\"slug\":\"markets\"}]},{\"_id\":\"69f4cdb7d8f2ce6530e3f161\",\"is_active\":true,\"is_deleted\":false,\"headline\":\"‘Every hit earns crypto’? App that gives users Bitcoin for getting stoned deemed ‘dangerous’ and ‘unethical’\",\"subheadline\":\"\",\"description\":\"\",\"meta_data\":{\"title\":\"Gudtrip app gives users Bitcoin and deemed unethical\",\"description\":\"\"},\"sub_vertical\":\"internal\",\"content_elements\":[{\"_id\":\"section-info-0\",\"type\":\"custom_embed\",\"subtype\":\"section-info\",\"embed\":{\"id\":\"\",\"config\":{\"text\":\"A cannabis vape pen company is giving out Bitcoin.\\n“Every hit earns crypto,” a tagline on the company’s website reads.\\nGudtrip says its product isn’t designed to encourage greater cannabis consumption.\",\"title\":\"\"}}},{\"_id\":\"paragraph-1-0\",\"type\":\"text\",\"content\":\"A California-based cannabis vape pen company that says it rewards customers with crypto for using its product is raising alarm among health experts and anti-drug campaigners.\"},{\"_id\":\"paragraph-2-0\",\"type\":\"text\",\"content\":\"Gudtrip advertises itself as building a user-powered network that combines cannabis, Bitcoin, and artificial intelligence.\"},{\"_id\":\"paragraph-3-0\",\"type\":\"text\",\"content\":\"“Every hit earns crypto,” a tagline on the company’s \u003ca href=\\\"https://gudtrip.com/#product\\\"\u003e\u003cu\u003ewebsite\u003c/u\u003e\u003c/a\u003e reads.\"},{\"_id\":\"paragraph-4-0\",\"type\":\"text\",\"content\":\"Customers who buy one of the company’s cannabis vape pens can connect it to an app, which rewards them with Bitcoin, and points for using the pen. “Checking-in” daily creates streaks which increase points earned by up to 200%.\"},{\"_id\":\"paragraph-5-0\",\"type\":\"text\",\"content\":\"Several researchers studying cannabis consumption who spoke to \u003cem\u003eDL News\u003c/em\u003e said encouraging daily use is potentially dangerous and habit-forming, raising ethical concerns.\"},{\"_id\":\"paragraph-6-0\",\"type\":\"text\",\"content\":\"“Gamifying cannabis use? It certainly sounds like habit-formation is the goal,” Joshua Gowin, an associate professor who studies the effects of frequent cannabis use at the University of Colorado Anschutz, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-7-0\",\"type\":\"text\",\"content\":\"“Linking a reward to a puff/smoking session reinforces the behaviour, increasing the chance of escalating use and even developing an addiction,” Janna Cousijn, head of the Neuroscience of Addiction Lab at the Erasmus University Rotterdam, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-8-0\",\"type\":\"text\",\"content\":\"“It is potentially a very dangerous and unethical device that could stimulate the development of addiction,” she said.\"},{\"_id\":\"paragraph-9-0\",\"type\":\"text\",\"content\":\"A Gudtrip spokesperson told \u003cem\u003eDL News \u003c/em\u003ethe company is “deeply mindful” of the risks associated with cannabis products and that its product isn’t designed to encourage greater consumption.\"},{\"_id\":\"heading-10\",\"type\":\"header\",\"level\":2,\"content\":\"Pushing the boundaries\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-11-0\",\"type\":\"text\",\"content\":\"In recent years, the crypto industry has become a hotbed for products that gamify finance, blur the lines between investing and gambling, and push the boundaries of what is allowed under current laws.\"},{\"_id\":\"paragraph-12-0\",\"type\":\"text\",\"content\":\"For example, blockchain-based prediction markets, platforms that let users bet on the outcomes of everything from sports and politics to whether the US government will \u003ca href=\\\"https://polymarket.com/predictions/aliens\\\"\u003e\u003cu\u003econfirm\u003c/u\u003e\u003c/a\u003e the existence of aliens, have \u003ca href=\\\"https://www.trmlabs.com/resources/blog/how-prediction-markets-scaled-to-usd-21b-in-monthly-volume-in-2026\\\"\u003e\u003cu\u003esurged\u003c/u\u003e\u003c/a\u003e into a $21 billion industry.\"},{\"_id\":\"now-read-13\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/defi/ethcc-exposes-ethereum-identity-crisis/\",\"text\":\"\"}}},{\"_id\":\"paragraph-14-0\",\"type\":\"text\",\"content\":\"Many US states, gaming regulators, and lawmakers \u003ca href=\\\"https://www.dlnews.com/articles/regulation/kalshi-launches-whistleblower-function-to-oust-insider-traders/\\\"\u003e\u003cu\u003eargue\u003c/u\u003e\u003c/a\u003e prediction markets are essentially gambling, a tightly regulated industry. Prediction market platforms contend that they are not, and are instead financial trading platforms.\"},{\"_id\":\"paragraph-15-0\",\"type\":\"text\",\"content\":\"Gudtrip, which also advertises that customers can invest their rewards using “open-source AI agent tools” in “blockchain-based strategies,” fits this crypto industry trend to a tee.\"},{\"_id\":\"paragraph-16-0\",\"type\":\"text\",\"content\":\"Gudtrip’s parent company, Puffpaw, is growing fast. After \u003ca href=\\\"https://www.blocmates.com/news-posts/berachain-based-vaping-project-puffpaw-raises-6-million\\\"\u003e\u003cu\u003ereceiving\u003c/u\u003e\u003c/a\u003e $6 million in venture funding in 2024, the company says it has \u003ca href=\\\"https://x.com/puffpaw/status/2015792215784890587\\\"\u003e\u003cu\u003esold\u003c/u\u003e\u003c/a\u003e over 140,000 products, although this figure includes its more widespread nicotine-based products.\"},{\"_id\":\"heading-17\",\"type\":\"header\",\"level\":2,\"content\":\"Ethical concerns\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-18-0\",\"type\":\"text\",\"content\":\"There’s a mountain of research that has tied heavy cannabis consumption, which includes using cannabis daily or almost every day, to a range of negative health effects.\"},{\"_id\":\"paragraph-19-0\",\"type\":\"text\",\"content\":\"They include increased risk of mental health disorders including anxiety, depression and psychosis, impairments in memory, attention and learning, respiratory problems, and even an elevated risk of heart attacks and strokes.\"},{\"_id\":\"quote-20\",\"type\":\"quote\",\"content_elements\":[{\"_id\":\"paragraph-0-0\",\"type\":\"text\",\"content\":\"\\\"This certainly raises ethical concerns\\\"\"}]},{\"_id\":\"paragraph-21-0\",\"type\":\"text\",\"content\":\"“From a public health perspective, I would be concerned about any product designed to incentivise frequent cannabis use,” Francesca Filbey, a researcher who studies the long-term effects of cannabis use at the University of Texas at Dallas, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-22-0\",\"type\":\"text\",\"content\":\"“This certainly raises ethical concerns,” she said.\"},{\"_id\":\"paragraph-23-0\",\"type\":\"text\",\"content\":\"To be sure, many of the health impacts of using cannabis are reduced for those who use the drug only occasionally.\"},{\"_id\":\"paragraph-24-0\",\"type\":\"text\",\"content\":\"Several drug risk assessment studies published in peer-reviewed medical journals have \u003ca href=\\\"https://www.thelancet.com/article/S0140-6736(10)61462-6/fulltext\\\"\u003e\u003cu\u003efound\u003c/u\u003e\u003c/a\u003e that cannabis use is less harmful than seven other popular drugs, including tobacco and alcohol.\"},{\"_id\":\"now-read-25\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/people-culture/wallets-tied-to-andean-medjedovic-use-tornado-cash/\",\"text\":\"\"}}},{\"_id\":\"paragraph-26-0\",\"type\":\"text\",\"content\":\"Yet the more cannabis people use, the greater their risk of suffering adverse consequences, Tom Freeman, director of the Addiction and Mental Health Group, who specialises in cannabis’ mental health impacts and the therapeutic potential, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-27-0\",\"type\":\"text\",\"content\":\"The best way to manage risk is through careful and informed choices based on THC content and following safer use guidelines, Freeman said.\"},{\"_id\":\"paragraph-28-0\",\"type\":\"text\",\"content\":\"“Providing incentives for people who consume more will impair their ability to make choices in the best interests of their health, escalating their use and risk of harms,” he said.\"},{\"_id\":\"heading-29\",\"type\":\"header\",\"level\":2,\"content\":\"Only points?\",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-30-0\",\"type\":\"text\",\"content\":\"The Gudtrip spokesperson said the only financial reward in the product is Bitcoin, which is part of a “standard consumer loyalty programme,” and not scaled to, gated by, or otherwise associated with the level, frequency, or duration of cannabis consumption.\"},{\"_id\":\"paragraph-31-0\",\"type\":\"text\",\"content\":\"The points customers earn are “used solely for record-keeping in the app” and cannot be redeemed for cash, cryptocurrency, products, or anything else of monetary value, the spokesperson said.\"},{\"_id\":\"paragraph-32-0\",\"type\":\"text\",\"content\":\"“We believe that an adult in a legal market who has visibility into their own consumption is better positioned to avoid problematic use than one who does not,” the spokesperson said.\"},{\"_id\":\"paragraph-33-0\",\"type\":\"text\",\"content\":\"That’s at odds with information on the Gudtrip website, which tells potential customers that “every hit earns crypto,” and shows images of an app user earning a 200% “boost” after “checking-in” to the app consecutively for four days.\"},{\"_id\":\"image-34\",\"type\":\"image\",\"url\":\"https://dl-production-assets.s3.eu-central-1.amazonaws.com/images/1777651872139-asset.webp\",\"link\":\"\",\"alt_text\":\"every hit earns crypto\",\"headline\":\"every hit earns crypto\",\"credit\":\"Gudtrip\",\"copyright\":\"Gudtrip\",\"article_caption\":\"\\\"Every hit earns crypto.\\\" Source: Gudtrip \",\"alignment\":\"center\",\"keywords\":[]},{\"_id\":\"paragraph-35-0\",\"type\":\"text\",\"content\":\"“In the old consumer model, users bought products and brands kept the upside. In the Gudtrip model, users help build the network and deserve to share in the value they create,” marketing copy on the Gudtrip website reads.\"},{\"_id\":\"paragraph-36-0\",\"type\":\"text\",\"content\":\"Gudtrip did not immediately respond to a request for comment asking it to address the inconsistencies between the information provided to customers on its website and the comments given to \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-37-0\",\"type\":\"text\",\"content\":\"What’s more, Gudtrip’s customers may have other reasons to believe points are not just a record-keeping tool.\"},{\"_id\":\"paragraph-38-0\",\"type\":\"text\",\"content\":\"In the crypto industry, issuing so-called points is widely understood as laying the groundwork for issuing a valuable crypto token.\"},{\"_id\":\"paragraph-39-0\",\"type\":\"text\",\"content\":\"In recent years, dozens of crypto projects have \u003ca href=\\\"https://www.dlnews.com/articles/defi/why-defi-protocols-love-to-offer-points-before-airdrops/\\\"\u003e\u003cu\u003eissued\u003c/u\u003e\u003c/a\u003e points, and at a later date have converted them into valuable crypto tokens. Those who earn points are often so sure that they will eventually be worth money that they are \u003ca href=\\\"https://whales.market/en\\\"\u003e\u003cu\u003ewilling\u003c/u\u003e\u003c/a\u003e to buy and sell them on secondary markets.\"},{\"_id\":\"image-40\",\"type\":\"image\",\"url\":\"https://dl-production-assets.s3.eu-central-1.amazonaws.com/images/1777651999864-asset.webp\",\"link\":\"\",\"alt_text\":\"Put rewards to work\",\"headline\":\"Put rewards to work\",\"credit\":\"Gudtrip\",\"copyright\":\"Gudtrip\",\"article_caption\":\"\\\"Put rewards to work.\\\" Source: Gudtrip\",\"alignment\":\"center\",\"keywords\":[]},{\"_id\":\"paragraph-41-0\",\"type\":\"text\",\"content\":\"Puffpaw, Gudtrip’s parent company, has explicitly \u003ca href=\\\"https://x.com/Gudtrip/status/2041266151674773816\\\"\u003e\u003cu\u003etold\u003c/u\u003e\u003c/a\u003e customers that it plans to launch a token in the future.\"},{\"_id\":\"paragraph-42-0\",\"type\":\"text\",\"content\":\"The Gudtrip spokesperson said the company does not plan to issue a token in connection with its product.\"},{\"_id\":\"heading-43\",\"type\":\"header\",\"level\":2,\"content\":\"Legal status \",\"additional_properties\":{\"link\":\"\"}},{\"_id\":\"paragraph-44-0\",\"type\":\"text\",\"content\":\"For other drugs and controlled substances in the US, industry players adhere to voluntary self-regulatory codes.\"},{\"_id\":\"paragraph-45-0\",\"type\":\"text\",\"content\":\"For example, in the alcohol industry, the Distilled Spirits Council’s Code of Responsible Practice explicitly requires that advertising and promotion “discourage excessive or abusive consumption,” not portray intoxication as acceptable, and avoid depicting drinking games or other activities that reward heavy drinking.\"},{\"_id\":\"paragraph-46-0\",\"type\":\"text\",\"content\":\"Cannabis, however, remains illegal at the federal level, making it more difficult to unite the industry and enforce best practices.\"},{\"_id\":\"quote-47\",\"type\":\"quote\",\"content_elements\":[{\"_id\":\"paragraph-0-0\",\"type\":\"text\",\"content\":\"\\\"California's financial and health authorities need to act against this insanity\\\"\"}]},{\"_id\":\"paragraph-48-0\",\"type\":\"text\",\"content\":\"The National Cannabis Industry Association, the largest US nonprofit trade organisation representing cannabis businesses, did not respond to a request for comment.\"},{\"_id\":\"paragraph-49-0\",\"type\":\"text\",\"content\":\"Instead, states that have legalised cannabis come up with their own rules independently.\"},{\"_id\":\"paragraph-50-0\",\"type\":\"text\",\"content\":\"Currently, Gudtrip vape pens are only available in California, one of 25 US states to fully legalise cannabis for recreational use. California, unlike many other states, doesn't explicitly prohibit advertising or other forms of promotion that encourages excessive use of the drug.\"},{\"_id\":\"paragraph-51-0\",\"type\":\"text\",\"content\":\"Some states, such as Massachusetts, previously banned customer loyalty programmes for cannabis products to avoid encouraging overconsumption. These prohibitions were \u003ca href=\\\"https://www.westernmassnews.com/2026/04/20/mass-cannabis-control-commission-expands-marijuana-laws/\\\"\u003e\u003cu\u003elifted\u003c/u\u003e\u003c/a\u003e on April 20.\"},{\"_id\":\"paragraph-52-0\",\"type\":\"text\",\"content\":\"“Paying people to use this stuff — literally paying them — is unacceptable,” Kevin Sabet, CEO of Smart Approaches to Marijuana, a non-profit that opposes the legalisation and commercialisation of cannabis, told \u003cem\u003eDL News\u003c/em\u003e. “California's financial and health authorities need to act against this insanity.”\"},{\"_id\":\"now-read-52\",\"type\":\"custom_embed\",\"subtype\":\"now-read\",\"embed\":{\"id\":\"\",\"config\":{\"url\":\"https://www.dlnews.com/articles/people-culture/fed-nominee-kevin-warsh-invested-in-20-crypto-firms/\",\"text\":\"\"}}},{\"_id\":\"paragraph-54-0\",\"type\":\"text\",\"content\":\"“The Department of Cannabis Control does not promote increased consumption of cannabis and encourages those who use cannabis to do so responsibly,” Jordan Traverso, deputy director of public affairs at the organisation, told \u003cem\u003eDL News\u003c/em\u003e.\"},{\"_id\":\"paragraph-55-0\",\"type\":\"text\",\"content\":\"The Department of Cannabis Control, or DCC, licenses and regulates commercial cannabis activity in California.\"},{\"_id\":\"paragraph-56-0\",\"type\":\"text\",\"content\":\"“We were not previously familiar with the Gudtrip product but have reached out to the manufacturer to learn more about its features,” Traverso said.\"},{\"_id\":\"paragraph-57-0\",\"type\":\"text\",\"content\":\"\u003cem\u003eTim Craig is DL News’ Edinburgh-based DeFi Correspondent. Reach out with tips at \u003c/em\u003e\u003ca href=\\\"mailto:tim@dlnews.com\\\" target=\\\"_blank\\\" rel=\\\" nofollow nofollow nofollow nofollow nofollow nofollow nofollow nofollow\\\"\u003e\u003cem\u003etim@dlnews.com\u003c/em\u003e\u003c/a\u003e\u003cem\u003e.\u003c/em\u003e\"}],\"guests\":[],\"subtype\":\"684aaabcc107f95de7aab4a4\",\"authors\":[\"68df93f9bfd0cfb96db872ff\"],\"verticals\":[\"684aad1fc107f95de7aab4b2\"],\"primary_vertical\":\"684aad1fc107f95de7aab4b2\",\"tags\":[\"68df7e77bf9470d72063096e\"],\"workflow\":\"published\",\"story_info\":{\"words_count\":1285,\"assets_count\":2,\"embeds_count\":4},\"previous_urls\":[],\"slug\":\"gudtrip-app-gives-users-bitcoin-and-deemed-unethical\",\"created_at\":\"2026-05-01T15:58:47.851Z\",\"updated_at\":\"2026-05-04T11:30:08.827Z\",\"__v\":1,\"display_date\":\"2026-05-04T11:30:08.827Z\",\"first_publish_date\":\"2026-05-04T11:30:08.827Z\",\"main_asset\":\"69f4b684c2fc868b3be73bc0\",\"main_asset_info\":{\"article_caption\":\"Gudtrip says its product isn’t designed to encourage greater cannabis consumption. Illustration: DL News; Source: Shutterstock, Gudtrip\",\"copyright\":\"Shutterstock, Gudtrip\",\"credit\":\"DL News\",\"headline\":\"‘Every hit earns crypto’ App that gives users reward streaks for getting stoned deemed ‘dangerous’ and ‘unethical’\",\"_id\":\"69f4b684c2fc868b3be73bc0\",\"src_url\":\"https://dl-production-assets.s3.eu-central-1.amazonaws.com/images/1777645189269-asset.webp\"},\"publish_date\":\"2026-05-04T11:30:08.827Z\",\"url\":\"https://www.dlnews.com/articles/web3/gudtrip-app-gives-users-bitcoin-and-deemed-unethical/\",\"subtypeObject\":{\"_id\":\"684aaabcc107f95de7aab4a4\",\"name\":\"News\",\"slug\":\"articles\"},\"mainAssetObject\":{\"_id\":\"69f4b684c2fc868b3be73bc0\",\"meta_data\":{\"description\":\"‘Every hit earns crypto’ App that gives users reward streaks for getting stoned deemed ‘dangerous’ and ‘unethical’\"},\"is_active\":true,\"is_deleted\":false,\"type\":\"illustration\",\"keywords\":[\"Gudtrip\",\"cannabis\"],\"subtypes\":[\"684aaabcc107f95de7aab4a4\"],\"main_asset_story_aggregate\":1,\"homepage_asset_story_aggregate\":0,\"social_media_asset_story_aggregate\":0,\"created_at\":\"2026-05-01T14:19:48.911Z\",\"updated_at\":\"2026-05-01T14:19:48.911Z\",\"mime_type\":\"image\",\"headline\":\"‘Every hit earns crypto’ App that gives users reward streaks for getting stoned deemed ‘dangerous’ and ‘unethical’\",\"credit\":\"DL News\",\"copyright\"
