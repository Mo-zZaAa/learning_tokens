<title>KDX 해외 사례</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 위 막대(회사 6, 보기 2, 찾기, 메모) 아래 본문 한 단. 개요는 읽기 폭, raw는 표 폭 */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212d; --muted:#5d6878; --faint:#8a94a3;
  --line:#dde2e9; --accent:#22509e; --accent-soft:#e6edf8;
  --judge:#8f4700; --judge-soft:#fdeedb; --ok:#2b7a4b; --ok-soft:#e3f2e8; --mid:#7a5b00; --mid-soft:#f8f0d4;
  --warn:#9b2c2c; --warn-soft:#fbe5e5; --quote:#f7f8fb; --hl:#fff0a0; --hl-ink:#3d3300; --pmq:#1d4ed8; --pmq-bg:#e8efff;
  --memo:#7a3fb8; --memo-soft:#f3ebfc; --on-memo:#ffffff; --shade:rgba(16,24,40,.14); --scrim:rgba(16,24,40,.38);
  --navy:#1f3a6e;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"D2Coding",monospace;
  --hdr:120px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141a; --panel:#171c24; --ink:#e4e9f0; --muted:#a0abba; --faint:#76808f;
  --line:#2a313c; --accent:#86aef5; --accent-soft:#1d2a40;
  --judge:#ffb366; --judge-soft:#3a2614; --ok:#6fcf97; --ok-soft:#173226; --mid:#e6c35c; --mid-soft:#332a10;
  --warn:#ff8a8a; --warn-soft:#3a1c1c; --quote:#1b212b; --hl:#5a4d10; --hl-ink:#fff1b0; --pmq:#9ec1ff; --pmq-bg:#18264a;
  --memo:#c9a2f5; --memo-soft:#2b2140; --on-memo:#1d1230; --shade:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55); --navy:#a9c1f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141a; --panel:#171c24; --ink:#e4e9f0; --muted:#a0abba; --faint:#76808f;
  --line:#2a313c; --accent:#86aef5; --accent-soft:#1d2a40;
  --judge:#ffb366; --judge-soft:#3a2614; --ok:#6fcf97; --ok-soft:#173226; --mid:#e6c35c; --mid-soft:#332a10;
  --warn:#ff8a8a; --warn-soft:#3a1c1c; --quote:#1b212b; --hl:#5a4d10; --hl-ink:#fff1b0; --pmq:#9ec1ff; --pmq-bg:#18264a;
  --memo:#c9a2f5; --memo-soft:#2b2140; --on-memo:#1d1230; --shade:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55); --navy:#a9c1f2; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
table{font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[id]{scroll-margin-top:var(--hdr)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 위 막대 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:800;letter-spacing:-.01em;white-space:nowrap;font-size:15px}
.cos{display:flex;gap:4px;min-width:0}
.cos button,.seg button,.memobtn,.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 9px;font-size:14px;line-height:1.3;white-space:nowrap}
.cos button[aria-current="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700}
.cos button small{font-size:11px;color:var(--faint);margin-left:3px}
.cos button[aria-current="true"] small{color:var(--panel);opacity:.75}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;background:var(--bg)}
.seg button{border:0;background:transparent;padding:4px 14px;border-radius:6px}
.seg button[aria-selected="true"]{background:var(--panel);box-shadow:0 1px 2px var(--shade);font-weight:700;color:var(--accent)}
.search{position:relative;flex:1 1 100px;min-width:0}
.search input{width:100%;font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.memobtn{display:inline-flex;gap:6px;align-items:center}
.memobtn b{min-width:1.6em;text-align:center;background:var(--memo-soft);color:var(--memo);border-radius:9px;padding:0 6px;font-size:12px;font-variant-numeric:tabular-nums}
.sres{position:absolute;right:0;top:calc(100% + 6px);width:min(680px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px var(--shade);z-index:35;padding:6px}
.sres .sh{display:flex;justify-content:space-between;gap:8px;padding:4px 8px 8px;color:var(--muted);font-size:13px}
.sres .sco{font-size:12px;font-weight:700;color:var(--muted);padding:8px 8px 2px;letter-spacing:.02em}
.sres .it{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:7px 8px}
.sres .it:hover,.sres .it:focus-visible{background:var(--accent-soft)}
.sres .loc{display:block;font-size:12px;color:var(--muted)}
.sres .loc b{color:var(--ink)}
.sres .sn{display:block;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.sres mark,mark.hit{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}
.sres .none{padding:10px 8px;color:var(--muted)}

/* 본문 */
.main{max-width:1180px;margin:0 auto;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pagehead{display:grid;gap:4px;margin-bottom:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.pagehead h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px}
.meta code,.path code,code{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tools button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;font-size:13px}
.ready{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;color:var(--muted);background:var(--panel)}
.ready b{color:var(--judge);margin-right:6px}
.empty{color:var(--faint)}

/* 개요 */
.deeplink{margin:6px 0 10px;font-weight:700}
.ov{max-width:none}
.read{max-width:800px}
.lnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,57px));z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;padding-block:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.lnav a{text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
.lnav a b{color:var(--accent);margin-right:4px;font-variant-numeric:tabular-nums}
.lnav a.off{color:var(--faint)}
.layer{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.layer>*{min-width:0}
.lhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-top:2px solid var(--ink);padding-top:8px}
.ov .pagehead{margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.ov .pagehead .eyebrow{flex-basis:100%}
.ov .pagehead h1{font-size:24px}
.ov .lnav{padding-block:6px;margin-bottom:0}
.ov .layer:first-of-type{margin-top:10px}
.ov .cgrid .cbox>h3{margin-bottom:2px}
.lhead .lnum{font-size:12px;font-weight:800;color:var(--panel);background:var(--ink);border-radius:5px;padding:1px 8px;letter-spacing:.04em}
.lhead h2{margin:0;font-size:21px;letter-spacing:-.01em}
.lhead code{color:var(--faint)}
.lpart{display:block;min-width:0}
.ptitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:8px 0 8px}
.ptitle h3{margin:0;font-size:16px}
.ptitle code,.ptitle span{color:var(--faint);font-size:12.5px}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12.5px;line-height:1.42}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.cbox>h3{margin:0 0 4px;font-size:14px;color:var(--accent)}
.cbox .li{padding-block:1px;gap:6px}
.lnav .tools{margin:0 0 0 auto;display:flex;gap:6px}
.lnav .tools button{padding:2px 9px;font-size:12.5px}
.cbox .d1{margin-left:16px}.cbox .d2{margin-left:32px}
.cbox .li.d0 .tx strong{font-weight:700}
/* ODX 카드(개요 패키지): 왼쪽 줄 이름, 오른쪽 내용 */
.odx{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:14px;padding:16px 22px 18px;max-width:1180px}
.odx-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.odx-hd b{font-size:22px;color:var(--navy);border-bottom:2px dotted var(--navy)}
.odx-hd span{color:var(--muted)}
.orow{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;padding:12px 0;border-bottom:1px dashed var(--line)}
.orow:last-child{border-bottom:0}
.olab{margin:0;font-size:15px;font-weight:700;color:var(--navy)}
.orow.danger .olab{color:var(--warn)}
.obody{min-width:0}
.obody ul.omain,.obody ol.omain{margin:0;padding-left:20px}
.obody .omain>li{margin:0 0 6px}
.obody li.strong>.oi>.tx{color:var(--navy);font-weight:700}
.obody ul.osub{margin:4px 0 2px;padding-left:18px}
.obody ul.osub li{margin:2px 0}
.oi{padding-right:28px}
.oi .tx{overflow-wrap:anywhere}
.tg{display:inline-block;font-size:11.5px;line-height:1.5;padding:0 7px;border-radius:5px;margin-left:5px;vertical-align:1px;border:0;cursor:pointer;font-family:var(--sans)}
.tg-s{background:var(--accent-soft);color:var(--accent)}
.tg-n{background:var(--ok-soft);color:var(--ok)}
.tg-i{background:var(--memo-soft);color:var(--memo)}
.tg-e{background:var(--judge-soft);color:var(--judge)}
.tg-u{background:var(--mid-soft);color:var(--mid)}
details.omore,details.ofig{margin:4px 0}
details.omore>summary,details.ofig>summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none;display:inline-block;padding:1px 9px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
details.omore>summary::-webkit-details-marker,details.ofig>summary::-webkit-details-marker{display:none}
details.omore>summary::before,details.ofig>summary::before{content:"\25B8  ";color:var(--faint)}
details.omore[open]>summary::before,details.ofig[open]>summary::before{content:"\25BE  "}
details.ofig>summary{color:var(--memo);border-color:color-mix(in srgb,var(--memo) 35%,var(--line));background:var(--memo-soft)}
.onote{margin:4px 0 6px}
.opath{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px 14px}
.opk{color:var(--accent);font-weight:700}
.opv{min-width:0}
.opv .k2{text-decoration:underline;text-underline-offset:3px;margin-right:4px}
.tip .rq{margin:4px 0 8px;padding-left:8px;border-left:2px solid var(--line);color:var(--ink);font-size:12.5px;overflow-wrap:anywhere}
.tip .rt{font-weight:600;font-size:12.5px;overflow-wrap:anywhere}
.tip .rf{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:4px}
.tip.ref{max-height:min(60vh,420px);overflow:auto}
@media (max-width:760px){.odx{padding:12px 14px}.orow{grid-template-columns:1fr;gap:6px}.opath{grid-template-columns:1fr;gap:2px}.opath .opv{margin-bottom:8px}}
/*__FLOW_CSS__*/
.qg:not(.open)>.qas{display:none}
.qas{margin:2px 0 6px 14px;padding-left:8px;border-left:2px solid var(--line);display:grid;gap:2px}
.qas .li{padding-block:2px}
.qas .li .bul{width:8px}
.qtog{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:999px;font-size:11px;line-height:1.2;padding:1px 7px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.qg.open>.ln .qtog{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.qtog.hasans{box-shadow:inset 0 0 0 2px var(--ok)}
.qq2{font-weight:700;color:var(--accent)}
.qarr{color:var(--faint);margin:0 3px}
.lhead .qall{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:2px 10px;font-size:12.5px}
.artw{padding-right:30px}
.art{margin:6px 0;padding:10px 12px;background:var(--quote);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:13px;line-height:1.5;white-space:pre;overflow-x:auto;max-width:100%}
details.ans{display:inline}
details.ans>summary{display:inline-block;cursor:pointer;font-size:12.5px;color:var(--memo);background:var(--memo-soft);border-radius:999px;padding:0 9px;margin:2px 0 2px 4px;list-style:none}
details.ans>summary::-webkit-details-marker{display:none}
details.ans[open]{display:block;margin:4px 0 6px;padding:6px 10px;border-left:3px solid var(--memo);background:var(--memo-soft);border-radius:0 6px 6px 0}
details.ans[open]>summary{margin:0 0 4px}
div.ansg>details.ans{display:block;margin:2px 0 8px 22px}
.cnote{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;display:grid;gap:8px}
.cnote .links{display:flex;flex-wrap:wrap;gap:6px}
.cnote .links button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 10px;font-size:13px}
.intro{color:var(--muted);font-size:14px;margin-bottom:12px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 18px 12px;margin-bottom:12px}
.sec.pin{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.sec h2{font-size:18px;margin:10px 0 8px;letter-spacing:-.01em}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:2px 0}
details.sec>summary::-webkit-details-marker,details.rsec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{margin:8px 0;flex:1}
details.sec>summary::after,details.rsec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:4px}
details[open].sec>summary::after,details[open].rsec>summary::after{transform:rotate(45deg)}
.cnt{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

.ln{position:relative;padding-right:30px;border-radius:5px}
.li{display:flex;gap:8px;padding-block:3px}
.li .bul{flex:none;width:14px;position:relative}
.li:not(.ol) .bul::before{content:"";position:absolute;left:4px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--faint)}
.li.ol .bul{width:auto;min-width:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.li.ol.d0{margin-top:10px;font-size:15.5px}
.li .tx{min-width:0;flex:1;overflow-wrap:anywhere}
.d1{margin-left:22px}.d2{margin-left:44px}.d3{margin-left:66px}.d4{margin-left:88px}
.li.d1:not(.ol) .bul::before{background:transparent;border:1.5px solid var(--faint)}
.li.d2 .bul::before,.li.d3 .bul::before{width:7px;height:2px;border-radius:0;top:.85em}
p.ln{margin:6px 0}
h3.ln{font-size:15.5px;margin:12px 0 4px}
.todo{color:var(--faint);background:var(--quote);border:1px dashed var(--line);border-radius:4px;padding:0 4px;font-size:.9em}
.judge{background:var(--judge-soft);color:var(--judge);font-weight:700;border-radius:4px;padding:0 4px;white-space:nowrap}
.ref{font-family:var(--mono);font-size:.8em;text-decoration:none;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 4px;white-space:nowrap}
.ref:hover{text-decoration:underline}
mark.em{background:var(--hl);color:var(--hl-ink)}
strong.warn{color:var(--warn)}
/* 표 너비 조절 */
.fw-tb th{position:relative}
.rzh{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:3;touch-action:none}
.rzh::after{content:"";position:absolute;top:20%;bottom:20%;right:0;width:2px;border-radius:2px;background:var(--line)}
.rzh:hover::after,.rzing .rzh::after{background:var(--pmq)}
table.rz{table-layout:fixed}
table.rz th{white-space:normal;overflow:hidden}
table.rz td{max-width:none;min-width:0}
body.rzing{cursor:col-resize;user-select:none}
/* 화면에서 고치기 */
.edbtn b:empty{display:none}
.edbtn[aria-pressed="true"]{background:var(--pmq-bg);color:var(--pmq);border-color:var(--pmq)}
body.editing main .ln[id]{cursor:text}
body.editing main .ln[id]:not(tr):hover,body.editing main tr.ln td:not(.mc):hover{outline:1.5px dashed var(--pmq);outline-offset:1px;border-radius:4px}
.eded:not(tr){box-shadow:inset 3px 0 0 var(--pmq)}
td.eded{box-shadow:inset 0 0 0 1.5px var(--pmq)}
body:not(.editing) .edel{display:none!important}
body.editing .edel{opacity:.45;text-decoration:line-through}
.edbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--pmq);border-radius:14px;padding:7px 10px 7px 14px;box-shadow:0 8px 24px var(--shade);font-size:13.5px;max-width:calc(100vw - 24px)}
.edbar button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px}
.ehint{font-size:12.5px;color:var(--muted);margin:0}
.mbtns .left{margin-right:auto}
@media (max-width:760px){.rzh{display:none}table.rz{width:auto!important;table-layout:auto}}

.orow.hot{background:color-mix(in srgb,var(--hl) 28%,transparent);border-radius:12px;box-shadow:inset 5px 0 0 #e6b800;padding-left:12px;padding-right:8px;margin:6px 0}
.orow.hot .olab{color:var(--hl-ink)}
.cbox.wide{grid-column:1/-1}
.cbox.hot{background:color-mix(in srgb,var(--hl) 28%,var(--panel));box-shadow:inset 5px 0 0 #e6b800}
.gobtn{margin-left:6px;border:1px solid var(--pmq);background:var(--pmq-bg);color:var(--pmq);border-radius:999px;padding:0 9px;font-size:12px;font-weight:700;line-height:1.7;white-space:nowrap;vertical-align:1px;cursor:pointer}
.gobtn:hover{filter:brightness(.95)}
.pmq{color:var(--pmq);background:var(--pmq-bg);font-weight:700;font-size:.82em;border-radius:999px;padding:1px 7px;margin:0 2px;white-space:nowrap;vertical-align:1px}

/* 줄 메모 단추 */
.mb{position:absolute;right:2px;top:3px;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--faint);
  display:grid;place-items:center;opacity:0;transition:opacity .12s;padding:0}
.mb svg{width:14px;height:14px}
.ln:hover>.mb,.ln:hover>td>.mb,.mb:focus-visible{opacity:1}
.mb:hover{background:var(--memo-soft);color:var(--memo)}
@media (hover:none){.mb{opacity:.45}}
.hm{background:var(--memo-soft)}
.ha{background:var(--ok-soft)}
.ha>.mb,.ha>td>.mb{opacity:1;color:var(--ok)}
.abadge{border:0;border-radius:999px;background:var(--ok);color:var(--panel);font-size:11px;font-weight:700;line-height:1;padding:3px 7px;margin-left:6px;vertical-align:2px;cursor:pointer}
.abadge::after{content:"답"}

function hilite(el, q){
  const keys = [q.trim()].concat(q.trim().split(/\s+/).filter(t => t.length > 1));
  for (const key of keys){
    const kl = key.toLowerCase(); if (!kl) continue;
    const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement && n.parentElement.closest('button,svg') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    const nodes = []; while (tw.nextNode()) nodes.push(tw.currentNode);
    let hit = 0;
    for (const n of nodes){
      const s = n.nodeValue, sl = s.toLowerCase(); let i = sl.indexOf(kl), last = 0; if (i < 0) continue;
      const frag = document.createDocumentFragment();
      while (i >= 0){ frag.appendChild(document.createTextNode(s.slice(last, i))); const mk = document.createElement('mark'); mk.className = 'hit'; mk.textContent = s.slice(i, i + key.length); frag.appendChild(mk); last = i + key.length; i = sl.indexOf(kl, last); hit++; }
      frag.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(frag, n);
    }
    if (hit) return;
  }
  el.classList.add('hitline');
}

    const m = JSON.parse(JSON.stringify(raw));
    if (m.v === 5 && m.mid){
      synced[m.mid] = JSON.stringify(m);
      if (M.del.includes(m.mid)) return;
      const i = M.memos.findIndex(x => x.mid === m.mid);
      if (i < 0){ M.memos.push(m); changed = true; }
      else { const L = M.memos[i]; if ((m.st === '반영' && L.st !== '반영') || (m.upd || 0) > (L.upd || 0)){ M.memos[i] = m; changed = true; } }
    } else old.push(m);
  });
  OLD = old;
  if (changed) saveM(); else { updateCount(); syncSoon(); }
  if (!$('#mpanel').hidden) renderPanel();
}
function syncSoon(){ if (!DB) return; clearTimeout(syncT); syncT = setTimeout(syncNow, 800); }
async function syncNow(){
  if (!DB || syncing) return; syncing = true;
  try {
    for (const m of M.memos){ const js = JSON.stringify(m); if (synced[m.mid] !== js){ await DB.collection('memos').doc(m.mid).set(JSON.parse(js)); synced[m.mid] = js; } }
    for (const id of M.del.slice()){ try { await DB.collection('memos').doc(id).delete(); } catch(e){} delete synced[id]; M.del = M.del.filter(x => x !== id); }
    persist();
  } catch(e){ /* 쓰기 권한이 없으면 이 브라우저에만 남김 */ }
  syncing = false;
}

function goMemo(m){
  const co = normCo(m.co), v = VIEW_KEY[normView(m.view)] || 'o';
  if (!SLUGS.includes(co)) return;
  if (m.anchor && (co !== cur || v !== view || document.getElementById(m.anchor))){ if (co !== cur || v !== view){ cur = co; view = v; render(); } if (document.getElementById(m.anchor)) return goTo(co, v, m.anchor, ''); }
  if (co !== cur || v !== view){ cur = co; view = v; render(); }
  const s = secEl(m.sec); if (s) goTo(co, v, s.id || (s.closest('[id]') || {}).id || '', ''); else { window.scrollTo(0, 0); toast('그 줄을 찾지 못해 회사 화면을 엶'); }
}

/* ---------- 알림 ---------- */
let toastT = 0;
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

/* ---------- 클릭 ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const tg = t.closest('[data-tg]'); if (tg){ if (tipFor === tg && !TIP.hidden) closeTip(); else showRefTip(tg); return; }
  const term = t.closest('.term');
  if (term){ if (lastPtr !== 'mouse' && tipFor === term && !TIP.hidden) closeTip(); else showTip(term); return; }
  if (!t.closest('#tip')) closeTip();
  const co = t.closest('[data-co]'); if (co){ show(co.dataset.co, view); return; }
  const rw = t.closest('[data-raw]'); if (rw){ show(rw.dataset.raw, 'r'); return; }
  const vw = t.closest('[data-view]'); if (vw){ show(cur, vw.dataset.view); return; }
  const si = t.closest('[data-si]'); if (si){ const x = SRES[+si.dataset.si]; $('#sres').hidden = true; if (x && x.v === 'a'){ openPanel(x.id, $('#q').value.trim()); return; } if (x) goTo(x.co, x.v, x.id, $('#q').value.trim().split(/\s+/).length > 1 && !x.l.includes($('#q').value.trim().toLowerCase()) ? $('#q').value.trim().split(/\s+/)[0] : $('#q').value.trim()); return; }
  if (!t.closest('.search')) $('#sres').hidden = true;
  const gf = t.closest('[data-find]'); if (gf){ e.preventDefault(); const frag = gf.dataset.find, home = gf.closest('section, .orow, .cbox'); const el = Array.from(MAIN.querySelectorAll('.ln[id]')).find(x => !(home && home.contains(x)) && x.textContent.includes(frag)); if (el) goTo(cur, view, el.id, ''); else toast('관련 부분을 찾지 못함'); return; }
  const go = t.closest('[data-go]'); if (go){ e.preventDefault(); const p = lidView(go.dataset.go); goTo(p.co, p.v, go.dataset.go, ''); return; }
  const ab = t.closest('[data-amid]'); if (ab){ e.preventDefault(); openPanel(ab.dataset.amid); return; }
  const qt = t.closest('[data-qtog]'); if (qt){ const g = qt.closest('.qg'); setQg(g, !g.classList.contains('open')); return; }
  const mb = t.closest('[data-mb]'); if (mb){ openMemo(ctxFrom(mb)); return; }
  const mo = t.closest('[data-more]'); if (mo){ const q2 = mo.previousElementSibling; if (q2){ q2.hidden = !q2.hidden; mo.textContent = q2.hidden ? '더 보기' : '줄이기'; } return; }
  const act = t.closest('[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a === 'togglesrc'){ const r = $('.raw', MAIN); if (r){ const off = r.classList.toggle('nosrc'); act.textContent = off ? '원문 모두 펼치기' : '원문 모두 접기'; } }
    if (a === 'qaall'){ const gs = $$('.qg', act.closest('.layer') || MAIN).filter(g => g.querySelector('.qas')); const on = gs.some(g => !g.classList.contains('open')); gs.forEach(g => setQg(g, on)); act.textContent = on ? '질문 모두 접기' : '질문 모두 펼치기'; }
    if (a === 'openall') $$('details.sec', MAIN).forEach(d => d.open = true);
    if (a === 'closeall') $$('details.sec', MAIN).forEach(d => d.open = false);
    if (a === 'cancel') closeDlg();
    if (a === 'closepanel') closePanel();
    if (a === 'send') sendAll();
    if (a === 'sent'){ const b = $('#sendbox'); if (b && b._done) b._done(); }
    return;
  }
  if (t.id === 'memoBtn' || t.closest('#memoBtn')){ openPanel(); return; }
  const del = t.closest('[data-mdel]');
  if (del){
    if (!del.classList.contains('armed')){ del.classList.add('armed'); del.textContent = '정말 지우기'; return; }
    const id = del.dataset.mdel; M.memos = M.memos.filter(m => m.mid !== id); if (!M.del.includes(id)) M.del.push(id); saveM(); toast('메모를 지움'); return;
  }
  const of = t.closest('[data-oldfind]');
  if (of){ const m = OLD[+of.dataset.oldfind]; if (m){ closePanel(); $('#q').value = trunc(String(m.quote || m.line).replace(/\s+/g, ' ').trim(), 30).replace(/…$/, ''); runSearch(); $('#q').focus(); } return; }
  const mi = t.closest('[data-mgo]') || (t.closest('.mi[data-mid]') && !t.closest('button') ? t.closest('.mi[data-mid]') : null);
  if (mi){ const id = mi.dataset.mgo || mi.dataset.mid; const m = allMemos().find(x => x.mid === id); if (m){ closePanel(); goMemo(m); } return; }
  if (t === $('#dlg')) closeDlg();
  if (t === $('#mpanel')) closePanel();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (!$('#dlg').hidden) closeDlg(); else if (!$('#mpanel').hidden) closePanel(); closeTip(); hideSel(); }
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && $('#dlg').hidden){ e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Enter' && document.activeElement.classList.contains('mi')) document.activeElement.click();
});

/* ---------- 시작 ---------- */
function fitHdr(){ const h = $('#top').offsetHeight; document.documentElement.style.setProperty('--toph', h + 'px'); document.documentElement.style.setProperty('--hdr', (h + 56) + 'px'); }
window.addEventListener('resize', fitHdr);
function fromHash(){
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (!h) return false;
  let m = h.match(/^([a-z]+)(-raw)?$/);
  if (m && SLUGS.includes(m[1])){ cur = m[1]; view = m[2] ? 'r' : 'o'; render(); return true; }
  const p = lidView(h);
  if (SLUGS.includes(p.co)){ cur = p.co; view = p.v; render(); setTimeout(() => goTo(p.co, p.v, h, ''), 60); return true; }
  return false;
}

/* ---------- 표 너비 조절(엑셀처럼 머리 칸 오른쪽 끝을 끌기, 두 번 누르면 되돌림) ---------- */
const RZK = 'kdx-v5-colw';
let RZ = {}; try { RZ = JSON.parse(localStorage.getItem(RZK) || '{}') || {}; } catch(e){ RZ = {}; }
function tblKey(tb){ if (tb.id) return tb.id; const r = tb.querySelector('tr.ln[id]'); if (r) return 't:' + r.id; return 'h:' + cur + ':' + $$('th', tb).map(x => x.textContent).join('|').slice(0, 120); }
function rzSave(){ try { localStorage.setItem(RZK, JSON.stringify(RZ)); } catch(e){} }
function freezeTbl(tb){
  if (tb.classList.contains('rz')) return;
  const ths = $$('thead th', tb);
  const ws = ths.map(th => th.getBoundingClientRect().width);
  ths.forEach((th, i) => { th.style.width = ws[i] + 'px'; });
  tb.style.width = ws.reduce((a, b) => a + b, 0) + 'px';
  tb.classList.add('rz');
}
function addResizers(root){
  $$('table.tbl, table.fw-tb', root).forEach(tb => {
    const ths = $$('thead th', tb);
    ths.forEach(th => { if (th.classList.contains('mc') || th.querySelector('.rzh')) return; const h = document.createElement('span'); h.className = 'rzh'; h.title = '끌어서 너비 조절, 두 번 누르면 되돌림'; th.appendChild(h); });
    const ws = RZ[tblKey(tb)];
    if (ws && ws.length === ths.length){ ths.forEach((th, i) => { th.style.width = ws[i] + 'px'; }); tb.style.width = ws.reduce((a, b) => a + b, 0) + 'px'; tb.classList.add('rz'); }
  });
}
let rzD = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.rzh'); if (!h) return;
  e.preventDefault(); e.stopPropagation();
  const th = h.parentElement, tb = th.closest('table');
  freezeTbl(tb);
  rzD = {th, tb, x: e.clientX, w: parseFloat(th.style.width), tw: parseFloat(tb.style.width)};
  try { h.setPointerCapture(e.pointerId); } catch(err){}
  document.body.classList.add('rzing');
}, true);
document.addEventListener('pointermove', e => {
  if (!rzD) return;
  const w = Math.max(48, rzD.w + e.clientX - rzD.x);
  rzD.th.style.width = w + 'px'; rzD.tb.style.width = (rzD.tw + w - rzD.w) + 'px';
});
document.addEventListener('pointerup', () => {
  if (!rzD) return;
  const tb = rzD.tb; rzD = null; document.body.classList.remove('rzing');
  RZ[tblKey(tb)] = $$('thead th', tb).map(th => Math.round(parseFloat(th.style.width) || th.getBoundingClientRect().width));
  rzSave();
});
document.addEventListener('dblclick', e => {
  const h = e.target.closest && e.target.closest('.rzh'); if (!h) return;
  const tb = h.closest('table'); tb.classList.remove('rz'); tb.style.width = ''; $$('thead th', tb).forEach(th => { th.style.width = ''; });
  delete RZ[tblKey(tb)]; rzSave();
});

/* ---------- 화면에서 고치기: 줄 id(표는 행 id|칸 번호)마다 고친 글 또는 지움을 저장 ---------- */
const EKEY = 'kdx-v5-edits';
let ED = {}; try { ED = JSON.parse(localStorage.getItem(EKEY) || '{}') || {}; } catch(e){ ED = {}; }
let editing = false, EK = null, RAW = null, RAWco = null;
const OH = {};
function edPersist(){ try { localStorage.setItem(EKEY, JSON.stringify(ED)); } catch(e){} }
function edDocId(k){ return 'e_' + k.replace(/[^A-Za-z0-9_-]/g, c => '_' + c.charCodeAt(0).toString(16)); }
function edCount(){ const n = Object.keys(ED).length; $('#ecount').textContent = n || ''; $('#ecount2').textContent = n; }
function rawIdx(){
  if (RAW && RAWco === cur) return RAW;
  RAW = {}; RAWco = cur;
  const seen = new Set();
  const walk = o => {
    if (!o || typeof o !== 'object' || seen.has(o)) return; seen.add(o);
    if (Array.isArray(o)){ o.forEach(walk); return; }
    if (typeof o.id === 'string'){ if (typeof o.t === 'string' && !(o.id in RAW)) RAW[o.id] = o.t; else if (Array.isArray(o.c)) RAW[o.id] = o.c; }
    for (const k in o) if (o[k] && typeof o[k] === 'object') walk(o[k]);
  };
  walk(D.C[cur]);
  return RAW;
}
function edTarget(k){
  const i = k.indexOf('|');
  if (i < 0){ const el = document.getElementById(k); return {el, cell: null}; }
  const tr = document.getElementById(k.slice(0, i));
  return {el: tr, cell: tr && tr.cells ? tr.cells[+k.slice(i + 1)] : null};
}
function edBox(el){ return el.classList.contains('oi') && el.parentElement && el.parentElement.tagName === 'LI' ? el.parentElement : el; }
function edSlot(el, cell){
  if (cell){ let cv = cell.querySelector('.cv'); if (!cv){ cell.classList.remove('e'); cv = document.createElement('div'); cv.className = 'cv'; cell.appendChild(cv); } return cv; }
  return el.querySelector('.tx') || el.querySelector('pre') || el;
}
function applyOne(k){
  const e = ED[k]; const {el, cell} = edTarget(k); if (!el || !e) return;
  if (cell){ const cv = edSlot(el, cell); if (!(k in OH)) OH[k] = cv.innerHTML; cv.innerHTML = e.del ? '' : inl(e.t); cell.classList.add('eded'); return; }
  if (e.del){ edBox(el).classList.add('edel'); return; }
  const tx = edSlot(el, null); if (!(k in OH)) OH[k] = tx.innerHTML;
  if (tx.tagName === 'PRE') tx.textContent = e.t; else tx.innerHTML = inl(e.t);
  el.classList.add('eded');
}
function applyEdits(){ for (const k in ED) if (ED[k].co === cur) applyOne(k); }
function unapply(k){
  const {el, cell} = edTarget(k); if (!el) return;
  if (cell){ if (k in OH) edSlot(el, cell).innerHTML = OH[k]; cell.classList.remove('eded'); return; }
  edBox(el).classList.remove('edel'); el.classList.remove('eded');
  if (k in OH){ const tx = edSlot(el, null); tx.innerHTML = OH[k]; }
}
function setEditing(on){
  editing = on; document.body.classList.toggle('editing', on);
  $('#edBtn').setAttribute('aria-pressed', String(on)); $('#edbar').hidden = !on;
  if (on) toast('줄이나 표 칸을 누르면 고칠 수 있음');
}
function openEditor(k){
  const {el, cell} = edTarget(k); if (!el) return;
  const ri = rawIdx(), i = k.indexOf('|');
  let base = i >= 0 ? (Array.isArray(ri[k.slice(0, i)]) ? String(ri[k.slice(0, i)][+k.slice(i + 1)] || '') : '') : (typeof ri[k] === 'string' ? ri[k] : '');
  if (!base){ const src = cell ? cell : (el.querySelector('.tx') || el.querySelector('pre') || el); base = (k in OH ? (() => { const d = document.createElement('div'); d.innerHTML = OH[k]; return d.innerText; })() : src.innerText || '').trim(); }
  const e = ED[k];
  EK = {k, base};
  $('#etext').value = e && !e.del ? e.t : base;
  const sec = el.closest('[data-sec]');
  $('#eloc').textContent = (D.C[cur].name || cur) + (sec ? ' > ' + sec.dataset.sec : '') + (cell ? ' > 표 칸' : '');
  $('[data-eact="del"]').textContent = cell ? '칸 비우기' : '줄 지우기';
  $('[data-eact="delrow"]').hidden = !cell;
  $('[data-eact="reset"]').hidden = !e;
  $('#edlg').hidden = false; $('#etext').focus();
}
function closeEditor(){ $('#edlg').hidden = true; EK = null; }
async function edPut(k, rec){
  if (rec) ED[k] = rec; else delete ED[k];
  edPersist(); edCount();
  const d = await CAP('db');
  if (!d){ toast(rec ? '이 브라우저에만 저장함' : '원래대로 되돌림'); return; }
  try {
    if (rec) await d.collection('edits').doc(edDocId(k)).set(rec);
    else await d.collection('edits').doc(edDocId(k)).delete();
    toast(rec ? '저장함(이 페이지를 여는 사람 모두에게 보임)' : '원래대로 되돌림');
  } catch(err){ toast('공유 저장이 안 돼 이 브라우저에만 남김'); }
}
function edRec(k, t, del){ return {v: 1, k, co: cur, t: t || '', del: !!del, orig: EK && EK.k === k ? EK.base : '', at: Date.now()}; }
$('#eform').addEventListener('submit', e => {
  e.preventDefault(); if (!EK) return;
  const k = EK.k, t = $('#etext').value.trim();
  if (t === EK.base.trim()){ if (ED[k]){ unapply(k); edPut(k, null); } closeEditor(); return; }
  const rec = edRec(k, t, !t); closeEditor(); unapply(k); ED[k] = rec; applyOne(k); edPut(k, rec);
});
$('#edlg').addEventListener('click', e => {
  const b = e.target.closest('[data-eact]'); if (!b){ if (e.target === $('#edlg')) closeEditor(); return; }
  if (!EK) return; const k = EK.k, a = b.dataset.eact;
  if (a === 'cancel'){ closeEditor(); return; }
  if (a === 'reset'){ closeEditor(); unapply(k); edPut(k, null); return; }
  if (a === 'del'){ const rec = edRec(k, '', true); closeEditor(); ED[k] = rec; applyOne(k); edPut(k, rec); return; }
  if (a === 'delrow'){ const rk = k.slice(0, k.indexOf('|')); EK = {k: rk, base: ''}; const rec = edRec(rk, '', true); closeEditor(); ED[rk] = rec; applyOne(rk); edPut(rk, rec); return; }
});
$('#edBtn').addEventListener('click', () => setEditing(!editing));
$('#edbar').addEventListener('click', async e => {
  const b = e.target.closest('[data-eact]'); if (!b) return;
  if (b.dataset.eact === 'off'){ setEditing(false); return; }
  if (b.dataset.eact === 'dl'){
    const dl = await CAP('downloads'); if (!dl){ toast('이 화면에서는 내려받기를 쓸 수 없음'); return; }
    const rows = [['회사', '줄 id', '처음 글', '고친 글', '지움', '시각']].concat(Object.values(ED).sort((a, b) => a.at - b.at).map(x => [x.co, x.k, x.orig || '', x.del ? '' : x.t, x.del ? '예' : '', new Date(x.at).toISOString()]));
    const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    try { await dl.save({filename: 'kdx_고친곳.csv', data: new Blob([csv], {type: 'text/csv'})}); } catch(err){ if (err && err.code !== 'declined') toast('내려받기가 안 됨'); }
  }
});
document.addEventListener('click', e => {
  if (!editing) return;
  const t = e.target;
  if (!MAIN.contains(t) || t.closest('button, summary, a, input, textarea, select, .rzh, [data-tg], [data-mb]')) return;
  let k = null;
  const td = t.closest('tr.ln[id] > td');
  if (td){ if (!td.classList.contains('mc')) k = td.parentElement.id + '|' + td.cellIndex; }
  else { const ln = t.closest('.ln[id]'); if (ln) k = ln.id; }
  if (!k) return;
  e.preventDefault(); e.stopPropagation();
  openEditor(k);
}, true);
CAP('db').then(async d => {
  if (!d) return;
  try {
    const snap = await d.collection('edits').get(); let ch = false;
    snap.docs.forEach(doc => { const r = doc.data(); if (!r || !r.k || !r.co) return; const L = ED[r.k]; if (!L || (r.at || 0) > (L.at || 0)){ ED[r.k] = JSON.parse(JSON.stringify(r)); ch = true; } });
    if (ch){ edPersist(); render(); }
    edCount();
  } catch(e){}
});
edCount();
window.addEventListener('hashchange', fromHash);
updateCount();
if (!fromHash()){
  try { const s = JSON.parse(localStorage.getItem('kdx-v5-view') || 'null'); if (s && SLUGS.includes(s.cur)){ cur = s.cur; view = s.view === 'r' ? 'r' : 'o'; } } catch(e){}
  render();
}
fitHdr();
})();
</script>
