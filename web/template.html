<title>KDX 해외 사례</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 왼쪽 회사 목록, 오른쪽 본문 한 단. 줄 번호는 왼쪽 여백의 작은 고정폭 글씨 */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212d; --muted:#5d6878; --faint:#8a94a3;
  --line:#dde2e9; --accent:#22509e; --accent-soft:#e6edf8; --orange:#b85a00; --orange-soft:#fbeedf;
  --ok:#2b7a4b; --ok-soft:#e3f2e8; --warn:#9b2c2c; --quote:#f7f8fb; --hl:#fff6c9;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141a; --panel:#171c24; --ink:#e4e9f0; --muted:#a0abba; --faint:#76808f;
  --line:#2a313c; --accent:#86aef5; --accent-soft:#1d2a40; --orange:#ffa04d; --orange-soft:#3a2614;
  --ok:#6fcf97; --ok-soft:#173226; --warn:#ff8a8a; --quote:#1b212b; --hl:#4a4113; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141a; --panel:#171c24; --ink:#e4e9f0; --muted:#a0abba; --faint:#76808f;
  --line:#2a313c; --accent:#86aef5; --accent-soft:#1d2a40; --orange:#ffa04d; --orange-soft:#3a2614;
  --ok:#6fcf97; --ok-soft:#173226; --warn:#ff8a8a; --quote:#1b212b; --hl:#4a4113; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-weight:800;letter-spacing:-.01em;font-size:16px;margin-right:6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 12px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
.spacer{flex:1}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer}
.tbtn:hover{border-color:var(--accent)}
.unsent{display:inline-flex;align-items:center;gap:6px;font-weight:700;border-color:var(--orange);color:var(--orange)}
.unsent b{background:var(--orange);color:var(--panel);border-radius:10px;padding:0 8px;font-size:13px}
.unsent.zero{border-color:var(--line);color:var(--muted)} .unsent.zero b{background:var(--faint)}

.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;min-height:calc(100% - 52px)}
nav.side{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px 40px max(10px,env(safe-area-inset-left,0px));
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);align-self:start;max-height:calc(100vh - 52px);overflow:auto}
.navh{font-size:12px;color:var(--faint);letter-spacing:.06em;margin:14px 8px 6px}
.navh:first-child{margin-top:0}
.co{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px;cursor:pointer}
.co:hover{background:var(--accent-soft)}
.co[aria-current="true"]{background:var(--accent-soft);font-weight:700;color:var(--accent)}
.co img{width:24px;height:24px;object-fit:contain;border-radius:5px;background:#fff;border:1px solid var(--line)}
.co .cnt{margin-left:auto;font-size:12px;color:var(--orange);font-weight:700}

main{min-width:0;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:900px;margin:0 auto}
.head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.head img{height:52px;max-width:180px;object-fit:contain;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line)}
.head h1{margin:0;font-size:28px;letter-spacing:-.02em;text-wrap:balance}
.head .kind{color:var(--muted);font-size:13px}

.claims{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:22px}
.claims h2{font-size:13px;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
.claims ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.claims button{border:0;background:transparent;text-align:left;padding:3px 0;cursor:pointer;display:grid;grid-template-columns:7.5em 1fr;gap:10px;width:100%}
.claims button:hover .ct{text-decoration:underline}
.claims .cs{color:var(--accent);font-weight:700;font-size:13px}

details.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
details.sec>summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:800;font-size:17px;display:flex;gap:10px;align-items:baseline}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▾";color:var(--faint);font-size:13px;width:12px}
details.sec:not([open])>summary::before{content:"▸"}
details.sec>summary .code{font-family:var(--mono);color:var(--accent);font-size:14px}
.rows{padding:0 10px 10px}

.row{display:grid;grid-template-columns:7.2em minmax(0,1fr);gap:8px;padding:3px 6px;border-radius:6px;position:relative}
.row:hover,.row:focus-within,.row.tools-on{background:var(--quote)}
.num{align-self:start;font-family:var(--mono);font-size:11.5px;color:var(--faint);padding-top:4px;text-align:right;cursor:pointer;border:0;background:transparent;white-space:nowrap}
.num:hover{color:var(--accent)}
.body{min-width:0}
.txt{cursor:pointer}
.lv-b .body{font-weight:700}
.lv-s .body{padding-left:1.6em}
.lv-q1 .body,.lv-q2 .body,.lv-q3 .body{padding-left:3.2em}
.lv-img .body{padding-left:1.6em}
.mk{display:inline-block;width:1.3em;color:var(--faint);font-weight:400}
.lv-b .mk{color:var(--ink)}
.lbl{font-weight:700}
.lv-s .lbl{color:var(--muted)}
.claim .body{color:var(--accent)}
.row.orange .txt{color:var(--orange)}
.row.del .txt{text-decoration:line-through;opacity:.5}
.row.hidden{display:none}
.grp{background:transparent;border:0;cursor:pointer;color:var(--faint);padding:0 4px;font-size:11px}
.src{font-size:11.5px;margin-left:6px;white-space:nowrap}
.src a{text-decoration:none;border-bottom:1px solid currentColor}
.src .more{border:0;background:transparent;color:var(--accent);font-size:11px;cursor:pointer;padding:0 2px}
.chip{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.ed{background:var(--accent-soft);color:var(--accent)}
.chip.new{background:var(--orange-soft);color:var(--orange)}
.lv-q1 .txt{font-style:italic}
.qbox{background:var(--quote);border-left:3px solid var(--line)}
.term{border-bottom:1px dotted var(--accent);cursor:help}
.ev{margin:6px 0 6px 1.6em;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:400;font-size:13.5px}
.ev p{margin:0 0 4px}
.ev .q{color:var(--muted)}
.ev .q::before{content:"“"} .ev .q::after{content:"”"}
.ev .e{color:var(--ink);margin-top:2px}
.ev+.ev{margin-top:4px}
.ev .item+.item{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
figure{margin:6px 0;display:inline-block;max-width:100%;vertical-align:top}
figure img{max-width:100%;max-height:560px;border:1px solid var(--line);border-radius:6px;display:block;cursor:zoom-in;background:#fff}
figure figcaption{font-size:12px;color:var(--muted)}
.figs{display:flex;flex-wrap:wrap;gap:10px}
.figs figure{flex:1 1 240px;max-width:min(100%,420px)}
.figs.one figure{max-width:100%;flex-basis:100%}

.tools{grid-column:2;display:none;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.row.tools-on .tools{display:flex}
.tools button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:1px 8px;font-size:12.5px;cursor:pointer}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.form{grid-column:2;margin:6px 0;padding:10px;border:1px solid var(--accent);border-radius:8px;background:var(--panel);display:grid;gap:8px}
.form textarea{width:100%;min-height:70px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--bg);color:var(--ink)}
.form .types{display:flex;flex-wrap:wrap;gap:6px}
.form .types label{border:1px solid var(--line);border-radius:5px;padding:1px 8px;font-size:13px;cursor:pointer}
.form .types input{margin-right:4px}
.form .acts{display:flex;gap:6px;flex-wrap:wrap}
.pri{background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:4px 12px;cursor:pointer;font-weight:700}
.sec2{background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer}
.notes{grid-column:2;display:grid;gap:4px;margin:4px 0}
.note{font-size:13px;border-radius:6px;padding:6px 10px;background:var(--orange-soft)}
.note.ans{background:var(--accent-soft)}
.note.agree{background:var(--ok-soft)}
.note .who{font-weight:700;margin-right:6px}
.note .chg{display:block;margin-top:3px}
.note .before{text-decoration:line-through;opacity:.7}
.note .acts{margin-top:4px;display:flex;gap:6px}
.note .acts button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:0 8px;font-size:12.5px;cursor:pointer}

.memo-page{max-width:900px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:2px 12px;cursor:pointer;font-size:13px}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.mlist{display:grid;gap:8px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.mcard .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);align-items:center}
.mcard .meta .go{font-family:var(--mono);color:var(--accent);border:0;background:transparent;cursor:pointer;padding:0}
.st{border-radius:4px;padding:0 6px;font-weight:700;font-size:12px}
.st-안보냄{background:var(--orange-soft);color:var(--orange)}
.st-보냄{background:var(--accent-soft);color:var(--accent)}
.st-답함{background:var(--accent-soft);color:var(--accent)}
.st-합의{background:var(--ok-soft);color:var(--ok)}
.st-보류{background:var(--quote);color:var(--muted)}
.mcard .line{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px}

.modal{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;
  padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal .box{background:var(--panel);border-radius:12px;max-width:860px;width:100%;padding:16px;display:grid;gap:10px}
.modal h3{margin:0}
.modal textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg);color:var(--ink)}
.modal .acts{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:8px;z-index:60;font-size:14px}
.pop{position:absolute;z-index:40;max-width:340px;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.pop b{display:block;margin-bottom:2px}
.pop .en{color:var(--muted);font-size:12px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;overflow:auto}
.zoom img{max-width:100%;max-height:100%;background:#fff}

@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .navh{display:none}
  .co{width:auto;flex:0 0 auto}
  .row{grid-template-columns:minmax(0,1fr)}
  .num{text-align:left;padding:0}
  .tools,.form,.notes{grid-column:1}
  .lv-s .body{padding-left:.9em} .lv-q1 .body,.lv-q2 .body,.lv-q3 .body{padding-left:1.8em}
  .claims button{grid-template-columns:1fr;gap:0}
}

.wide{max-width:1180px;margin:0 auto}
.wide h1{margin:0 0 4px;font-size:24px}
.wide h2{font-size:18px;margin:26px 0 8px}
.lead{margin:0 0 10px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--quote);font-weight:700;color:var(--muted);white-space:nowrap;position:sticky;top:0}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl tr.orange td{color:var(--orange)}
.golink{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:0;text-align:left}
.golink:hover{text-decoration:underline}
.bar{display:flex;align-items:center;gap:8px}
.bar .track{flex:1;height:10px;background:var(--quote);border-radius:5px;min-width:60px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar.orange .fill{background:var(--orange)}
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .ev2{position:relative;padding:6px 0}
.tl .ev2::before{content:"";position:absolute;left:-22px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl .d{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.vc{display:grid;grid-template-columns:120px repeat(5,minmax(0,1fr));gap:6px;align-items:stretch;font-size:12.5px}
.vc .h{font-weight:700;color:var(--muted);text-align:center;padding:4px}
.vc .co2{font-weight:700;padding:6px 4px;display:flex;align-items:center}
.vc .cell{border-radius:6px;padding:6px;display:grid;gap:4px;align-content:start;background:var(--quote);min-height:44px}
.vc .it{border-radius:5px;padding:3px 6px;line-height:1.35;cursor:pointer}
.vc .it.own{background:var(--accent);color:var(--panel)}
.vc .it.ent{background:transparent;border:1.5px dashed var(--muted);color:var(--ink)}
.vc .it .acq{display:block;font-size:11.5px;font-weight:700;opacity:.9}
.vc .none{color:var(--faint);text-align:center;padding-top:8px}
.vc .orange.co2{color:var(--orange)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:6px 0 10px;align-items:center}
.legend i{display:inline-block;width:22px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.legend .own{background:var(--accent)} .legend .ent{border:1.5px dashed var(--muted)}
.search{width:100%;max-width:420px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:2px 12px;cursor:pointer;font-size:13px}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.detail{font-size:13px;color:var(--muted);margin-top:4px}
.gl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.gl .g{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gl .g b{display:block}
.gl .g .en{font-size:12px;color:var(--muted)}
.lawl a{display:block;font-size:12.5px}
@media (max-width:760px){.vc{grid-template-columns:repeat(5,minmax(110px,1fr))}.vc .co2{grid-column:1/-1}.vc .h.first{display:none}}

/* 메모: 줄 왼쪽 단추, 달린 메모는 왼쪽 여백 카드로 뻗어 나옴 */
.numc{display:flex;justify-content:flex-end;align-items:flex-start;gap:2px;align-self:start}
.addm{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:3px 3px 0;opacity:.35;border-radius:4px;line-height:0}
.row:hover .addm,.row:focus-within .addm,.addm:focus-visible{opacity:1}
.addm:hover{color:var(--accent);background:var(--accent-soft)}
@media (hover:none){.addm{opacity:.6}}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
.hint svg{color:var(--accent);vertical-align:-2px}
.mbadge{border:0;border-radius:9px;background:var(--orange);color:var(--panel);font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;margin-top:2px;cursor:pointer}
.rail{display:none}
.row.has-notes{box-shadow:inset 3px 0 0 var(--orange)}
.rcard{font-size:12.5px;line-height:1.45;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:7px;padding:5px 8px;cursor:pointer;position:relative}
.rcard .rh{display:flex;gap:6px;align-items:center;justify-content:space-between}
.rcard .rt{font-weight:700;color:var(--orange)}
.rcard .rx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .ra{color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard.open .rx,.rcard.open .ra{display:block}
.rcard.open{z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.rcard .acts{display:flex;gap:6px;margin-top:5px}
.rcard .acts button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:0 8px;font-size:12px;cursor:pointer}
.rcard .before{text-decoration:line-through;opacity:.7}
.rcard.t-챌린지{border-left-color:var(--warn)} .rcard.t-챌린지 .rt{color:var(--warn)}
.rcard.t-딥다이브요청,.rcard.t-풀어쓰기요청{border-left-color:var(--accent)} .rcard.t-딥다이브요청 .rt,.rcard.t-풀어쓰기요청 .rt{color:var(--accent)}
.row:has(.rcard:hover),.row:has(.rcard:focus){background:var(--hl)}
@media (min-width:1320px){
  .page{max-width:1160px;padding-left:260px}
  .rail{display:grid;gap:4px;position:absolute;right:calc(100% + 30px);top:2px;width:215px;z-index:5}
  .rail::after{content:"";position:absolute;top:12px;left:100%;width:30px;border-top:1.5px solid var(--orange)}
  .mbadge{display:none}
  .row.has-notes .notes{display:none}
}

.cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.cells.th{font-weight:700;color:var(--muted);font-size:12.5px;border-bottom:2px solid var(--line)}
.cell{min-width:0}
.lchip{display:inline-block;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;font-size:11px;padding:0 6px;margin:2px 0 0 4px;cursor:pointer;font-family:var(--mono);white-space:nowrap}
.lchip:hover{background:var(--accent);color:var(--panel)}
.interp{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;background:var(--quote);color:var(--muted);border:1px dashed var(--muted);margin-right:2px;vertical-align:1px}
.row.flash{background:var(--hl)!important;transition:background .4s}
.lv-th .body,.lv-tr .body{padding-left:0}
@media (max-width:760px){.cells{grid-template-columns:minmax(0,1fr)}.cells.th{display:none}.cells .cell:first-child{font-weight:700}}

.colink{border:0;background:transparent;padding:0;font:inherit;color:inherit;border-bottom:1.5px solid var(--accent);cursor:pointer}
.colink:hover{color:var(--accent)}
details.sec.idcard{border:2px solid var(--accent);background:var(--panel)}
details.sec.idcard>summary{color:var(--accent)}
.flow{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:6px;vertical-align:middle}
.fbox{border:1.5px solid var(--accent);border-radius:8px;padding:3px 10px;background:var(--accent-soft);font-weight:600;font-size:13.5px}
.farrow{color:var(--accent);font-weight:700}
.row.easy .txt{background:var(--hl);padding:1px 4px;border-radius:4px}
.row.easy .lbl{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top">
  <span class="brand">KDX 해외 사례</span>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-ov" role="tab" aria-selected="true">전체 그림</button>
    <button class="tab" id="tab-read" role="tab" aria-selected="false">본문</button>
    <button class="tab" id="tab-compare" role="tab" aria-selected="false" data-view="compare">가로 비교</button>
    <button class="tab" id="tab-lic" role="tab" aria-selected="false" data-view="lic">인가와 관계</button>
    <button class="tab" id="tab-rules" role="tab" aria-selected="false" data-view="rules">제도와 용어</button>
    <button class="tab" id="tab-memo" role="tab" aria-selected="false">메모</button>
  </div>
  <span class="spacer"></span>
  <button class="tbtn" id="btn-fold" type="button">모두 접기</button>
  <button class="tbtn unsent" id="btn-send" type="button">메모 보내기 <b id="unsent-n">0</b></button>
</header>
<div class="wrap">
  <nav class="side" id="nav" aria-label="회사 목록"></nav>
  <main id="main"></main>
</div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'kdx-review-v1';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = () => new Date().toISOString().slice(0,16).replace('T',' ');
const MEMO_TYPES = ['메모','챌린지','딥다이브 요청','풀어쓰기 요청'];

// ---------- 저장 ----------
let S;
function blank(){ return {memos:[], edits:{}, del:{}, conf:{}, orange:{}, added:{}, order:{}, agreed:{}, seq:1}; }
function load(){ try{ const t = localStorage.getItem(KEY); S = t ? Object.assign(blank(), JSON.parse(t)) : blank(); }catch(e){ S = blank(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} updateCount(); }
load();

// ---------- 데이터 색인 ----------
const CO = {}; const LINE = {};
D.companies.forEach(c => { CO[c.slug] = c; c.sections.forEach(sec => sec.rows.forEach(r => { r.co = c.slug; r.sec = sec.code; LINE[r.id] = r; })); });
const LOG_BY_LINE = {}; const LOG_BY_MEMO = {};
(D.log||[]).forEach((g,i) => { g._i = 'g'+i; (LOG_BY_LINE[g.line_id] = LOG_BY_LINE[g.line_id] || []).push(g); if (g.memo_id) LOG_BY_MEMO[g.memo_id] = g; });

// 용어
const TERM_KEYS = [];
D.terms.forEach((t,i) => t.k.forEach(k => TERM_KEYS.push([k,i])));
TERM_KEYS.sort((a,b) => b[0].length - a[0].length);
const TERM_RE = TERM_KEYS.length ? new RegExp(TERM_KEYS.map(k => k[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'), 'g') : null;
const TERM_IDX = Object.fromEntries(TERM_KEYS);
const CO_NAMES = [['Blue Ocean','blue-ocean'],['Robinhood','robinhood'],['Coinbase','coinbase'],['Binance','binance'],['Kraken','kraken'],['Dinari','dinari'],['Ondo','ondo'],['Bruce','bruce'],['MOON','moon']];
const CO_RE = new RegExp('\\b(' + CO_NAMES.map(x => x[0]).join('|') + ')\\b', 'g');
function withTerms(text){
  let h = esc(text);
  if (TERM_RE){ const seen = new Set();
    h = h.replace(TERM_RE, m => { if (seen.has(m)) return m; seen.add(m); return `<span class="term" tabindex="0" data-term="${TERM_IDX[m]}">${m}</span>`; }); }
  // 다른 회사 이름은 그 회사 본문으로 가는 링크(줄마다 처음 한 번, 지금 보는 회사 제외, 태그 밖에서만)
  const done = new Set();
  return h.split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part : part.replace(CO_RE, m => { const sl = (CO_NAMES.find(x => x[0] === m)||[])[1]; if (!sl || sl === cur || done.has(sl) || !CO[sl]) return m; done.add(sl); return `<button class="colink" type="button" data-goco="${sl}" title="${m} 본문으로">${m}</button>`; })).join('');
}

function memoStatus(m){
  if (S.agreed[m.mid]) return '합의';
  const g = LOG_BY_MEMO[m.mid];
  if (g) return g.status === '합의' ? '합의' : (g.status === '보류' ? '보류' : '답함');
  return m.st;
}
function unsent(){ return S.memos.filter(m => m.st === '안 보냄'); }
function updateCount(){
  const n = unsent().length; const b = $('#btn-send');
  $('#unsent-n').textContent = n; b.classList.toggle('zero', n === 0);
  document.querySelectorAll('.co').forEach(el => { const k = unsent().filter(m => m.co === el.dataset.slug).length; el.querySelector('.cnt').textContent = k ? k : ''; });
}
function lineText(r){ if (S.edits[r.id] != null) return S.edits[r.id]; return (r.label ? r.label + ' : ' : '') + (r.text||''); }
function addMemo(r, type, text, extra){
  const m = Object.assign({mid: 'm' + Date.now().toString(36) + (S.seq++), lid: r.id, co: r.co, disp: dispOf(r), type, text, st: '안 보냄', at: now(), line: lineText(r)}, extra||{});
  S.memos.push(m); save(); return m;
}
// 같은 줄에 아직 안 보낸 같은 종류의 자동 기록은 하나로 합친다
function autoMemo(r, type, text, extra){
  const old = S.memos.find(m => m.lid === r.id && m.type === type && m.st === '안 보냄');
  if (old){ Object.assign(old, {text, at: now(), line: lineText(r)}, extra||{}); save(); return old; }
  return addMemo(r, type, text, extra);
}

// ---------- 회사 줄 목록(사용자 추가, 순서 반영) ----------
function rowsOf(c, sec){
  let rows = sec.rows.slice();
  (S.added[c.slug]||[]).filter(a => a.sec === sec.code).forEach(a => {
    const r = Object.assign({level: a.level, text: a.text, label: null, src: [], added: true, co: c.slug, sec: sec.code, id: a.lid}, {});
    LINE[a.lid] = r;
    const at = rows.findIndex(x => x.id === a.after);
    rows.splice(at < 0 ? rows.length : at + 1, 0, r);
  });
  const ord = (S.order[c.slug]||{})[sec.code];
  if (ord){ const pos = Object.fromEntries(ord.map((id,i) => [id,i])); rows.sort((a,b) => (pos[a.id] ?? 1e9) - (pos[b.id] ?? 1e9)); }
  return rows;
}
const DISP = {};
function dispOf(r){ return DISP[r.id] || r.disp || r.id; }

// ---------- 그리기 ----------
let cur = null, view = 'read', allOpen = true;
const collapsedGroups = new Set();
const openEv = new Set(), openTools = new Set();
let openForm = null; // {lid, kind}

function renderNav(){
  const groups = [['overview','한눈에'],['company','회사 6곳'],['ats','미국 야간 ATS 3곳']];
  $('#nav').innerHTML = groups.map(([k,h]) => `<div class="navh">${h}</div>` + D.companies.filter(c => c.kind === k).map(c =>
    `<button class="co" type="button" data-slug="${c.slug}" aria-current="${c.slug===cur}">${c.logo?`<img alt="" src="${D.imgs[c.logo]}">`:''}<span>${esc(c.name)}</span><span class="cnt"></span></button>`).join('')).join('');
  updateCount();
}

function srcLinks(r){
  const urls = [...new Set((r.src||[]).map(s => s.url).filter(Boolean))];
  if (!urls.length) return '';
  const first = `<a href="${esc(urls[0])}" target="_blank" rel="noopener">출처</a>`;
  const more = urls.length > 1 ? ` <button class="more" type="button" data-ev="${r.id}" title="근거 모두 보기">+${urls.length-1}</button>` : '';
  return `<span class="src">${first}${more}</span>`;
}
function evHtml(r){
  if (!r.src || !r.src.length) return '<div class="ev"><p class="q" style="quotes:none">이 줄에 붙은 근거 문장이 없습니다.</p></div>';
  return '<div class="ev">' + r.src.map(s => `<div class="item">${s.q?`<p class="q">${esc(s.q)}</p>`:''}${s.e?`<p class="e">${esc(s.e)}</p>`:''}<p>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.t||s.url)}</a>`:esc(s.t)}</p></div>`).join('') + '</div>';
}
const MK = {b:'●', s:'★', q1:'①', q2:'②', q3:'③'};
const QLBL = {q1:'원문', q2:'번역', q3:'해석'};

function rowHtml(c, r, hasKids){
  const del = S.del[r.id], conf = S.conf[r.id], edited = S.edits[r.id] != null;
  const orange = S.orange[r.id] != null ? S.orange[r.id] : !!r.orange;
  const cls = ['row','lv-'+r.level]; if (r.claim) cls.push('claim'); if (orange) cls.push('orange'); if (del) cls.push('del'); if (openTools.has(r.id)) cls.push('tools-on');
  let body;
  const linkChips = (L) => (L||[]).map(l => `<button class="lchip" type="button" data-go="${esc(l.id)}" data-co="${esc(l.co)}" title="본문 줄로 이동">${esc(l.disp)}</button>`).join('');
  if (r.level === 'th' || r.level === 'tr'){
    const cells = r.cells || [];
    const ed = S.edits[r.id];
    body = ed != null ? `<span class="txt" data-ev="${r.id}">${withTerms(ed)}</span>` :
      `<div class="cells ${r.level}" style="--n:${cells.length}" data-ev="${r.id}">` + cells.map(cl => `<div class="cell">${r.level==='th'?esc(cl.t):withTerms(cl.t)}${linkChips(cl.links)}</div>`).join('') + '</div>';
    if (r.level === 'tr') body += srcLinks(r) + (conf?'<span class="chip ok">확정</span>':'') + (edited?'<span class="chip ed">고침</span>':'') + (openEv.has(r.id) ? evHtml(r) : '');
  } else if (r.level === 'img'){
    body = `<div class="figs${r.imgs.length===1?' one':''}">` + r.imgs.map(i => `<figure><img loading="lazy" alt="${esc(i.c)}" src="${D.imgs[i.k]}"><figcaption>${esc(i.c)}</figcaption></figure>`).join('') + '</div>';
  } else {
    let t;
    if (edited){ t = withTerms(S.edits[r.id]); }
    else if (r.label){ t = `<span class="lbl">${withTerms(r.label)}</span> : ${withTerms(r.text)}`; }
    else t = withTerms(r.text);
    const link = r.link ? ` <span class="src"><a href="${esc(r.link)}" target="_blank" rel="noopener">원문 링크</a></span>` : '';
    const grp = hasKids ? `<button class="grp" type="button" data-grp="${r.id}" aria-label="아래 줄 접기">${collapsedGroups.has(r.id)?'▸':'▾'}</button>` : '';
    if (r.interp && !edited) t = `<span class="interp">해석</span> ${withTerms(r.text)}`;
    if (r.label === '흐름' && !edited) t = `<span class="lbl">흐름</span><span class="flow">${(r.text||'').split(/\s*→\s*/).map((x,i,a) => `<span class="fbox">${withTerms(x)}</span>${i<a.length-1?'<span class="farrow" aria-hidden="true">→</span>':''}`).join('')}</span>`;
    if (r.label === '쉽게 말하면') cls.push('easy');
    body = `<span class="mk">${MK[r.level]||''}</span>${grp}<span class="txt" data-ev="${r.id}">${t}</span>${linkChips(r.links)}${link}${srcLinks(r)}` +
      (conf?'<span class="chip ok">확정</span>':'') + (edited?'<span class="chip ed">고침</span>':'') + (r.added?'<span class="chip new">추가</span>':'') +
      (del?' <button class="sec2" type="button" data-act="undel" data-lid="'+r.id+'" style="padding:0 8px;font-size:12px">되살리기</button>':'') +
      (openEv.has(r.id) ? evHtml(r) : '');
  }
  const tools = `<div class="tools">
    <button type="button" data-act="memo" data-lid="${r.id}">메모</button>
    ${r.level!=='img'?`<button type="button" data-act="edit" data-lid="${r.id}">고치기</button>`:''}
    <button type="button" data-act="add" data-lid="${r.id}">아래에 줄 추가</button>
    <button type="button" data-act="${del?'undel':'del'}" data-lid="${r.id}">${del?'되살리기':'삭제'}</button>
    <button type="button" data-act="up" data-lid="${r.id}">위로</button>
    <button type="button" data-act="down" data-lid="${r.id}">아래로</button>
    <button type="button" data-act="conf" data-lid="${r.id}">${conf?'확정 풀기':'확정'}</button>
    <button type="button" data-act="orange" data-lid="${r.id}">${orange?'주황 끄기':'주황 표시'}</button>
  </div>`;
  const nm = noteCount(r);
  return `<div class="${cls.join(' ')}${nm?' has-notes':''}" id="L-${r.id}" data-lid="${r.id}">${railHtml(r)}<div class="numc"><button class="addm" type="button" data-act="memo" data-lid="${r.id}" title="이 줄에 메모" aria-label="${esc(dispOf(r))}에 메모">${MEMO_ICON}</button><button class="num" type="button" data-tools="${r.id}" title="줄 도구 열기(고치기, 추가, 삭제, 순서, 확정, 주황)">${esc(dispOf(r))}</button>${nm?`<button class="mbadge" type="button" data-notes="${r.id}" title="달린 메모 보기">${nm}</button>`:''}</div><div class="body">${body}</div>${tools}${formHtml(r)}${openNotes.has(r.id)?notesHtml(r):''}</div>`;
}

function formHtml(r){
  if (!openForm || openForm.lid !== r.id) return '';
  if (openForm.kind === 'memo'){
    const sel = openForm.type || '메모';
    return `<form class="form" data-form="memo" data-lid="${r.id}">
      <div class="types">${MEMO_TYPES.map(t => `<label><input type="radio" name="mt-${r.id}" value="${t}" ${t===sel?'checked':''}>${t}</label>`).join('')}</div>
      <textarea id="f-memo-${r.id}" placeholder="이 줄에 대한 메모, 반론, 더 알아볼 것">${esc(openForm.text||'')}</textarea>
      <div class="acts"><button class="pri" type="submit">메모 남기기</button><button class="sec2" type="button" data-act="close">닫기</button></div></form>`;
  }
  if (openForm.kind === 'edit' || openForm.kind === 'add'){
    const v = openForm.kind === 'edit' ? lineText(r) : '';
    const lv = openForm.kind === 'add' ? `<div class="types">${[['b','● 대분류 줄'],['s','★ 세부 줄'],['q1','① 하위 줄']].map(([k,l]) => `<label><input type="radio" name="lv-${r.id}" value="${k}" ${k===(r.level==='img'?'s':r.level.startsWith('q')?'q1':r.level)?'checked':''}>${l}</label>`).join('')}</div>` : '';
    return `<form class="form" data-form="${openForm.kind}" data-lid="${r.id}">${lv}
      <textarea id="f-${openForm.kind}-${r.id}" placeholder="${openForm.kind==='add'?'새 줄 문구':''}">${esc(v)}</textarea>
      <div class="acts"><button class="pri" type="submit">${openForm.kind==='add'?'줄 추가':'고친 문구 저장'}</button>${openForm.kind==='edit'&&S.edits[r.id]!=null?'<button class="sec2" type="button" data-act="revert" data-lid="'+r.id+'">원래 문구로</button>':''}<button class="sec2" type="button" data-act="close">닫기</button></div></form>`;
  }
  return '';
}

const MEMO_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 5.2v3.6M6.2 7h3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const openNotes = new Set(), openCards = new Set();
function userMemos(r){ return S.memos.filter(m => m.lid === r.id && !['고침','추가','삭제','순서','확정','주황','합의'].includes(m.type)); }
function noteCount(r){ return userMemos(r).filter(m => !LOG_BY_MEMO[m.mid]).length + (LOG_BY_LINE[r.id]||[]).length; }
function railHtml(r){
  const cards = [];
  userMemos(r).forEach(m => { if (!LOG_BY_MEMO[m.mid]) cards.push({k: m.mid, type: m.type, text: m.text, st: memoStatus(m)}); });
  (LOG_BY_LINE[r.id]||[]).forEach(g => { const agreed = S.agreed[g.memo_id || g._i] || g.status === '합의'; cards.push({k: g.memo_id || g._i, type: g.type || '질문', text: g.question, st: agreed ? '합의' : (g.status || '답함'), ans: g.answer, g}); });
  if (!cards.length) return '';
  return '<div class="rail">' + cards.map(c => { const open = openCards.has(c.k); return `<div class="rcard t-${esc(c.type).replace(/ /g,'')}${open?' open':''}" data-card="${esc(c.k)}" tabindex="0" title="${esc(dispOf(r))} 줄의 메모"><div class="rh"><span class="rt">${esc(c.type)}</span><span class="st st-${c.st.replace(' ','')}">${esc(c.st)}</span></div><div class="rx">${esc(c.text)}</div>${c.ans?`<div class="ra"><b>답</b> ${esc(c.ans)}</div>`:''}${open && c.g ? ((c.g.changes||[]).map(x => `<div class="ra"><span class="before">${esc(x.before||'')}</span> → <b>${esc(x.after||'')}</b></div>`).join('') + (c.st==='합의'?'':`<div class="acts"><button type="button" data-act="agree" data-g="${c.g._i}" data-lid="${r.id}">합의</button><button type="button" data-act="rechal" data-lid="${r.id}">다시 챌린지</button></div>`)) : ''}</div>`; }).join('') + '</div>';
}
function notesHtml(r){
  const mine = S.memos.filter(m => m.lid === r.id && !['고침','추가','삭제','순서','확정','주황','합의'].includes(m.type));
  const logs = LOG_BY_LINE[r.id] || [];
  if (!mine.length && !logs.length) return '';
  let h = '<div class="notes">';
  mine.forEach(m => { if (!LOG_BY_MEMO[m.mid]) h += `<div class="note"><span class="who">${esc(m.type)}</span>${esc(m.text)} <span class="st st-${memoStatus(m).replace(' ','')}">${memoStatus(m)}</span></div>`; });
  logs.forEach(g => {
    const agreed = S.agreed[g.memo_id || g._i] || g.status === '합의';
    h += `<div class="note"><span class="who">질문</span>${esc(g.question)}</div>`;
    h += `<div class="note ans${agreed?' agree':''}"><span class="who">답</span>${esc(g.answer)}` +
      (g.changes||[]).map(x => `<span class="chg">${esc(x.where||'')}: <span class="before">${esc(x.before||'')}</span> → <b>${esc(x.after||'')}</b></span>`).join('') +
      (agreed ? '<div class="acts"><span class="st st-합의">합의</span></div>' : `<div class="acts"><button type="button" data-act="agree" data-g="${g._i}" data-lid="${r.id}">합의</button><button type="button" data-act="rechal" data-lid="${r.id}">다시 챌린지</button></div>`) + '</div>';
  });
  return h + '</div>';
}

function renderCompany(){
  const c = CO[cur]; if (!c) return;
  // 화면 번호 다시 매기기(추가, 순서 반영)
  c.sections.forEach(sec => { let n = 0; rowsOf(c, sec).forEach(r => { n++; DISP[r.id] = `${c.name} ${sec.code}-${n}`; }); });
  const claims = [];
  c.sections.forEach(sec => rowsOf(c, sec).forEach(r => { if (r.claim && !S.del[r.id]) claims.push([sec, r]); }));

  let claimsHtml = '';
  if (claims.length) claimsHtml = `<section class="claims"><h2>주장 한눈에 보기</h2><ol>${claims.map(([sec,r]) => `<li><button type="button" data-jump="${sec.code}"><span class="cs">${esc(secShort(sec))}</span><span class="ct">${esc(S.edits[r.id]!=null?S.edits[r.id].replace(/^주장\s*:\s*/,''):r.text)}</span></button></li>`).join('')}</ol></section>`;
  let cardHtml = '', restHtml = '';
  c.sections.forEach(sec => {
    const rows = rowsOf(c, sec);
    let inner = '', hideUnder = null, qbox = false;
    rows.forEach((r, i) => {
      const nxt = rows[i+1];
      const depth = l => l === 'b' ? 0 : (l === 's' || l === 'img' || l === 'th' || l === 'tr') ? 1 : 2;
      const hasKids = r.level !== 'img' && nxt && depth(nxt.level) > depth(r.level);
      let hidden = false;
      if (hideUnder){ if (depth(r.level) > hideUnder.d) hidden = true; else hideUnder = null; }
      let html = rowHtml(c, r, hasKids);
      if (hidden) html = html.replace('class="row ', 'class="row hidden ');
      inner += html;
      if (hasKids && collapsedGroups.has(r.id) && !hideUnder) hideUnder = {d: depth(r.level)};
    });
    const blk = `<details class="sec${sec.code==='카드'?' idcard':''}" id="S-${sec.code}" ${secOpen(sec)?'open':''}><summary><span class="code">${esc(sec.code)}</span>${esc(sec.title)}</summary><div class="rows">${inner}</div></details>`;
    if (sec.code === '카드') cardHtml += blk; else restHtml += blk;
  });
  h += cardHtml + claimsHtml + restHtml + '</div>';
  $('#main').innerHTML = h;
}

function doAct(a, lid, el){
  const r = LINE[lid];
  if (a === 'close'){ openForm = null; keepScroll(render); return; }
  if (!r && a !== 'agree') return;
  const c = r ? CO[r.co] : null;
  switch(a){
    case 'memo': openForm = {lid, kind:'memo'}; break;
    case 'rechal': openForm = {lid, kind:'memo', type:'챌린지'}; break;
    case 'edit': openForm = {lid, kind:'edit'}; break;
    case 'add': openForm = {lid, kind:'add'}; break;
    case 'revert': { const before = S.edits[lid]; delete S.edits[lid]; S.memos = S.memos.filter(m => !(m.lid===lid && m.type==='고침' && m.st==='안 보냄')); openForm = null; save(); toast('원래 문구로 돌렸습니다'); break; }
    case 'del': S.del[lid] = true; autoMemo(r, '삭제', '이 줄 삭제'); break;
    case 'undel': delete S.del[lid]; S.memos = S.memos.filter(m => !(m.lid===lid && m.type==='삭제' && m.st==='안 보냄')); save(); break;
    case 'conf': if (S.conf[lid]){ delete S.conf[lid]; S.memos = S.memos.filter(m => !(m.lid===lid && m.type==='확정' && m.st==='안 보냄')); save(); } else { S.conf[lid] = true; autoMemo(r, '확정', '이 문구로 확정'); } break;
    case 'orange': { const curO = S.orange[lid] != null ? S.orange[lid] : !!r.orange; S.orange[lid] = !curO; autoMemo(r, '주황', S.orange[lid] ? '주황 표시(추가 확인 필요)' : '주황 해제'); break; }
    case 'up': case 'down': {
      const sec = c.sections.find(s => s.code === r.sec); const ids = rowsOf(c, sec).map(x => x.id); const i = ids.indexOf(lid); const j = a === 'up' ? i-1 : i+1;
      if (j < 0 || j >= ids.length) return; [ids[i], ids[j]] = [ids[j], ids[i]];
      (S.order[c.slug] = S.order[c.slug] || {})[sec.code] = ids; save();
      renderCompany(); autoMemo(r, '순서', `${a==='up'?'위로':'아래로'} 옮김`, {order: ids.map(id => dispOf(LINE[id]) + ' ' + id)}); break;
    }
    case 'agree': {
      const g = (D.log||[]).find(x => x._i === el.dataset.g); if (!g) return;
      S.agreed[g.memo_id || g._i] = true; const rr = LINE[g.line_id] || r;
      if (rr) addMemo(rr, '합의', '답에 합의: ' + (g.answer||'').slice(0,80), {log_time: g.time});
      save(); toast('합의로 표시했습니다'); break;
    }
  }
  keepScroll(render);
}

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const lid = f.dataset.lid, r = LINE[lid], kind = f.dataset.form, val = f.querySelector('textarea').value.trim();
  if (kind === 'memo'){
    if (!val){ toast('메모 내용을 적어 주세요'); return; }
    const type = (f.querySelector('input[type=radio]:checked')||{}).value || '메모';
    addMemo(r, type, val); toast('메모를 남겼습니다');
  } else if (kind === 'edit'){
    const before = (r.label ? r.label + ' : ' : '') + (r.text||'');
    if (!val || val === before){ delete S.edits[lid]; } else { S.edits[lid] = val; autoMemo(r, '고침', `${before} → ${val}`, {before, after: val}); }
    save(); toast('고친 문구를 저장했습니다');
  } else if (kind === 'add'){

    save(); renderCompany();

});

let DL = null; try{ if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { DL = d; }, () => {}); }catch(e){}
async function saveJson(text, name){

  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }

function payload(list){

const NAME2SLUG = {}; D.companies.forEach(c => { NAME2SLUG[c.name.toLowerCase()] = c.slug; });
function slugOf(name){ const n = String(name||'').toLowerCase(); for (const k in NAME2SLUG){ if (n.startsWith(k) || n.includes(k)) return NAME2SLUG[k]; } return null; }
function coBtn(name){ const sl = slugOf(name); return sl ? `<button class="golink" type="button" data-goco="${sl}">${esc(name)}</button>` : esc(name); }
function srcCell(key, src){ if (!src || !src.length) return ''; const urls = [...new Set(src.map(s => s.url).filter(Boolean))];
  return `<span class="src">${urls.map((u,i) => `<a href="${esc(u)}" target="_blank" rel="noopener">${i? i+1 : '출처'}</a>`).join(' ')}</span> <button class="sec2" type="button" data-srcrow="${key}" style="padding:0 6px;font-size:11.5px">근거</button>${openSrc.has(key) ? evHtml({src}) : ''}`; }

function figsHtml(where){ const F = (D.figs||{})[where] || []; if (!F.length) return '';
  return '<div class="figs">' + F.map(f => `<figure><img loading="lazy" alt="${esc(f.c)}" src="${D.imgs[f.k]}"><figcaption>${esc(f.c)}</figcaption></figure>`).join('') + '</div>'; }
function renderCompare(){
  const R = D.rank.slice().sort((a,b) => a.rank - b.rank); const max = Math.max(...R.map(r => r.usd));
  let h = `<div class="wide"><h1>가로 비교</h1><p class="lead">회사 6곳과 미국 야간 ATS 3곳을 같은 칸으로 나란히 봅니다. 회사 이름을 누르면 본문으로 갑니다. 법적 성격은 SEC 직원 성명(2026-01-28)의 정의를 적용한 우리 분류입니다.</p>`;
  h += `<h2>제3자 비교표</h2><p class="lead">외부 보고서의 비교표와 구조 그림입니다. 발행처와 입장, 기준 시점을 그림 아래에 적었습니다. 칸 내용이 우리 확인 결과와 다르면 우리 쪽을 따릅니다.</p>` + figsHtml('compare');
  if ((D.cls||[]).length) h += `<h2>우리 분류와 다른 분류</h2><p class="lead">우리 분류는 상품 단위이고, SEC 직원 성명(2026-01-28)의 정의를 약관과 투자설명서에 적용한 것입니다.</p><div class="tbl"><table><thead><tr><th>자료</th><th>그 자료의 구분</th><th>우리 분류와 다른 점</th><th>출처</th></tr></thead><tbody>` +
    D.cls.map((r,i) => `<tr><td><b>${esc(r['자료'])}</b></td><td>${esc(r['그 자료의 구분'])}</td><td>${esc(r['우리 분류와 다른 점'])}</td><td>${srcCell('cl'+i, r.src)}</td></tr>`).join('') + '</tbody></table></div>';
  if ((D.check||[]).length){
    const CK = ['상장 여부와 시점','기업가치와 주요 주주','대표 상품 이름과 쉬운 뜻','최초와 최대 타이틀','큰 인수(금액)','큰 사고와 제재','고객 수','한국 접점','종목 수'];
    const cos = []; D.check.forEach(r => { if (!cos.includes(r['회사'])) cos.push(r['회사']); });
    h += `<h2>회사별 꼭 나와야 할 지점</h2><p class="lead">빈칸은 1차 자료로 확인하지 못한 곳입니다. 회사가 스스로 말한 것은 "(회사 주장)"을 붙였습니다. 칸을 누르면 출처가 나옵니다. Securitize, tZERO는 조사 대상 밖이라 주황입니다.</p><div class="tbl"><table><thead><tr><th>회사</th>${CK.map(k => `<th style="min-width:150px">${k}</th>`).join('')}</tr></thead><tbody>` +
      cos.map(co => `<tr class="${/Securitize|tZERO/.test(co)?'orange':''}"><td>${coBtn(co.replace('(Payward)','').replace(' ATS',''))}</td>${CK.map(k => { const i = D.check.findIndex(r => r['회사'] === co && r['칸'] === k); const r = D.check[i]; if (!r) return '<td></td>'; const nf = /못 찾음|단일 출처/.test(r['출처 성격']); return `<td data-srcrow="ck${i}" style="cursor:pointer">${nf ? '<span class="detail">자료 없음</span>' : esc(r['내용']) + (r['출처 성격'] === '회사 주장' ? ' <span class="detail">(회사 주장)</span>' : '')}${openSrc.has('ck'+i) ? evHtml(r) + (r['비고']?`<div class="detail">${esc(r['비고'])}</div>`:'') : ''}</td>`; }).join('')}</tr>`).join('') + '</tbody></table></div>';
  }
  if ((D.axis||[]).length){
    const AX = ['자산(채권)','자산(비상장주식)','자산(펀드)','자산(가상자산)','고객(고액자산가)','고객(기관)','시장(해외)'];
    const cos = []; D.axis.forEach(r => { if (!cos.includes(r['회사'])) cos.push(r['회사']); });
    h += `<h2>회사별 KDX 확장 축</h2><p class="lead">칸에는 그 회사가 그 축에서 한 일을 한 줄로 적었습니다. 빈칸은 한 일이 없거나 확인되지 않은 것입니다. 칸을 누르면 출처가 나옵니다.</p><div class="tbl"><table><thead><tr><th>회사</th>${AX.map(a => `<th>${a}</th>`).join('')}</tr></thead><tbody>` +
      cos.map(co => `<tr><td>${coBtn(co)}</td>${AX.map(a => { const it = D.axis.map((r,i) => [r,i]).filter(([r]) => r['회사'] === co && r['축'] === a); return `<td>${it.map(([r,i]) => `<div data-srcrow="ax${i}" style="cursor:pointer">${esc(r['한 일(한 줄)'] || r['한 일'] || '')}${r['시점']?` <span class="detail">${esc(r['시점'])}${r['확보 방식']?', '+esc(r['확보 방식']):''}</span>`:''}${openSrc.has('ax'+i)?evHtml(r):''}</div>`).join('')}</td>`; }).join('')}</tr>`).join('') + '</tbody></table></div>';
  }
  if ((D.perp||[]).length){
    h += `<h2>대체재: 주식 무기한선물과 주식 토큰 현물</h2><p class="lead">같은 지표끼리만 나란히 둡니다. 거래대금, 발행 잔액, 미결제약정은 서로 비교하지 않습니다.</p>` + (D.perp_concl||[]).map(c => `<p style="margin:2px 0">${esc(c)}</p>`).join('');
    D.perp.forEach((tb,ti) => { h += `<h3 style="font-size:15px;margin:14px 0 6px">${esc(tb.sec)}</h3><div class="tbl"><table><thead><tr>${tb.head.map(x => `<th>${esc(x)}</th>`).join('')}<th>출처</th></tr></thead><tbody>` + tb.rows.map((r,i) => `<tr>${r.cells.map(c => `<td>${esc(c)}</td>`).join('')}<td>${srcCell('pp'+ti+'_'+i, r.src)}</td></tr>`).join('') + '</tbody></table></div>'; });
  }
  h += `<h2>발행 잔액 순위</h2><p class="lead">같은 출처 rwa.xyz. 지금 값은 분산형 토큰화 주식 플랫폼 표 ${esc(R[0]?.date||'')}, 과거 값은 Sentora 주간 글(2026-01-09)에 실린 rwa.xyz 표(2026-01 초). 배수는 직접 계산했습니다.</p><div class="tbl"><table><thead><tr><th>순위</th><th>회사(상품)</th><th>발행 잔액</th><th style="min-width:170px">점유율</th><th>2026-01 초</th><th>배수</th><th>출처</th></tr></thead><tbody>` +
    R.map((r,i) => `<tr class="${r.slug?'':'orange'}"><td class="n">${r.rank}</td><td>${r.slug?`<button class="golink" type="button" data-goco="${r.slug}">${esc(r.name)}</button>`:esc(r.name)+' <span class="detail">(조사 대상 밖, 추가 확인)</span>'}</td><td class="n">${fmtUsd(r.usd)}</td><td><div class="bar${r.slug?'':' orange'}"><div class="track"><div class="fill" style="width:${(r.usd/max*100).toFixed(1)}%"></div></div><span class="n" style="font-variant-numeric:tabular-nums">${esc(r.share)}%</span></div></td><td class="n">${r.past?`${fmtUsd(r.past.usd)}, ${esc(r.past.share)}%, ${r.past.rank}위`:'<span class="detail">표에 없음</span>'}</td><td class="n">${r.past?r.past.x+'배':''}</td><td>${srcCell('rk'+i, (r.src||[]).concat(r.past?r.past.src:[]))}</td></tr>`).join('') +
    (D.rank_total?`<tr><td></td><td><b>시장 전체</b></td><td class="n">${fmtUsd(D.rank_total.now)}</td><td></td><td class="n">${fmtUsd(D.rank_total.past)}(표 9곳 합)</td><td class="n">${(D.rank_total.now/D.rank_total.past).toFixed(1)}배</td><td>${srcCell('rkt', D.rank_total.src)}</td></tr>`:'') + '</tbody></table></div>' +
    `<p class="detail">2026-01 초 표에는 Binance, Robinhood, Coinbase가 없습니다(출시 전이거나 집계 전). 그때 없던 Binance가 11월 1위입니다.</p>` + figsHtml('past');
  const cols = ['원주 보관사','법적 성격(우리 분류)','판매 지역','투자설명서 승인 관할','한국 주식 계획'];
  h += `<h2>회사별 한 줄</h2><div class="tbl"><table><thead><tr><th>회사</th><th>상품</th>${cols.map(c => `<th>${c}</th>`).join('')}<th>출처</th></tr></thead><tbody>` +
    D.cross.map((r,i) => `<tr><td>${coBtn(r['회사'])}</td><td>${esc(r['상품'])}</td>${cols.map(c => `<td>${esc(r[c])}</td>`).join('')}<td>${srcCell('cr'+i, r.src)}</td></tr>`).join('') + '</tbody></table></div>';
  h += `<h2>미국 야간 ATS 3곳</h2><p class="lead">점유율은 FINRA 주간 보고 거래대금 13주 합산을 야간 3사 합계로 나눈 값입니다.</p><div class="tbl"><table><thead><tr><th>ATS</th><th>운영사</th><th>개장</th><th>2026 Q2 점유율</th><th>2026 Q3 점유율</th><th>한국 증권사 연결</th><th>출처</th></tr></thead><tbody>` +
    D.ats.map((r,i) => `<tr><td>${coBtn(r['ATS'])}</td><td>${esc(r['운영사'])}</td><td>${esc(r['개장'])}</td><td class="n">${esc(r['2026 Q2 점유율'])}</td><td class="n">${esc(r['2026 Q3 점유율'])}</td><td>${esc(r['한국 증권사 연결'])}</td><td>${srcCell('at'+i, r.src)}</td></tr>`).join('') + '</tbody></table></div>';
  h += `<h2>사건 연표</h2><div class="tl">` + D.events.map((e,i) => `<div class="ev2"><div class="d">${esc(e['날짜'])}</div><div><b>${coBtn(e['누가'])}</b> ${esc(e['무슨 일'])} ${srcCell('evt'+i, e.src)}</div></div>`).join('') + '</div></div>';
  $('#main').innerHTML = h;
}
function fmtUsd(v){ if (v >= 1e8) return (v/1e8).toFixed(v >= 1e9 ? 1 : 2).replace(/\.?0+$/,'') + '억 달러'; return Math.round(v/1e4).toLocaleString('ko-KR') + '만 달러'; }

const STAGES = ['발행','체결','청산','기록','접점'];
const STAGE_DESC = {'발행':'토큰이나 상품을 내는 법인','체결':'거래소, ATS, 파생 거래소','청산':'청산, 결제, 보관','기록':'명의개서, 권리 기록','접점':'고객 주문 접수, 중개'};
function renderLic(){
  const cos = []; D.lic.forEach(r => { if (!cos.includes(r.co)) cos.push(r.co); });
  let h = `<div class="wide"><h1>인가와 관계</h1><p class="lead">인가 지도를 등록부(BrokerCheck, CFTC 목록 등)와 대조해 고친 값입니다. 칸을 누르면 하는 일, 등록부와 다른 점, 출처가 나옵니다. Securitize, tZERO는 이번 조사 대상 밖이라 주황으로 둡니다.</p>`;
  h += `<h2>생태계 지도(제3자)</h2>` + figsHtml('lic') + `<h2>회사별 밸류체인</h2><div class="legend"><span><i class="own"></i>직접 가짐</span><span><i class="ent"></i>남에게 맡김</span><span>"인수"는 남의 회사를 사서 얻은 자격과 그 시점</span></div>`;
  h += `<div style="overflow-x:auto"><div class="vc"><div class="h first"></div>${STAGES.map(s => `<div class="h" title="${STAGE_DESC[s]}">${s}<div style="font-weight:400;font-size:11px">${STAGE_DESC[s]}</div></div>`).join('')}`;
  cos.forEach(co => {
    const orange = D.lic.some(r => r.co === co && r.orange);
    h += `<div class="co2${orange?' orange':''}">${coBtn(co)}</div>`;
    STAGES.forEach(st => {
      const items = D.lic.map((r,i) => [r,i]).filter(([r]) => r.co === co && r.stage === st);
      h += '<div class="cell">' + (items.length ? items.map(([r,i]) => `<div class="it ${r.own==='맡김'?'ent':'own'}" data-lic="${i}" tabindex="0">${esc(r.own==='맡김' ? r.lic : (r.ent || r.lic))}${r.how==='인수'?`<span class="acq">인수 ${esc(r.target)} ${esc(r.when)}</span>`:(r.when?`<span class="acq">${r.own==='맡김'?'':'직접 '}${esc(r.when)}</span>`:'')}${r.regwhen?`<span class="acq" style="font-weight:400">등록부 ${esc(r.regwhen)}</span>`:''}</div>`).join('') : '<div class="none">없음</div>') + '</div>';
    });
  });
  h += '</div></div>';
  const op = [...openLic].map(i => D.lic[i]).filter(Boolean);
  if (op.length) h += '<div style="display:grid;gap:6px;margin-top:10px">' + op.map(r => `<div class="ev" style="margin:0"><p><b>${esc(r.co)} ${esc(r.job)}</b>: ${esc(r.lic)}${r.ent?` (${esc(r.ent)})`:''}${r.place?`, ${esc(r.place)}`:''}</p>${r.does?`<p>${esc(r.does)}</p>`:''}${r.note?`<p class="e">등록부: ${esc(r.note)}</p>`:''}<p>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">출처</a>`:''}${r.reg?` <a href="${esc(r.reg)}" target="_blank" rel="noopener">등록부</a>`:''}</p></div>`).join('') + '</div>';
  const kinds = ['all','인수','투자','제휴','위탁','자회사','자금 조달'];
  const q = relQ.trim().toLowerCase();
  let rows = D.rel.filter(r => (relKind === 'all' || r.kind === relKind) && (!q || (r.a + ' ' + r.b + ' ' + r.what).toLowerCase().includes(q)));
  rows.sort((a,b) => String(b.when).localeCompare(String(a.when)));
  h += `<h2>관계 표</h2><input class="search" id="rel-q" type="search" placeholder="회사 이름으로 찾기 (예: Alpaca)" value="${esc(relQ)}"><div class="chips">${kinds.map(k => `<button type="button" data-relk="${k}" aria-pressed="${relKind===k}">${k==='all'?'전체':k}</button>`).join('')}</div>
    <div class="tbl"><table><thead><tr><th>누가</th><th>누구와</th><th>무엇을</th><th>언제</th><th>내용</th><th>출처</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${coBtn(r.a)}</td><td>${coBtn(r.b)}</td><td>${esc(r.kind)}</td><td style="white-space:nowrap">${esc(r.when)}</td><td>${esc(r.what)}${r.give||r.get?`<div class="detail">${r.give?'주는 것: '+esc(r.give):''}${r.give&&r.get?'. ':''}${r.get?'받는 것: '+esc(r.get):''}</div>`:''}</td><td>${r.url?`<a class="src" href="${esc(r.url)}" target="_blank" rel="noopener">출처</a>`:''}</td></tr>`).join('') +
    `</tbody></table></div><p class="detail">${rows.length}건</p></div>`;
  $('#main').innerHTML = h;
}

function lawLinks(arr){ return '<div class="lawl">' + arr.map(l => l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.e||'')}">${esc(l.t)}</a>` : `<span>${esc(l.t)}</span>`).join('') + '</div>'; }
function renderRules(){
  let h = `<div class="wide"><h1>제도와 용어</h1><p class="lead">모든 회사에 공통인 한미 제도 차이입니다. 조문 이름을 누르면 원문으로 갑니다.</p>`;
  h += `<h2>한미 제도 비교</h2><div class="tbl"><table><thead><tr><th>쟁점</th><th>미국 제도</th><th>미국 조문</th><th>한국 제도</th><th>한국 조문</th><th>차이에 따른 결과</th></tr></thead><tbody>` +
    D.reg.map(r => `<tr><td><b>${withTerms(r.issue)}</b></td><td>${withTerms(r.us)}</td><td>${lawLinks(r.us_law)}</td><td>${withTerms(r.kr)}</td><td>${lawLinks(r.kr_law)}</td><td>${withTerms(r.diff)}</td></tr>`).join('') + '</tbody></table></div>';
  if ((D.tp_reg||[]).length){ const hd0 = D.tp_reg[0].head; const keep = hd0.map((x,i) => x === '근거' ? -1 : i).filter(i => i >= 0); const hd = keep.map(i => hd0[i]); h += `<h2>제3자 자료로 본 쟁점</h2><p class="lead">외부 보고서와 기사의 지적을 우리 DB와 대조했습니다. 발행처와 입장을 함께 적었습니다.</p><div class="tbl"><table><thead><tr>${hd.map(x => `<th>${esc(x)}</th>`).join('')}<th>출처</th></tr></thead><tbody>` + D.tp_reg.map((r,i) => `<tr>${keep.map(k => r.cells[k] || '').map(c => `<td>${withTerms(c.replace(/\[?TP-\d{3}\]?/g,'').replace(/F-\d{4}/g,''))}</td>`).join('')}<td>${srcCell('tr'+i, r.src)}</td></tr>`).join('') + '</tbody></table></div>'; }
  h += `<h2>구조 그림(제3자)</h2><p class="lead">주식이 움직이는 길과 토큰화 방식별 흐름입니다. 발행처와 입장을 그림 아래에 적었습니다.</p>` + figsHtml('rules');
  h += `<h2>모든 회사에 공통인 한국 시장 사정</h2><p class="lead">회사 본문에서 빼고 여기에 한 번만 둡니다.</p><div class="tbl"><table><thead><tr><th>줄</th><th>내용</th><th>출처</th></tr></thead><tbody>` +
    D.common.map((r,i) => `<tr><td><b>${esc(r.t)}</b></td><td>${esc(r.d)}</td><td>${srcCell('cm'+i, r.src)}</td></tr>`).join('') + '</tbody></table></div>';
  const q = termQ.trim().toLowerCase();
  const T = D.terms.filter(t => !q || (t.t + ' ' + t.en + ' ' + t.e).toLowerCase().includes(q));
  h += `<h2>용어</h2><input class="search" id="term-q" type="search" placeholder="용어 찾기" value="${esc(termQ)}"><p class="detail">${T.length}개</p><div class="gl">` +
    T.map(t => `<div class="g"><b>${esc(t.t)}</b>${t.en?`<span class="en">${esc(t.en)}</span>`:''}<div>${esc(t.e)}</div>${t.p&&t.d?`<div class="en">헷갈리는 짝: ${esc(t.p)}. ${esc(t.d)}</div>`:''}${t.kr?`<div class="en">한국: ${esc(t.kr)}</div>`:''}</div>`).join('') + '</div></div>';
  $('#main').innerHTML = h;
}
document.addEventListener('input', e => {
  if (e.target.id === 'rel-q'){ relQ = e.target.value; const pos = e.target.selectionStart; renderLic(); const el = $('#rel-q'); el.focus(); el.setSelectionRange(pos,pos); }
  if (e.target.id === 'term-q'){ termQ = e.target.value; const pos = e.target.selectionStart; renderRules(); const el = $('#term-q'); el.focus(); el.setSelectionRange(pos,pos); }
});

// ---------- 시작 ----------
const fromHash = location.hash.slice(1);
cur = CO[fromHash] ? fromHash : (CO['overview'] ? 'overview' : D.companies[0].slug);
if (fromHash.startsWith('v-') && ['compare','lic','rules'].includes(fromHash.slice(2))) view = fromHash.slice(2);
renderNav(); render();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (CO[h] && (h !== cur || view !== 'read')){ cur = h; view = 'read'; render(); } else if (h.startsWith('v-') && h.slice(2) !== view && ['compare','lic','rules'].includes(h.slice(2))){ view = h.slice(2); render(); } });
})();
</script>
